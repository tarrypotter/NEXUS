<script>
'use strict';
const KEY='nexus_workspace_v1';const pages=[['dashboard','개요','▦'],['tasks','업무 관리','☷'],['projects','프로젝트','▣'],['calendar','캘린더','▦'],['team','팀 관리','♙'],['analytics','분석 리포트','◫'],['settings','설정','⚙']];const statuses=[['todo','할 일'],['progress','진행 중'],['review','검토'],['done','완료']];const priorities=[['low','낮음'],['medium','보통'],['high','높음']];let page='dashboard',historyStack=[],filterProject='all',filterStatus='all',filterSearch='',calendarOffset=0,toastTimer;const dateISO=(d)=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const plusDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return dateISO(d)};const uid=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v??'').trim();const findName=(arr,id,fallback='미지정')=>arr.find(x=>x.id===id)?.name||fallback;const label=(arr,id)=>arr.find(x=>x[0]===id)?.[1]||id;const formatDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'-';const now=()=>new Date().toISOString();
function seed(){const a=uid(),b=uid(),c=uid(),m1=uid(),m2=uid(),m3=uid(),m4=uid();return {version:1,theme:'light',members:[{id:m1,name:'김서연',role:'프로덕트 매니저',email:'seoyeon@example.com'},{id:m2,name:'박지훈',role:'프론트엔드 개발자',email:'jihoon@example.com'},{id:m3,name:'이하린',role:'UI/UX 디자이너',email:'harin@example.com'},{id:m4,name:'최도윤',role:'백엔드 개발자',email:'doyun@example.com'}],projects:[{id:a,name:'NEXUS 플랫폼 리뉴얼',description:'플랫폼 경험과 대시보드 개편',color:'#665ce9',createdAt:now()},{id:b,name:'모바일 앱 출시',description:'반응형 모바일 앱 경험 최적화',color:'#16ae92',createdAt:now()},{id:c,name:'분석 시스템 고도화',description:'지표와 리포트 자동화',color:'#e8a14d',createdAt:now()}],tasks:[{id:uid(),title:'대시보드 컴포넌트 개발',description:'반응형 카드 및 위젯 구성',projectId:a,assigneeId:m2,status:'progress',priority:'high',due:plusDays(2),createdAt:now()},{id:uid(),title:'디자인 시스템 정리',description:'컬러, 타이포그래피, 간격 정의',projectId:a,assigneeId:m3,status:'done',priority:'medium',due:plusDays(-2),createdAt:now()},{id:uid(),title:'사용자 온보딩 설계',description:'첫 사용 흐름 최적화',projectId:b,assigneeId:m1,status:'todo',priority:'high',due:plusDays(5),createdAt:now()},{id:uid(),title:'REST API 명세 작성',description:'엔드포인트와 요청 스키마 문서화',projectId:b,assigneeId:m4,status:'review',priority:'medium',due:plusDays(1),createdAt:now()},{id:uid(),title:'리포트 시각화 개선',description:'기간별 성과 차트 구성',projectId:c,assigneeId:m2,status:'todo',priority:'low',due:plusDays(8),createdAt:now()},{id:uid(),title:'품질 점검 및 QA',description:'주요 워크플로우 테스트',projectId:a,assigneeId:m1,status:'done',priority:'high',due:plusDays(-1),createdAt:now()}],activities:[]}}let data;function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.tasks)&&Array.isArray(saved.projects)&&Array.isArray(saved.members)){data=saved;data.activities=Array.isArray(saved.activities)?saved.activities:[];return}}catch(e){}data=seed();save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('저장 공간 오류: JSON 백업을 권장합니다')}}function log(action){data.activities.unshift({id:uid(),action,at:now()});data.activities=data.activities.slice(0,80)}function commit(action){if(action)log(action);save();render();if(action)toast(action)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}function navigate(next,record=true){if(!pages.some(p=>p[0]===next))return;if(page!==next&&record)historyStack.push(page);page=next;filterSearch='';render();window.scrollTo(0,0)}function goBack(){if(document.getElementById('modal').classList.contains('open')){closeModal();return}navigate(historyStack.pop()||'dashboard',false)}function toggleTheme(){data.theme=data.theme==='dark'?'light':'dark';save();render()}function head(title,subtitle,action=''){return `<div class="headrow"><div><h1 class="page-title">${title}</h1><div class="sub">${subtitle}</div></div>${action}</div>`}function btnNewTask(){return '<button class="btn-primaryx" onclick="openTask()">＋ 새 업무</button>'}function pillStatus(s){let cl=s==='done'?'good':s==='review'?'warn':'';return `<span class="pill ${cl}">${esc(label(statuses,s))}</span>`}function pillPriority(p){return `<span class="pill ${p==='high'?'bad':p==='low'?'good':''}">${esc(label(priorities,p))}</span>`}function pct(p){let a=data.tasks.filter(t=>t.projectId===p.id);return a.length?Math.round(a.filter(t=>t.status==='done').length/a.length*100):0}function stat(title,num,foot,icon){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-symbol">${icon}</span></div><div class="stat-number">${num}</div><div class="stat-foot">${foot}</div></div>`}function dashboard(){let total=data.tasks.length,done=data.tasks.filter(t=>t.status==='done').length,active=data.tasks.filter(t=>t.status==='progress').length,over=data.tasks.filter(t=>t.status!=='done'&&t.due&&t.due<dateISO(new Date())).length;return head('워크스페이스 개요','오늘도 한눈에 업무 현황을 확인하세요.',btnNewTask())+`<div class="stats">${stat('전체 프로젝트',data.projects.length,'등록된 프로젝트 수','▣')}${stat('진행 중인 업무',active,'전체 '+total+'개 업무 중','◷')}${stat('완료된 업무',done,'전체 완료율 '+(total?Math.round(done/total*100):0)+'%','✓')}${stat('기한 지난 업무',over,over?'확인이 필요한 업무':'모든 일정 정상','!')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>프로젝트 진행 현황</h3><button class="btn-soft" onclick="navigate('projects')">전체 보기 →</button></div>${data.projects.length?data.projects.slice(0,5).map(p=>`<div class="project-row" onclick="openProject('${p.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><div class="project-name"><span style="color:${esc(p.color)}">●</span> ${esc(p.name)}</div><b style="font-size:12px">${pct(p)}%</b></div><div class="progress-track"><div class="progress-value" style="width:${pct(p)}%;background:${esc(p.color)}"></div></div><div class="project-meta"><span>${data.tasks.filter(t=>t.projectId===p.id).length}개 업무</span><span>${data.tasks.filter(t=>t.projectId===p.id&&t.status==='done').length}개 완료</span></div></div>`).join(''):'<div class="empty">프로젝트를 만들어 시작해 보세요.</div>'}</section><section class="panel"><div class="panel-title"><h3>최근 활동</h3><span class="tiny muted">최신 업데이트</span></div>${activities(6)}</section><section class="panel"><div class="panel-title"><h3>마감 예정 업무</h3><button class="btn-soft" onclick="navigate('tasks')">업무 관리 →</button></div>${upcoming()}</section><section class="panel"><div class="panel-title"><h3>업무 분포</h3><span class="tiny muted">상태별 현황</span></div>${statusBars()}</section></div>`}function upcoming(){let tasks=data.tasks.filter(t=>t.status!=='done'&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);return tasks.length?tasks.map(t=>`<div class="project-row" onclick="openTask('${t.id}')"><div class="d-flex justify-content-between align-items-center gap-2"><div class="project-name">${esc(t.title)}</div><span class="tiny ${t.due<dateISO(new Date())?'':'muted'}" style="color:${t.due<dateISO(new Date())?'var(--bad)':''}">${formatDate(t.due)}</span></div><div class="project-meta"><span>${esc(findName(data.projects,t.projectId))}</span><span>${esc(findName(data.members,t.assigneeId))}</span></div></div>`).join(''):'<div class="empty">마감 예정 업무가 없습니다.</div>'}function statusBars(){let n=Math.max(data.tasks.length,1);return statuses.map(([k,v])=>{let count=data.tasks.filter(t=>t.status===k).length;return `<div style="margin:14px 0"><div class="d-flex justify-content-between tiny"><b>${v}</b><span>${count}개</span></div><div class="progress-track"><div class="progress-value" style="width:${count/n*100}%"></div></div></div>`}).join('')}function activities(n=25){return data.activities.length?data.activities.slice(0,n).map(a=>`<div class="activity"><div class="activity-dot">↗</div><div><div class="activity-text">${esc(a.action)}</div><div class="activity-time">${new Date(a.at).toLocaleString('ko-KR')}</div></div></div>`).join(''):'<div class="empty">업무를 추가하거나 변경하면 여기에 활동이 기록됩니다.</div>'}
function taskFilters(){return `<div class="toolbar"><input class="search" aria-label="업무 검색" placeholder="⌕ 업무 제목·내용 검색" value="${esc(filterSearch)}" oninput="filterSearch=this.value;renderBoard()"><div class="d-flex gap-2 flex-wrap"><select class="field" aria-label="프로젝트 필터" onchange="filterProject=this.value;renderBoard()"><option value="all">모든 프로젝트</option>${data.projects.map(p=>`<option value="${p.id}" ${filterProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select class="field" aria-label="상태 필터" onchange="filterStatus=this.value;renderBoard()"><option value="all">모든 상태</option>${statuses.map(([s,v])=>`<option value="${s}" ${filterStatus===s?'selected':''}>${v}</option>`).join('')}</select></div></div>`}function filteredTasks(){return data.tasks.filter(t=>(filterProject==='all'||t.projectId===filterProject)&&(filterStatus==='all'||t.status===filterStatus)&&(!filterSearch||(t.title+' '+t.description+' '+findName(data.projects,t.projectId)).toLowerCase().includes(filterSearch.toLowerCase())))}function boardMarkup(){let ts=filteredTasks();return `<div class="board">${statuses.map(([key,title])=>`<section class="column" data-status="${key}" ondragover="event.preventDefault();this.classList.add('drop-target')" ondragleave="this.classList.remove('drop-target')" ondrop="dropTask(event,'${key}')"><div class="column-head"><span>${title}</span><span class="count">${ts.filter(t=>t.status===key).length}</span></div>${ts.filter(t=>t.status===key).map(t=>`<article class="task" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="openTask('${t.id}')"><div class="d-flex justify-content-between gap-2">${pillPriority(t.priority)}<span class="tiny muted">${formatDate(t.due)}</span></div><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(findName(data.projects,t.projectId))}</div><div class="task-info" style="margin-top:14px"><span>${esc(findName(data.members,t.assigneeId))}</span><span>↗</span></div></article>`).join('')||'<div class="empty">업무 없음</div>'}</section>`).join('')}</div>`}function tasksPage(){return head('업무 관리','드래그로 상태를 이동하거나, 업무를 눌러 상세 내용을 수정하세요.',btnNewTask())+`<div id="taskArea">${taskFilters()}<div id="boardArea">${boardMarkup()}</div></div>`}function renderBoard(){const area=document.getElementById('taskArea');if(!area)return;const input=area.querySelector('.search');let focused=document.activeElement===input;let pos=input?.selectionStart;area.innerHTML=taskFilters()+`<div id="boardArea">${boardMarkup()}</div>`;if(focused){let el=area.querySelector('.search');el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}function dropTask(e,s){e.preventDefault();e.currentTarget.classList.remove('drop-target');let t=data.tasks.find(t=>t.id===e.dataTransfer.getData('text/plain'));if(t&&t.status!==s){t.status=s;commit('업무 상태 변경: '+t.title+' → '+label(statuses,s))}}function projectsPage(){return head('프로젝트','프로젝트별 진행률과 업무를 통합 관리합니다.','<button class="btn-primaryx" onclick="openProject()">＋ 새 프로젝트</button>')+`<div class="team-grid">${data.projects.map(p=>`<div class="panel" style="cursor:pointer" onclick="openProject('${p.id}')"><div style="font-size:25px;color:${esc(p.color)}">▣</div><h3 style="font-size:16px;font-weight:800;margin:13px 0 8px">${esc(p.name)}</h3><div class="sub" style="min-height:36px">${esc(p.description)}</div><div class="d-flex justify-content-between tiny" style="margin-top:20px"><span>${data.tasks.filter(t=>t.projectId===p.id).length}개 업무</span><b>${pct(p)}% 완료</b></div><div class="progress-track"><div class="progress-value" style="width:${pct(p)}%;background:${esc(p.color)}"></div></div><button class="btn-soft w-100" style="margin-top:12px">프로젝트 관리 →</button></div>`).join('')}</div>${!data.projects.length?'<div class="empty">프로젝트가 없습니다.</div>':''}`}function teamPage(){return head('팀 관리','담당자와 구성원의 역할을 관리하세요.','<button class="btn-primaryx" onclick="openMember()">＋ 팀원 추가</button>')+`<div class="team-grid">${data.members.map(m=>`<div class="member" style="cursor:pointer" onclick="openMember('${m.id}')"><div class="avatar">${esc(m.name.slice(0,2))}</div><div style="min-width:0"><strong>${esc(m.name)}</strong><small>${esc(m.role)}</small><small style="overflow:hidden;text-overflow:ellipsis">${esc(m.email||'이메일 없음')}</small><small>담당 업무 ${data.tasks.filter(t=>t.assigneeId===m.id).length}개</small></div></div>`).join('')}</div>${!data.members.length?'<div class="empty">팀원을 추가하세요.</div>':''}`}function calendarPage(){let current=new Date();current.setDate(1);current.setMonth(current.getMonth()+calendarOffset);let y=current.getFullYear(),m=current.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let cells=[];for(let i=0;i<Math.ceil((first+last)/7)*7;i++){let d=i-first+1,key=dateISO(new Date(y,m,d)),valid=d>=1&&d<=last,ev=data.tasks.filter(t=>t.due===key);cells.push(`<div class="day ${valid?'':'faded'} ${key===dateISO(new Date())?'today':''}" onclick="${valid?`openDay('${key}')`:''}"><b>${valid?d:''}</b>${valid?ev.slice(0,3).map(t=>`<div class="event">${esc(t.title)}</div>`).join(''):''}${ev.length>3?`<div class="tiny muted">+${ev.length-3}</div>`:''}</div>`)}return head('캘린더','업무 마감일과 일정을 월별로 확인하세요.',btnNewTask())+`<div class="panel"><div class="panel-title"><h3>${y}년 ${m+1}월</h3><div class="d-flex gap-2"><button class="btn-soft" onclick="calendarOffset--;render()">‹</button><button class="btn-soft" onclick="calendarOffset=0;render()">오늘</button><button class="btn-soft" onclick="calendarOffset++;render()">›</button></div></div><div class="calendar-grid">${['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></div>`}function analyticsPage(){let counts=statuses.map(([s])=>data.tasks.filter(t=>t.status===s).length),mx=Math.max(1,...counts);return head('분석 리포트','워크스페이스의 현재 성과를 시각화합니다.','<button class="btn-soft" onclick="exportCSV()">↓ CSV 내보내기</button>')+`<div class="stats">${stat('전체 업무',data.tasks.length,'등록된 업무','☷')}${stat('완료율',data.tasks.length?Math.round(counts[3]/data.tasks.length*100)+'%':'0%','완료 업무 기준','✓')}${stat('팀 구성원',data.members.length,'업무 담당자','♙')}${stat('프로젝트',data.projects.length,'진행 현황 포함','▣')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>상태별 업무 통계</h3></div><div class="chart">${statuses.map(([s,v],i)=>`<div class="chart-col"><div class="tiny">${counts[i]}</div><div class="chart-bar" style="height:${counts[i]/mx*100}%"></div></div>`).join('')}</div><div class="d-flex justify-content-around" style="margin-top:14px">${statuses.map(([,v])=>`<span class="tiny muted">${v}</span>`).join('')}</div></section><section class="panel"><div class="panel-title"><h3>프로젝트 완료율</h3></div>${data.projects.map(p=>`<div style="margin-bottom:23px"><div class="d-flex justify-content-between tiny"><b>${esc(p.name)}</b><span>${pct(p)}%</span></div><div class="progress-track"><div class="progress-value" style="background:${esc(p.color)};width:${pct(p)}%"></div></div></div>`).join('')||'<div class="empty">표시할 프로젝트 없음</div>'}</section></div><div class="panel section-gap"><div class="panel-title"><h3>업무 데이터</h3></div><div class="table-wrap"><table class="tablex"><thead><tr><th>업무명</th><th>프로젝트</th><th>담당자</th><th>상태</th><th>마감일</th></tr></thead><tbody>${data.tasks.map(t=>`<tr class="clickable" onclick="openTask('${t.id}')"><td><b>${esc(t.title)}</b></td><td>${esc(findName(data.projects,t.projectId))}</td><td>${esc(findName(data.members,t.assigneeId))}</td><td>${pillStatus(t.status)}</td><td>${formatDate(t.due)}</td></tr>`).join('')}</tbody></table></div></div>`}function settingsPage(){return head('설정 및 데이터','사용 환경과 로컬 데이터의 백업 및 복원을 관리합니다.')+`<div class="panel" style="max-width:740px;margin-bottom:20px"><div class="panel-title"><h3>빠른 이동</h3></div><div class="d-flex gap-2 flex-wrap"><button class="btn-soft" onclick="navigate('team')">♙ 팀 관리</button><button class="btn-soft" onclick="navigate('analytics')">◫ 분석 리포트</button><button class="btn-soft" onclick="navigate('projects')">▣ 프로젝트</button></div></div><div class="panel" style="max-width:740px"><div class="panel-title"><h3>워크스페이스 설정</h3></div><div class="settings-row"><div><b style="font-size:13px">다크 모드</b><div class="sub">어두운 화면으로 변경합니다.</div></div><button class="btn-soft" onclick="toggleTheme()">${data.theme==='dark'?'☀ 라이트 모드':'☾ 다크 모드'}</button></div><div class="settings-row"><div><b style="font-size:13px">JSON 전체 백업</b><div class="sub">프로젝트, 업무, 팀, 활동 내역을 파일로 저장합니다.</div></div><button class="btn-soft" onclick="exportJSON()">↓ 백업</button></div><div class="settings-row"><div><b style="font-size:13px">JSON 데이터 복원</b><div class="sub">백업 파일을 불러옵니다. 현재 데이터는 대체됩니다.</div></div><button class="btn-soft" onclick="document.getElementById('importFile').click()">↑ 복원</button></div><div class="settings-row"><div><b style="font-size:13px">데모 데이터 초기화</b><div class="sub">현재 데이터를 초기 샘플로 되돌립니다.</div></div><button class="btn-soft" style="color:var(--bad)" onclick="resetDemo()">초기화</button></div></div><div class="panel section-gap" style="max-width:740px"><h3 style="font-size:15px;font-weight:800">데이터 및 기술 안내</h3><p class="sub" style="line-height:1.9">NEXUS는 단일 HTML 파일로 실행되는 로컬 우선형 업무 플랫폼입니다. 모든 편집은 현재 브라우저의 localStorage에 저장됩니다. 서버와 계정 간 자동 동기화는 지원하지 않으며, 브라우저 데이터 삭제 또는 저장소 격리 시 기록이 사라질 수 있으므로 JSON 백업을 정기적으로 보관하세요. Bootstrap 5는 CDN으로 연결되며 오프라인에서도 핵심 기능은 동작하지만 스타일은 캐시 상태에 따라 달라질 수 있습니다.</p><span class="pill">NEXUS v1.0 · Single File</span></div>`}
function render(){document.body.dataset.theme=data.theme==='dark'?'dark':'light';document.querySelector('meta[name=theme-color]').content=data.theme==='dark'?'#0e1423':'#f5f7fb';document.getElementById('themeButton').textContent=data.theme==='dark'?'☀':'☾';document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});document.getElementById('crumb').textContent=pages.find(p=>p[0]===page)[1];document.getElementById('sidebarNav').innerHTML=pages.filter(p=>p[0]!=='settings').map(([p,n,i])=>`<button class="nav-itemx ${page===p?'active':''}" onclick="navigate('${p}')"><span class="nav-icon">${i}</span>${n}</button>`).join('');document.getElementById('mobileNav').innerHTML=[...pages.slice(0,4),pages[6]].map(([p,n,i])=>`<button aria-label="${n}" class="${page===p?'active':''}" onclick="navigate('${p}')"><span>${i}</span>${n}</button>`).join('');document.getElementById('main').innerHTML=({dashboard, tasks:tasksPage,projects:projectsPage,calendar:calendarPage,team:teamPage,analytics:analyticsPage,settings:settingsPage}[page])()}
function modal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}function options(arr,id){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}function selectOpts(arr,id){return arr.map(([k,v])=>`<option value="${k}" ${k===id?'selected':''}>${v}</option>`).join('')}function openTask(id='',date=''){let t=data.tasks.find(x=>x.id===id)||{title:'',description:'',projectId:data.projects[0]?.id||'',assigneeId:'',status:'todo',priority:'medium',due:date};modal(`<div class="d-flex align-items-center justify-content-between"><h2>${id?'업무 상세 및 수정':'새 업무 만들기'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form id="taskForm" onsubmit="saveTask(event,'${id}')"><label class="formlabel">업무 제목 *</label><input class="field" name="title" maxlength="110" required value="${esc(t.title)}" placeholder="예: 대시보드 개발"><label class="formlabel">상세 설명</label><textarea class="field" name="description" maxlength="1500" placeholder="업무 설명을 입력하세요">${esc(t.description)}</textarea><div class="form-grid"><div><label class="formlabel">프로젝트</label><select class="field" name="projectId"><option value="">미지정</option>${options(data.projects,t.projectId)}</select></div><div><label class="formlabel">담당자</label><select class="field" name="assigneeId"><option value="">미지정</option>${options(data.members,t.assigneeId)}</select></div><div><label class="formlabel">업무 상태</label><select class="field" name="status">${selectOpts(statuses,t.status)}</select></div><div><label class="formlabel">우선순위</label><select class="field" name="priority">${selectOpts(priorities,t.priority)}</select></div></div><label class="formlabel">마감일</label><input class="field" name="due" type="date" value="${esc(t.due)}"><div class="dialog-bottom">${id?`<button type="button" class="btn-soft" style="color:var(--bad);margin-right:auto" onclick="deleteItem('task','${id}')">삭제</button>`:''}<button type="button" class="btn-soft" onclick="closeModal()">취소</button><button class="btn-primaryx" type="submit">${id?'변경 저장':'업무 생성'}</button></div></form>`)}function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),title=clean(f.get('title'));if(!title)return;let t=data.tasks.find(x=>x.id===id);if(!t){t={id:uid(),createdAt:now()};data.tasks.push(t)}Object.assign(t,{title,description:clean(f.get('description')),projectId:String(f.get('projectId')),assigneeId:String(f.get('assigneeId')),status:String(f.get('status')),priority:String(f.get('priority')),due:String(f.get('due')),updatedAt:now()});closeModal();commit((id?'업무 수정: ':'새 업무 생성: ')+title)}function openProject(id=''){let p=data.projects.find(x=>x.id===id)||{name:'',description:'',color:'#665ce9'};modal(`<div class="d-flex justify-content-between align-items-center"><h2>${id?'프로젝트 수정':'새 프로젝트'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form onsubmit="saveProject(event,'${id}')"><label class="formlabel">프로젝트 이름 *</label><input class="field" name="name" required maxlength="90" value="${esc(p.name)}"><label class="formlabel">설명</label><textarea class="field" name="description" maxlength="500">${esc(p.description)}</textarea><label class="formlabel">프로젝트 색상</label><input type="color" name="color" value="${/^#[0-9a-fA-F]{6}$/.test(p.color)?p.color:'#665ce9'}" style="width:55px;height:38px;border:0;background:transparent"><div class="dialog-bottom">${id?`<button type="button" class="btn-soft" style="color:var(--bad);margin-right:auto" onclick="deleteItem('project','${id}')">삭제</button><button type="button" class="btn-soft" onclick="viewProjectTasks('${id}')">업무 보기</button>`:''}<button type="button" class="btn-soft" onclick="closeModal()">취소</button><button class="btn-primaryx">저장</button></div></form>`)}function saveProject(e,id){e.preventDefault();let f=new FormData(e.target),name=clean(f.get('name'));if(!name)return;let p=data.projects.find(x=>x.id===id);if(!p){p={id:uid(),createdAt:now()};data.projects.push(p)}Object.assign(p,{name,description:clean(f.get('description')),color:String(f.get('color'))});closeModal();commit((id?'프로젝트 수정: ':'프로젝트 생성: ')+name)}function viewProjectTasks(id){closeModal();navigate('tasks');filterProject=id;render()}function openMember(id=''){let m=data.members.find(x=>x.id===id)||{name:'',role:'',email:''};modal(`<div class="d-flex justify-content-between align-items-center"><h2>${id?'팀원 수정':'팀원 추가'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form onsubmit="saveMember(event,'${id}')"><label class="formlabel">이름 *</label><input class="field" name="name" maxlength="60" required value="${esc(m.name)}"><label class="formlabel">역할 / 직책</label><input class="field" name="role" maxlength="70" value="${esc(m.role)}"><label class="formlabel">이메일</label><input class="field" type="email" name="email" maxlength="130" value="${esc(m.email)}"><div class="dialog-bottom">${id?`<button type="button" class="btn-soft" style="color:var(--bad);margin-right:auto" onclick="deleteItem('member','${id}')">삭제</button>`:''}<button type="button" class="btn-soft" onclick="closeModal()">취소</button><button class="btn-primaryx">저장</button></div></form>`)}function saveMember(e,id){e.preventDefault();let f=new FormData(e.target),name=clean(f.get('name'));if(!name)return;let m=data.members.find(x=>x.id===id);if(!m){m={id:uid()};data.members.push(m)}Object.assign(m,{name,role:clean(f.get('role')),email:clean(f.get('email'))});closeModal();commit((id?'팀원 수정: ':'팀원 추가: ')+name)}function deleteItem(type,id){let config={task:['tasks','업무'],project:['projects','프로젝트'],member:['members','팀원']}[type];if(!config)return;let item=data[config[0]].find(x=>x.id===id);if(!item||!confirm(`${config[1]} '${item.name||item.title}'을(를) 삭제할까요?\n연관 업무는 삭제되지 않고 미지정으로 표시됩니다.`))return;data[config[0]]=data[config[0]].filter(x=>x.id!==id);if(type==='project')data.tasks.forEach(t=>{if(t.projectId===id)t.projectId=''});if(type==='member')data.tasks.forEach(t=>{if(t.assigneeId===id)t.assigneeId=''});closeModal();commit(config[1]+' 삭제: '+(item.name||item.title))}function openDay(date){let arr=data.tasks.filter(t=>t.due===date);modal(`<div class="d-flex justify-content-between align-items-center"><h2>${esc(date)} 일정</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div style="margin-top:18px">${arr.length?arr.map(t=>`<div class="project-row" onclick="openTask('${t.id}')"><b class="project-name">${esc(t.title)}</b><div class="project-meta"><span>${esc(findName(data.projects,t.projectId))}</span><span>${esc(label(statuses,t.status))}</span></div></div>`).join(''):'<div class="empty">이 날짜에 예정된 업무가 없습니다.</div>'}</div><button class="btn-primaryx w-100" style="margin-top:16px" onclick="openTask('','${date}')">＋ 이 날짜에 업무 추가</button>`)}function openSearch(){modal(`<div class="d-flex justify-content-between align-items-center"><h2>빠른 검색</h2><button class="iconbtn" onclick="closeModal()">×</button></div><input autofocus class="field" style="margin-top:20px" placeholder="프로젝트 또는 업무 검색" oninput="searchAll(this.value)"><div id="searchResults" style="margin-top:13px"></div>`);searchAll('')}function searchAll(v){let q=v.toLowerCase(),tasks=data.tasks.filter(t=>t.title.toLowerCase().includes(q)),projects=data.projects.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=(tasks.slice(0,12).map(t=>`<div class="project-row" onclick="openTask('${t.id}')"><b class="project-name">☷ ${esc(t.title)}</b><div class="project-meta">${esc(findName(data.projects,t.projectId))}</div></div>`).join('')+projects.slice(0,6).map(p=>`<div class="project-row" onclick="openProject('${p.id}')"><b class="project-name">▣ ${esc(p.name)}</b></div>`).join(''))||'<div class="empty">검색 결과가 없습니다.</div>'}function download(name,blob){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportJSON(){download('NEXUS_backup_'+dateISO(new Date())+'.json',new Blob([JSON.stringify({...data,exportedAt:now()},null,2)],{type:'application/json'}));toast('JSON 백업 파일을 저장했습니다')}function importJSON(e){let file=e.target.files[0];e.target.value='';if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d||!Array.isArray(d.projects)||!Array.isArray(d.tasks)||!Array.isArray(d.members)||d.projects.some(p=>!p.id||!p.name)||d.tasks.some(t=>!t.id||!t.title)||d.members.some(m=>!m.id||!m.name))throw Error('형식이 올바르지 않습니다');if(!confirm('현재 데이터를 JSON 백업 내용으로 완전히 교체할까요?'))return;data={version:1,theme:d.theme==='dark'?'dark':'light',projects:d.projects,members:d.members,tasks:d.tasks,activities:Array.isArray(d.activities)?d.activities:[]};save();navigate('dashboard');toast('데이터 복원이 완료되었습니다')}catch(err){toast('복원 실패: '+err.message)}};reader.readAsText(file)}function resetDemo(){if(!confirm('현재 데이터가 모두 초기화됩니다. 진행할까요?'))return;if(!confirm('정말 초기화할까요? 필요하면 먼저 JSON으로 백업하세요.'))return;data=seed();save();navigate('dashboard');toast('샘플 데이터로 초기화했습니다')}function exportCSV(){let rows=[['업무명','설명','프로젝트','담당자','상태','우선순위','마감일'],...data.tasks.map(t=>[t.title,t.description,findName(data.projects,t.projectId),findName(data.members,t.assigneeId),label(statuses,t.status),label(priorities,t.priority),t.due])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('NEXUS_tasks_'+dateISO(new Date())+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));toast('CSV가 저장되었습니다')}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});load();render();
</script></body></html>

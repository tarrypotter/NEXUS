<aside class="sidebar"><div class="brand"><div class="logo">✦</div>NEXUS <span style="font-size:9px;color:var(--muted);letter-spacing:0">WORKSPACE</span></div><div class="side-label">WORKSPACE</div><nav id="sidebarNav"></nav><div class="side-bottom"><button class="nav-itemx" onclick="navigate('settings')"><span class="nav-icon">⚙</span> 설정 및 데이터</button><div class="profile"><div class="avatar">NX</div><div><div style="font-size:12px;font-weight:800">NEXUS Admin</div><div class="tiny muted">Workspace Owner · Local</div></div></div></div></aside>
<div class="content"><header class="topbar"><div style="display:flex;align-items:center;gap:9px"><button class="iconbtn mobile-back" id="backBtn" onclick="goBack()" aria-label="뒤로가기">‹</button><div class="mobile-topbrand"><span class="mobile-topbrand-mark">✦</span><span>NEXUS<small>WORKSPACE</small></span></div><div class="crumb">Workspace <span style="margin:0 7px">/</span> <b id="crumb">개요</b></div></div><div class="top-actions"><span class="tiny muted top-hide" id="todayLabel"></span><button class="iconbtn" aria-label="검색" onclick="openSearch()">⌕</button><button class="iconbtn" id="themeButton" onclick="toggleTheme()" aria-label="테마 전환">☾</button><button class="iconbtn" aria-label="새 업무" onclick="openTask()">＋</button></div></header><main id="main" class="main"></main></div>
</div><nav class="mobile-nav" id="mobileNav" aria-label="하단 메뉴"></nav><div class="modalx" id="modal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()"><div id="dialog" class="dialog"></div></div><div class="toastx" id="toast" role="status"></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importJSON(event)">
<script>
'use strict';
const KEY='nexus_workspace_v1';const pages=[['dashboard','개요','▦'],['tasks','업무 관리','☷'],['projects','프로젝트','▣'],['calendar','캘린더','▦'],['team','팀 관리','♙'],['analytics','분석 리포트','◫'],['settings','설정','⚙']];const statuses=[['todo','할 일'],['progress','진행 중'],['review','검토'],['done','완료']];const priorities=[['low','낮음'],['medium','보통'],['high','높음']];let page='dashboard',historyStack=[],filterProject='all',filterStatus='all',filterSearch='',calendarOffset=0,toastTimer;const dateISO=(d)=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const plusDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return dateISO(d)};const uid=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v??'').trim();const findName=(arr,id,fallback='미지정')=>arr.find(x=>x.id===id)?.name||fallback;const label=(arr,id)=>arr.find(x=>x[0]===id)?.[1]||id;const formatDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'-';const now=()=>new Date().toISOString();
function seed(){const a=uid(),b=uid(),c=uid(),m1=uid(),m2=uid(),m3=uid(),m4=uid();return {version:1,theme:'light',members:[{id:m1,name:'김서연',role:'프로덕트 매니저',email:'seoyeon@example.com'},{id:m2,name:'박지훈',role:'프론트엔드 개발자',email:'jihoon@example.com'},{id:m3,name:'이하린',role:'UI/UX 디자이너',email:'harin@example.com'},{id:m4,name:'최도윤',role:'백엔드 개발자',email:'doyun@example.com'}],projects:[{id:a,name:'NEXUS 플랫폼 리뉴얼',description:'플랫폼 경험과 대시보드 개편',color:'#665ce9',createdAt:now()},{id:b,name:'모바일 앱 출시',description:'반응형 모바일 앱 경험 최적화',color:'#16ae92',createdAt:now()},{id:c,name:'분석 시스템 고도화',description:'지표와 리포트 자동화',color:'#e8a14d',createdAt:now()}],tasks:[{id:uid(),title:'대시보드 컴포넌트 개발',description:'반응형 카드 및 위젯 구성',projectId:a,assigneeId:m2,status:'progress',priority:'high',due:plusDays(2),createdAt:now()},{id:uid(),title:'디자인 시스템 정리',description:'컬러, 타이포그래피, 간격 정의',projectId:a,assigneeId:m3,status:'done',priority:'medium',due:plusDays(-2),createdAt:now()},{id:uid(),title:'사용자 온보딩 설계',description:'첫 사용 흐름 최적화',projectId:b,assigneeId:m1,status:'todo',priority:'high',due:plusDays(5),createdAt:now()},{id:uid(),title:'REST API 명세 작성',description:'엔드포인트와 요청 스키마 문서화',projectId:b,assigneeId:m4,status:'review',priority:'medium',due:plusDays(1),createdAt:now()},{id:uid(),title:'리포트 시각화 개선',description:'기간별 성과 차트 구성',projectId:c,assigneeId:m2,status:'todo',priority:'low',due:plusDays(8),createdAt:now()},{id:uid(),title:'품질 점검 및 QA',description:'주요 워크플로우 테스트',projectId:a,assigneeId:m1,status:'done',priority:'high',due:plusDays(-1),createdAt:now()}],activities:[]}}let data;function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.tasks)&&Array.isArray(saved.projects)&&Array.isArray(saved.members)){data=saved;data.activities=Array.isArray(saved.activities)?saved.activities:[];return}}catch(e){}data=seed();save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('저장 공간 오류: JSON 백업을 권장합니다')}}function log(action){data.activities.unshift({id:uid(),action,at:now()});data.activities=data.activities.slice(0,80)}function commit(action){if(action)log(action);save();render();if(action)toast(action)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}function navigate(next,record=true){if(!pages.some(p=>p[0]===next))return;if(page!==next&&record)historyStack.push(page);page=next;filterSearch='';render();window.scrollTo(0,0)}function goBack(){if(document.getElementById('modal').classList.contains('open')){closeModal();return}navigate(historyStack.pop()||'dashboard',false)}function toggleTheme(){data.theme=data.theme==='dark'?'light':'dark';save();render()}function head(title,subtitle,action=''){return `<div class="headrow"><div><h1 class="page-title">${title}</h1><div class="sub">${subtitle}</div></div>${action}</div>`}function btnNewTask(){return '<button class="btn-primaryx" onclick="openTask()">＋ 새 업무</button>'}function pillStatus(s){let cl=s==='done'?'good':s==='review'?'warn':'';return `<span class="pill ${cl}">${esc(label(statuses,s))}</span>`}function pillPriority(p){return `<span class="pill ${p==='high'?'bad':p==='low'?'good':''}">${esc(label(priorities,p))}</span>`}function pct(p){let a=data.tasks.filter(t=>t.projectId===p.id);return a.length?Math.round(a.filter(t=>t.status==='done').length/a.length*100):0}function stat(title,num,foot,icon){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-symbol">${icon}</span></div><div class="stat-number">${num}</div><div class="stat-foot">${foot}</div></div>`}function dashboard(){let total=data.tasks.length,done=data.tasks.filter(t=>t.status==='done').length,active=data.tasks.filter(t=>t.status==='progress').length,over=data.tasks.filter(t=>t.status!=='done'&&t.due&&t.due<dateISO(new Date())).length;return head('워크스페이스 개요','오늘도 한눈에 업무 현황을 확인하세요.',btnNewTask())+`<div class="stats">${stat('전체 프로젝트',data.projects.length,'등록된 프로젝트 수','▣')}${stat('진행 중인 업무',active,'전체 '+total+'개 업무 중','◷')}${stat('완료된 업무',done,'전체 완료율 '+(total?Math.round(done/total*100):0)+'%','✓')}${stat('기한 지난 업무',over,over?'확인이 필요한 업무':'모든 일정 정상','!')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>프로젝트 진행 현황</h3><button class="btn-soft" onclick="navigate('projects')">전체 보기 →</button></div>${data.projects.length?data.projects.slice(0,5).map(p=>`<div class="project-row" onclick="openProject('${p.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><div class="project-name"><span style="color:${esc(p.color)}">●</span> ${esc(p.name)}</div><b style="font-size:12px">${pct(p)}%</b></div><div class="progress-track"><div class="progress-value" style="width:${pct(p)}%;background:${esc(p.color)}"></div></div><div class="project-meta"><span>${data.tasks.filter(t=>t.projectId===p.id).length}개 업무</span><span>${data.tasks.filter(t=>t.projectId===p.id&&t.status==='done').length}개 완료</span></div></div>`).join(''):'<div class="empty">프로젝트를 만들어 시작해 보세요.</div>'}</section><section class="panel"><div class="panel-title"><h3>최근 활동</h3><span class="tiny muted">최신 업데이트</span></div>${activities(6)}</section><section class="panel"><div class="panel-title"><h3>마감 예정 업무</h3><button class="btn-soft" onclick="navigate('tasks')">업무 관리 →</button></div>${upcoming()}</section><section class="panel"><div class="panel-title"><h3>업무 분포</h3><span class="tiny muted">상태별 현황</span></div>${statusBars()}</section></div>`}function upcoming(){let tasks=data.tasks.filter(t=>t.status!=='done'&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);return tasks.length?tasks.map(t=>`<div class="project-row" onclick="openTask('${t.id}')"><div class="d-flex justify-content-between align-items-center gap-2"><div class="project-name">${esc(t.title)}</div><span class="tiny ${t.due<dateISO(new Date())?'':'muted'}" style="color:${t.due<dateISO(new Date())?'var(--bad)':''}">${formatDate(t.due)}</span></div><div class="project-meta"><span>${esc(findName(data.projects,t.projectId))}</span><span>${esc(findName(data.members,t.assigneeId))}</span></div></div>`).join(''):'<div class="empty">마감 예정 업무가 없습니다.</div>'}function statusBars(){let n=Math.max(data.tasks.length,1);return statuses.map(([k,v])=>{let count=data.tasks.filter(t=>t.status===k).length;return `<div style="margin:14px 0"><div class="d-flex justify-content-between tiny"><b>${v}</b><span>${count}개</span></div><div class="progress-track"><div class="progress-value" style="width:${count/n*100}%"></div></div></div>`}).join('')}function activities(n=25){return data.activities.length?data.activities.slice(0,n).map(a=>`<div class="activity"><div class="activity-dot">↗</div><div><div class="activity-text">${esc(a.action)}</div><div class="activity-time">${new Date(a.at).toLocaleString('ko-KR')}</div></div></div>`).join(''):'<div class="empty">업무를 추가하거나 변경하면 여기에 활동이 기록됩니다.</div>'}
function taskFilters(){return `<div class="toolbar"><input class="search" aria-label="업무 검색" placeholder="⌕ 업무 제목·내용 검색" value="${esc(filterSearch)}" oninput="filterSearch=this.value;renderBoard()"><div class="d-flex gap-2 flex-wrap"><select class="field" aria-label="프로젝트 필터" onchange="filterProject=this.value;renderBoard()"><option value="all">모든 프로젝트</option>${data.projects.map(p=>`<option value="${p.id}" ${filterProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select class="field" aria-label="상태 필터" onchange="filterStatus=this.value;renderBoard()"><option value="all">모든 상태</option>${statuses.map(([s,v])=>`<option value="${s}" ${filterStatus===s?'selected':''}>${v}</option>`).join('')}</select></div></div>`}function filteredTasks(){return data.tasks.filter(t=>(filterProject==='all'||t.projectId===filterProject)&&(filterStatus==='all'||t.status===filterStatus)&&(!filterSearch||(t.title+' '+t.description+' '+findName(data.projects,t.projectId)).toLowerCase().includes(filterSearch.toLowerCase())))}function boardMarkup(){let ts=filteredTasks();return `<div class="board">${statuses.map(([key,title])=>`<section class="column" data-status="${key}" ondragover="event.preventDefault();this.classList.add('drop-target')" ondragleave="this.classList.remove('drop-target')" ondrop="dropTask(event,'${key}')"><div class="column-head"><span>${title}</span><span class="count">${ts.filter(t=>t.status===key).length}</span></div>${ts.filter(t=>t.status===key).map(t=>`<article class="task" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="openTask('${t.id}')"><div class="d-flex justify-content-between gap-2">${pillPriority(t.priority)}<span class="tiny muted">${formatDate(t.due)}</span></div><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(findName(data.projects,t.projectId))}</div><div class="task-info" style="margin-top:14px"><span>${esc(findName(data.members,t.assigneeId))}</span><span>↗</span></div></article>`).join('')||'<div class="empty">업무 없음</div>'}</section>`).join('')}</div>`}function tasksPage(){return head('업무 관리','드래그로 상태를 이동하거나, 업무를 눌러 상세 내용을 수정하세요.',btnNewTask())+`<div id="taskArea">${taskFilters()}<div id="boardArea">${boardMarkup()}</div></div>`}function renderBoard(){const area=document.getElementById('taskArea');if(!area)return;const input=area.querySelector('.search');let focused=document.activeElement===input;let pos=input?.selectionStart;area.innerHTML=taskFilters()+`<div id="boardArea">${boardMarkup()}</div>`;if(focused){let el=area.querySelector('.search');el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}function dropTask(e,s){e.preventDefault();e.currentTarget.classList.remove('drop-target');let t=data.tasks.find(t=>t.id===e.dataTransfer.getData('text/plain'));if(t&&t.status!==s){t.status=s;commit('업무 상태 변경: '+t.title+' → '+label(statuses,s))}}function projectsPage(){return head('프로젝트','프로젝트별 진행률과 업무를 통합 관리합니다.','<button class="btn-primaryx" onclick="openProject()">＋ 새 프로젝트</button>')+`<div class="team-grid">${data.projects.map(p=>`<div class="panel" style="cursor:pointer" onclick="openProject('${p.id}')"><div style="font-size:25px;color:${esc(p.color)}">▣</div><h3 style="font-size:16px;font-weight:800;margin:13px 0 8px">${esc(p.name)}</h3><div class="sub" style="min-height:36px">${esc(p.description)}</div><div class="d-flex justify-content-between tiny" style="margin-top:20px"><span>${data.tasks.filter(t=>t.projectId===p.id).length}개 업무</span><b>${pct(p)}% 완료</b></div><div class="progress-track"><div class="progress-value" style="width:${pct(p)}%;background:${esc(p.color)}"></div></div><button class="btn-soft w-100" style="margin-top:12px">프로젝트 관리 →</button></div>`).join('')}</div>${!data.projects.length?'<div class="empty">프로젝트가 없습니다.</div>':''}`}function teamPage(){return head('팀 관리','담당자와 구성원의 역할을 관리하세요.','<button class="btn-primaryx" onclick="openMember()">＋ 팀원 추가</button>')+`<div class="team-grid">${data.members.map(m=>`<div class="member" style="cursor:pointer" onclick="openMember('${m.id}')"><div class="avatar">${esc(m.name.slice(0,2))}</div><div style="min-width:0"><strong>${esc(m.name)}</strong><small>${esc(m.role)}</small><small style="overflow:hidden;text-overflow:ellipsis">${esc(m.email||'이메일 없음')}</small><small>담당 업무 ${data.tasks.filter(t=>t.assigneeId===m.id).length}개</small></div></div>`).join('')}</div>${!data.members.length?'<div class="empty">팀원을 추가하세요.</div>':''}`}function calendarPage(){let current=new Date();current.setDate(1);current.setMonth(current.getMonth()+calendarOffset);let y=current.getFullYear(),m=current.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let cells=[];for(let i=0;i<Math.ceil((first+last)/7)*7;i++){let d=i-first+1,key=dateISO(new Date(y,m,d)),valid=d>=1&&d<=last,ev=data.tasks.filter(t=>t.due===key);cells.push(`<div class="day ${valid?'':'faded'} ${key===dateISO(new Date())?'today':''}" onclick="${valid?`openDay('${key}')`:''}"><b>${valid?d:''}</b>${valid?ev.slice(0,3).map(t=>`<div class="event">${esc(t.title)}</div>`).join(''):''}${ev.length>3?`<div class="tiny muted">+${ev.length-3}</div>`:''}</div>`)}return head('캘린더','업무 마감일과 일정을 월별로 확인하세요.',btnNewTask())+`<div class="panel"><div class="panel-title"><h3>${y}년 ${m+1}월</h3><div class="d-flex gap-2"><button class="btn-soft" onclick="calendarOffset--;render()">‹</button><button class="btn-soft" onclick="calendarOffset=0;render()">오늘</button><button class="btn-soft" onclick="calendarOffset++;render()">›</button></div></div><div class="calendar-grid">${['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></div>`}function analyticsPage(){let counts=statuses.map(([s])=>data.tasks.filter(t=>t.status===s).length),mx=Math.max(1,...counts);return head('분석 리포트','워크스페이스의 현재 성과를 시각화합니다.','<button class="btn-soft" onclick="exportCSV()">↓ CSV 내보내기</button>')+`<div class="stats">${stat('전체 업무',data.tasks.length,'등록된 업무','☷')}${stat('완료율',data.tasks.length?Math.round(counts[3]/data.tasks.length*100)+'%':'0%','완료 업무 기준','✓')}${stat('팀 구성원',data.members.length,'업무 담당자','♙')}${stat('프로젝트',data.projects.length,'진행 현황 포함','▣')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>상태별 업무 통계</h3></div><div class="chart">${statuses.map(([s,v],i)=>`<div class="chart-col"><div class="tiny">${counts[i]}</div><div class="chart-bar" style="height:${counts[i]/mx*100}%"></div></div>`).join('')}</div><div class="d-flex justify-content-around" style="margin-top:14px">${statuses.map(([,v])=>`<span class="tiny muted">${v}</span>`).join('')}</div></section><section class="panel"><div class="panel-title"><h3>프로젝트 완료율</h3></div>${data.projects.map(p=>`<div style="margin-bottom:23px"><div class="d-flex justify-content-between tiny"><b>${esc(p.name)}</b><span>${pct(p)}%</span></div><div class="progress-track"><div class="progress-value" style="background:${esc(p.color)};width:${pct(p)}%"></div></div></div>`).join('')||'<div class="empty">표시할 프로젝트 없음</div>'}</section></div><div class="panel section-gap"><div class="panel-title"><h3>업무 데이터</h3></div><div class="table-wrap"><table class="tablex"><thead><tr><th>업무명</th><th>프로젝트</th><th>담당자</th><th>상태</th><th>마감일</th></tr></thead><tbody>${data.tasks.map(t=>`<tr class="clickable" onclick="openTask('${t.id}')"><td><b>${esc(t.title)}</b></td><td>${esc(findName(data.projects,t.projectId))}</td><td>${esc(findName(data.members,t.assigneeId))}</td><td>${pillStatus(t.status)}</td><td>${formatDate(t.due)}</td></tr>`).join('')}</tbody></table></div></div>`}function settingsPage(){return head('설정 및 데이터','사용 환경과 로컬 데이터의 백업 및 복원을 관리합니다.')+`<div class="panel" style="max-width:740px;margin-bottom:20px"><div class="panel-title"><h3>빠른 이동</h3></div><div class="d-flex gap-2 flex-wrap"><button class="btn-soft" onclick="navigate('team')">♙ 팀 관리</button><button class="btn-soft" oncl const NX24_VERSION='2.4';
function nx24Completion(){
 const customProjects=data.projects.filter(p=>p && !['NEXUS 플랫폼 리뉴얼','모바일 앱 출시','분석 시스템 고도화'].includes(p.name));
 const customMembers=data.members.filter(m=>m && !['김서연','박지훈','이하린','최도윤'].includes(m.name));
 const newTasks=data.tasks.filter(t=>t && !['대시보드 컴포넌트 개발','디자인 시스템 정리','사용자 온보딩 설계','REST API 명세 작성','리포트 시각화 개선','품질 점검 및 QA'].includes(t.title));
 return [customProjects.length>0,customMembers.length>0,newTasks.length>0,data.tasks.some(t=>t.status==='done' && newTasks.some(n=>n.id===t.id))];
}
function nx24StartPanel(){const checks=nx24Completion(),done=checks.filter(Boolean).length;
 const steps=[['프로젝트 만들기','큰 목표부터 만들어요. 예: 쇼핑몰 제작.','projects','프로젝트 등록'],['담당자 등록','함께 일할 사람의 이름과 역할을 등록해요.','team','팀원 등록'],['업무 만들기','담당자·마감일·우선순위를 설정해요.','tasks','새 업무 만들기'],['진행·완료하기','업무 상태를 완료로 바꾸면 진행률이 계산돼요.','tasks','업무 보드 열기']];
 return `<section class="nx24-start" aria-label="NEXUS 빠른 시작"><span class="eyebrow">QUICK START · NEXUS ${NX24_VERSION}</span><h2 class="nx24-title">처음이라면 이 순서대로 시작하세요</h2><p class="nx24-desc">NEXUS는 회사의 프로젝트와 팀원, 할 일을 한곳에서 관리하는 업무 플랫폼입니다. 아래 4가지를 따라 하면 사용 흐름을 익힐 수 있어요. 기본 제공된 예시 데이터는 진행도에 포함하지 않습니다.</p><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px"><strong>나의 시작 단계</strong><b>${done} / 4 완료</b></div><div class="nx24-progress" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="4"><span style="width:${done*25}%"></span></div><div class="nx24-grid">${steps.map(([title,desc,target,action],i)=>`<div class="nx24-step ${checks[i]?'done':''}"><span class="nx24-mark">${checks[i]?'✓':i+1}</span><strong>${title}</strong><small>${desc}</small><button class="btn-soft" onclick="nx24Go('${target}',${i})">${checks[i]?'다시 보기':action+' →'}</button></div>`).join('')}</div><div class="nx24-actions"><button class="btn-primaryx" onclick="nx24Demo()">＋ 연습용 프로젝트 추가</button><button class="btn-soft" onclick="navigate('help')">자세한 사용법</button><button class="btn-soft" onclick="navigate('settings')">JSON 백업</button></div></section>`;
}
function nx24Go(target,step){if(target==='projects'){navigate('projects');openProject();return}if(target==='team'){navigate('team');openMember();return}navigate(target);if(step===2)openTask();}
function nx24Demo(){
 if(!confirm('연습용 「포트폴리오 웹사이트 제작」 프로젝트와 업무 4개를 추가할까요? 기존 데이터는 삭제되지 않습니다.'))return;

 const items=[['요구사항 정리','todo','high',7],['화면 디자인','progress','medium',10],['메인 페이지 개발','todo','high',14],['기능 테스트 및 배포','todo','medium',18]];
 items.forEach(([title,status,priority,days])=>data.tasks.push({id:uid(),title,description:'연습용 업무입니다. 상세 화면에서 체크리스트와 댓글을 추가해 보세요.',projectId:id,assigneeId:member,status,priority,due:plusDays(days),createdAt:now(),checklist:[],comments:[]}));
 commit('연습용 프로젝트 및 업무 4개 추가');openProjectDetails(id);
}

/* v2.5: List / Kanban, assignee + priority filters and sort. Never changes persisted data schema. */
let nx25View='list',nx25Assignee='all',nx25Priority='all',nx25Sort='due';
function nx25SortTasks(arr){return [...arr].sort((a,b)=>{if(nx25Sort==='title')return (a.title||'').localeCompare(b.title||'','ko');if(nx25Sort==='priority'){const rank={high:0,medium:1,low:2};return (rank[a.priority]??3)-(rank[b.priority]??3)}if(nx25Sort==='recent')return (b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'');return (a.due||'9999-12-31').localeCompare(b.due||'9999-12-31')})}
const nx25PreviousFiltered=filteredTasks;
filteredTasks=function(){return nx25SortTasks(nx25PreviousFiltered().filter(t=>(nx25Assignee==='all'||t.assigneeId===nx25Assignee)&&(nx25Priority==='all'||t.priority===nx25Priority)))};
function nx25FilterControls(){const selector=(a,label,options,selected,handler)=>`<select class="field" aria-label="${label}" onchange="${handler}=this.value;renderBoard()"><option value="all">${label}</option>${options.map(([id,name])=>`<option value="${esc(id)}" ${selected===id?'selected':''}>${esc(name)}</option>`).join('')}</select>`;return `<div class="nx25-filtergrid"><input class="search" aria-label="업무 검색" placeholder="⌕ 업무 제목·설명 검색" value="${esc(filterSearch)}" oninput="filterSearch=this.value;renderBoard()">${selector(null,'모든 프로젝트',data.projects.map(p=>[p.id,p.name]),filterProject,'filterProject')}${selector(null,'모든 상태',statuses,filterStatus,'filterStatus')}${selector(null,'모든 담당자',data.members.map(m=>[m.id,m.name]),nx25Assignee,'nx25Assignee')}${selector(null,'모든 우선순위',priorities,nx25Priority,'nx25Priority')}<select class="field" aria-label="정렬 방식" onchange="nx25Sort=this.value;renderBoard()">${[['due','마감일 빠른 순'],['recent','최근 수정 순'],['priority','우선순위 높은 순'],['title','제목 가나다순']].map(([id,name])=>`<option value="${id}" ${nx25Sort===id?'selected':''}>${name}</option>`).join('')}</select><button class="nx25-clear" onclick="nx25ClearFilters()">필터 초기화 ↺</button></div>`}
function nx25ClearFilters(){filterProject='all';filterStatus='all';filterSearch='';nx25Assignee='all';nx25Priority='all';nx25Sort='due';renderBoard()}
function nx25Switch(view){nx25View=view;renderBoard()}
function nx25Status(event,id){event.stopPropagation();const t=data.tasks.find(x=>x.id===id);if(!t||!statuses.some(x=>x[0]===event.target.value))return;if(t.status===event.target.value)return;t.status=event.target.value;t.updatedAt=now();commit('업무 상태 변경: '+t.title+' → '+label(statuses,t.status))}
function nx25List(){let ts=filteredTasks();if(!ts.length)return `<div class="nx25-empty"><strong>조건에 맞는 업무가 없어요</strong>검색어 또는 필터를 바꾸거나 새 업무를 추가하세요.<div style="margin-top:14px"><button class="btn-soft" onclick="nx25ClearFilters()">필터 초기화</button> <button class="btn-primaryx" onclick="openTask()">＋ 업무 추가</button></div></div>`;return `<div class="nx25-list" role="table" aria-label="업무 리스트"><div class="nx25-listheader"><span>업무 / 프로젝트</span><span>담당자</span><span>우선순위</span><span>진행 상태</span><span>마감일</span></div>${ts.map(t=>`<div class="nx25-listrow" role="row" onclick="openTask('${t.id}')"><div><div class="nx25-primary">${esc(t.title)}</div><div class="nx25-secondary">${esc(findName(data.projects,t.projectId))}</div></div><span>${esc(findName(data.members,t.assigneeId))}</span><span>${pillPriority(t.priority)}</span><select class="nx25-status" aria-label="${esc(t.title)} 상태 변경" onclick="event.stopPropagation()" onchange="nx25Status(event,'${t.id}')">${selectOpts(statuses,t.status)}</select><span class="${t.due && t.due<dateISO(new Date()) && t.status!=='done'?'text-danger':'muted'}">${formatDate(t.due)}</span></div>`).join('')}</div>`}

const nx27WorkflowSteps={requested:'요청됨',accepted:'수락됨',working:'진행 중',submitted:'검토 요청',rejected:'반려됨',approved:'승인 완료'};
function nx27Flow(t){if(!t.workflow||typeof t.workflow!=='object')t.workflow={phase:t.status==='done'?'approved':t.status==='review'?'submitted':t.status==='progress'?'working':'requested',events:[]};if(!Array.isArray(t.workflow.events))t.workflow.events=[];return t.workflow}

 const t=data.tasks.find(x=>x.id===id);if(t){const f=nx27Flow(t);const pills=document.querySelector('#dialog .detail-pills');if(pills){const a=document.createElement('span');a.className='detail-pill';a.textContent='처리 단계: '+nx27WorkflowSteps[f.phase];pills.appendChild(a)}}

 const actorOptions=data.members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)} · ${esc(m.role||'팀원')}</option>`).join('');
 const actions={requested:[['accept','요청 수락'],['reject','요청 반려']],accepted:[['start','작업 시작']],working:[['submit','검토 요청']],submitted:[['approve','완료 승인'],['reject','수정 요청·반려']],rejected:[['resume','다시 진행']],approved:[['reopen','재작업 요청']]};
 const actionLabels={accept:'요청 수락',reject:'반려',start:'작업 시작',submit:'검토 요청',approve:'완료 승인',resume:'작업 재개',reopen:'재작업 요청'};
 modal(`<div class="v2-modal-head"><div><div class="eyebrow">TASK APPROVAL WORKFLOW</div><h2>${esc(t.title)}</h2><p class="muted" style="font-size:12px">프로젝트 · ${esc(findName(data.projects,t.projectId))}</p></div><button class="iconbtn" onclick="closeModal()" aria-label="닫기">×</button></div>
 <div class="nx27-flow-status"><span class="nx27-dot"></span><b>${nx27WorkflowSteps[f.phase]}</b><span class="muted tiny">업무 처리 현황</span></div>
 <div class="nx27-steps">${Object.entries(nx27WorkflowSteps).filter(([k])=>k!=='rejected').map(([k,v])=>`<span class="${k===f.phase?'active':''}">${v}</span>`).join('')}</div>
 <form onsubmit="nx27DoAction(event,'${id}')"><label class="formlabel">처리 담당자 (로컬 시뮬레이션)</label><select class="field" name="actor" required><option value="">담당자를 선택하세요</option>${actorOptions}</select><label class="formlabel">업무 보고 / 승인 의견</label><textarea class="field" name="message" maxlength="1200" rows="3" placeholder="진행 결과, 수정 요청사항 등을 기록하세요"></textarea><label class="formlabel">처리 작업</label><div class="nx27-actions">${(actions[f.phase]||[]).map(([v,n])=>`<button type="submit" name="action" value="${v}" class="${v==='approve'?'btn-primaryx':'btn-soft'}">${n}</button>`).join('')}</div></form>
 <div class="nx27-history"><h3>진행·승인 기록 <span class="muted tiny">${f.events.length}건</span></h3>${f.events.slice().reverse().map(e=>`<div class="nx27-event"><span class="nx27-dot"></span><div><b>${esc(e.label||actionLabels[e.action]||'상태 변경')}</b><small>${esc(e.actorName||'사용자')} · ${formatWhen(e.at)}</small>${e.message?`<p>${esc(e.message)}</p>`:''}</div></div>`).join('')||'<div class="empty">아직 처리 기록이 없습니다. 요청 수락부터 시작해 보세요.</div>'}</div>
 <div class="dialog-bottom"><button class="btn-soft" onclick="openTaskDetails('${id}')">← 업무 상세</button><button class="btn-primaryx" onclick="closeModal()">닫기</button></div>`)
}
function nx27DoAction(e,id){e.preventDefault();const form=e.target;const submitter=e.submitter;const action=submitter?.value;const f=new FormData(form);const actorId=String(f.get('actor')||'');const message=clean(f.get('message'));const member=data.members.find(m=>m.id===actorId);const t=data.tasks.find(t=>t.id===id);if(!t||!member)return toast('담당자를 선택하세요');
 const flow=nx27Flow(t);const transitions={requested:{accept:'accepted',reject:'rejected'},accepted:{start:'working'},working:{submit:'submitted'},submitted:{approve:'approved',reject:'rejected'},rejected:{resume:'working'},approved:{reopen:'requested'}};
 const next=transitions[flow.phase]?.[action];if(!next)return toast('현재 단계에서 사용할 수 없는 작업입니다');
 if(['reject','submit','approve','reopen'].includes(action)&&!message){toast('보고 또는 승인 의견을 입력해 주세요');return}
 const actionName={accept:'요청 수락',reject:'반려·수정 요청',start:'작업 시작',submit:'검토 요청',approve:'완료 승인',resume:'작업 재개',reopen:'재작업 요청'}[action];
 flow.phase=next;flow.events.push({id:uid(),action,label:actionName,actorId,actorName:member.name,message,at:now()});
 flow.events=flow.events.slice(-100);t.status=next==='approved'?'done':next==='submitted'?'review':['working','accepted','rejected'].includes(next)?'progress':'todo';t.updatedAt=now();
 commit('업무 처리: '+t.title+' · '+actionName+' ('+member.name+')');nx27WorkflowDialog(id)
}

function nx28Bar(){const myCount=nx28Person==='all'?0:nx28MemberTasks().length;const items=[['mine','내 업무',myCount],['team','팀 업무',data.tasks.length],['review','승인 대기',nx28ReviewTasks().length]];
 return `<section class="nx28-switcher"><div class="nx28-top"><div><strong>업무 워크스페이스</strong><div><small>담당자별 업무와 검토 요청을 빠르게 확인하세요.</small></div></div><select class="field" aria-label="현재 담당자 선택" onchange="nx28SelectPerson(this.value)"><option value="all" ${nx28Person==='all'?'selected':''}>담당자 선택 · 전체 보기</option>${data.members.map(m=>`<option value="${esc(m.id)}" ${nx28Person===m.id?'selected':''}>${esc(m.name)} · ${esc(m.role||'팀원')}</option>`).join('')}</select></div><div class="nx28-tabs">${items.map(([id,title,count])=>`<button type="button" class="${nx28Tab===id?'active':''}" onclick="nx28Switch('${id}')" aria-pressed="${nx28Tab===id}">${title}<b>${count}</b></button>`).join('')}</div><div class="nx28-info">${nx28Tab==='mine'?(nx28Person==='all'?'내 업무를 보려면 위에서 담당자를 선택하세요.':`선택한 담당자에게 배정된 업무만 표시합니다. · ${esc(findName(data.members,nx28Person))}`):nx28Tab==='review'?'검토 요청 단계의 업무를 모아 보여줍니다. 업무를 눌러 요청·승인 탭에서 검토할 수 있습니다.':'팀 전체의 업무를 보여줍니다. 프로젝트·상태·담당자 필터를 함께 이용할 수 있습니다.'}<br>※ 로컬 모드에서는 담당자를 직접 선택합니다. 실제 로그인·접근 권한은 적용되지 않습니다.</div></section>`}
function nx28UpdateBar(){if(page!=='tasks')return;const main=document.getElementById('main');if(!main)return;const old=main.querySelector('.nx28-switcher');if(old)old.remove();const heading=main.querySelector('.headrow');if(heading)heading.insertAdjacentHTML('afterend',nx28Bar());else main.insertAdjacentHTML('afterbegin',nx28Bar())}
const nx28PrevRender=render;
render=function(){nx28PrevRender();const version=document.querySelector('.brand-copy strong');if(version)version.textContent='2.8';nx28UpdateBar();if(page==='settings'){const release=document.querySelector('.nx26-release');if(release&&!release.querySelector('.nx28-release'))release.insertAdjacentHTML('afterbegin','<div class="nx28-release" style="padding:10px 0;border-bottom:1px solid var(--line)"><b>v2.8 · 내 업무 / 팀 업무 / 승인 대기</b><p class="muted" style="font-size:12px;margin:5px 0">담당자 선택, 업무별 전환, 검토 요청 모아보기. 로컬 데이터 호환 유지.</p></div>')}};
const nx28PrevBoard=renderBoard;
renderBoard=function(){nx28PrevBoard();nx28UpdateBar()};
const nx28PrevHistory=nx26History;
nx26History=function(){nx28PrevHistory();const list=document.querySelector('.nx26-history');if(list&&!list.querySelector('.nx28-history-item'))list.insertAdjacentHTML('afterbegin','<article class="nx28-history-item"><b>v2.8</b><p>담당자별 내 업무, 팀 업무, 승인 대기 화면과 로컬 담당자 전환 기능</p></article>')};

load();render();

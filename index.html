</style></head><body><div class="shell"><aside class="side"><div class="brand"><i></i>NEXUS</div><nav class="nav" id="nav"></nav><div class="sidefoot">담당자 전용 · 내 브라우저에 저장<br>관리자 화면은 하나로 간단하게.</div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="breadcrumb">PROJECT WORKSPACE · LOCAL</div><div id="topTitle" class="title">오늘의 업무</div></div><div class="topright"><span class="badge">담당자 계정</span><button class="btn alt tiny" onclick="toggleTheme()" aria-label="테마 변경">◐</button><button class="btn alt tiny top-settings" id="settingsButton" onclick="navigate('more')" aria-label="설정 열기" title="설정">⚙ <span>설정</span></button></div></div><div id="view"></div></main></div><nav class="bottom" id="bottom"></nav><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><input id="import" type="file" accept="application/json,.json" hidden onchange="importData(event)"><script>
'use strict';
const KEY='nexus_workspace_clean_v1', PREF='nexus_clean_prefs';
// 사용자 요청에 따라 이전 NEXUS 시뮬레이션 기록을 처음 실행할 때 초기화합니다.
try{if(!localStorage.getItem("nexus_clean_initialized")){localStorage.removeItem("nexus_workspace_v1");localStorage.removeItem("nexus_simple_prefs");localStorage.setItem("nexus_clean_initialized","1")}}catch(e){}
const tabs=[['home','홈','⌂'],['projects','프로젝트','▦'],['work','업무','☷'],['report','진행 분석','▤'],['people','직원','♧']];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const stamp=()=>new Date().toISOString();const fmt=d=>d||'—';
let data, pref={}, page='home', filter='all', analysisProjectId='';
function starters(){return [{id:uid(),name:'김서연',role:'기획 · PM',core:true},{id:uid(),name:'박지훈',role:'프론트엔드 개발',core:true},{id:uid(),name:'이하린',role:'UI/UX 디자인',core:true},{id:uid(),name:'최도윤',role:'백엔드 개발',core:true}]}
function load(){try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.projects)||!Array.isArray(data.tasks)||!Array.isArray(data.members))data={projects:[],tasks:[],members:starters(),activities:[]};try{pref=JSON.parse(localStorage.getItem(PREF))||{}}catch(e){pref={}}data.projects??=[];for(const p of data.projects){if(!p.status)p.status='active'}data.tasks??=[];data.members??=[];data.dailyReports??=[];data.activities??=[];data.managerReports??=[];if(!data.members.length&&!pref.staffInitialized){data.members=starters();pref.staffInitialized=true}if(!Array.isArray(data.managerReports))data.managerReports=[];if(!pref.activeId||!data.projects.some(x=>x.id===pref.activeId)){pref.activeId=data.projects.find(x=>x.status==='active')?.id||data.projects[0]?.id||''}data.members.forEach(m=>{if(m.core===undefined)m.core=['김서연','박지훈','이하린','최도윤'].includes(m.name)&&!m.supportFor});data.projects.forEach(p=>{if(!Array.isArray(p.memberIds))p.memberIds=[...new Set(data.tasks.filter(t=>t.projectId===p.id&&t.assigneeId).map(t=>t.assigneeId))];});persist()}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(PREF,JSON.stringify(pref))}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function navigate(p){if(p==='report')analysisProjectId='';page=p;render();window.scrollTo(0,0)}
function project(){return data.projects.find(x=>x.id===pref.activeId)}
function tasks(){return data.tasks.filter(t=>t.projectId===pref.activeId)}
function done(t){return t.status==='done'||t.status==='completed'}
function progress(ts){return project()?weightedProgress(project()):(ts.length?Math.round(ts.filter(done).length/ts.length*100):0)}
const DURATIONS={w1:['1주',7],w2:['2주',14],w3:['3주',21],w4:['4주',28],m1:['1개월',30],m3:['3개월',90],m6:['6개월',180],y1:['1년',365]};
function daysSince(start){if(!start)return 0;let d=new Date(start+'T12:00:00'),now=new Date(today()+'T12:00:00');return Math.max(0,Math.round((now-d)/86400000))}
function plannedProgress(p){return p?Math.min(100,Math.round(daysSince((p.startDate||p.createdAt||today()).slice(0,10))/Math.max(1,DURATIONS[p.duration]?.[1]||30)*100)):0}
function projectProgress(p){return weightedProgress(p)}
function progressRoster(p){if(!p)return [];const ids=new Set(Array.isArray(p.memberIds)?p.memberIds:[]);return data.members.filter(m=>ids.has(m.id))}
function syncProgressRoster(p){if(!p)return;p.employeeProgress??={};for(let m of progressRoster(p)){if(!Number.isFinite(Number(p.employeeProgress[m.id])))p.employeeProgress[m.id]=0;else if(p.employeeProgress[m.id]===undefined)p.employeeProgress[m.id]=0}}
function weightedProgress(p){if(!p)return 0;let ts=data.tasks.filter(t=>t.projectId===p.id),roster=progressRoster(p);if(!roster.length)return ts.length?Math.round(ts.filter(done).length/ts.length*100):0;if(!p.employeeProgress||!Object.keys(p.employeeProgress).length)return ts.length?Math.round(ts.filter(done).length/ts.length*100):0;let total=0,weight=0;for(let m of roster){let n=ts.filter(t=>t.assigneeId===m.id).length,w=n;if(!w)continue;total+=w*Math.max(0,Math.min(100,Number(p.employeeProgress[m.id])||0));weight+=w}return weight?Math.round(total/weight):0}
function saveEmployeeProgress(id){let p=project(),v=document.getElementById('employeePercent_'+id);if(!p||!v||!progressRoster(p).some(m=>m.id===id))return;let pct=Math.max(0,Math.min(100,Number(v.value)||0)),before=Number(p.employeeProgress?.[id]??0);p.employeeProgress??={};p.employeeProgress[id]=pct;p.progressHistory??=[];p.progressHistory.push({date:today(),at:stamp(),memberId:id,previous:before,percent:pct});saveChange(name(id)+' 진행률을 '+pct+'%로 저장했어요')}
function progressPage(){
 if(analysisProjectId){const p=data.projects.find(x=>x.id===analysisProjectId);if(p){return `<div class="row wrap" style="margin-bottom:16px"><button class="btn alt" onclick="analysisProjectId='';render()">← 전체 프로젝트·직원 분석</button><span class="badge">${E(p.name)} 상세</span></div>`+projectProgressPage()}analysisProjectId=''}
 const ps=data.projects, active=ps.filter(p=>p.status!=='completed'), allTasks=data.tasks.filter(t=>ps.some(p=>p.id===t.projectId));
 const totalWeight=ps.reduce((n,p)=>n+Math.max(1,data.tasks.filter(t=>t.projectId===p.id).length),0);
 const overall=totalWeight?Math.round(ps.reduce((n,p)=>n+projectProgress(p)*Math.max(1,data.tasks.filter(t=>t.projectId===p.id).length),0)/totalWeight):0;
 const enrolled=data.members.map(m=>({m,projects:ps.filter(p=>progressRoster(p).some(x=>x.id===m.id))})).filter(x=>x.projects.length);
 const projectTiles=ps.map(p=>{const ts=data.tasks.filter(t=>t.projectId===p.id),staff=progressRoster(p),pct=projectProgress(p),plan=plannedProgress(p);
 return `<article class="panel"><div class="row wrap"><div><h2 style="margin:0">${E(p.name)}</h2><span class="muted small">${p.status==='completed'?'완료':'진행 중'} · 참여 ${staff.length}명 · 업무 ${ts.length}건 · 완료 ${ts.filter(done).length}건</span></div><button class="btn alt tiny" onclick="openProjectProgress('${E(p.id)}')">상세 분석</button></div><div class="row" style="margin-top:17px"><span>프로젝트 진행률</span><strong>${pct}%</strong></div><div class="progress" style="margin:9px 0"><div style="width:${pct}%"></div></div><div class="muted small">계획 ${plan}% · 차이 ${pct-plan>0?'+':''}${pct-plan}%p</div><div class="team-inline">${staff.map(m=>{let n=ts.filter(t=>t.assigneeId===m.id).length,raw=Number(p.employeeProgress?.[m.id]);let rate=Number.isFinite(raw)?raw:(n?Math.round(ts.filter(t=>t.assigneeId===m.id&&done(t)).length/n*100):0);return `<span class="pill">${E(m.name)} ${Math.round(rate)}%</span>`}).join('')||'<span class="muted small">참여 직원 없음</span>'}</div></article>`}).join('');
 const workerTiles=enrolled.map(({m,projects})=>{const rows=projects.map(p=>{const ts=data.tasks.filter(t=>t.projectId===p.id&&t.assigneeId===m.id),v=Number(p.employeeProgress?.[m.id]),pct=Number.isFinite(v)?v:(ts.length?Math.round(ts.filter(done).length/ts.length*100):0);return {p,ts,pct}});const weight=rows.reduce((n,r)=>n+r.ts.length,0);const avg=weight?Math.round(rows.reduce((n,r)=>n+r.pct*r.ts.length,0)/weight):0;

function saveProjectEmployeeProgress(pid,id){const p=data.projects.find(x=>x.id===pid),v=document.getElementById('allProgress_'+pid+'_'+id);if(!p||!v||!progressRoster(p).some(m=>m.id===id))return;const pct=Math.max(0,Math.min(100,Number(v.value)||0)),before=Number(p.employeeProgress?.[id]??0);p.employeeProgress??={};p.employeeProgress[id]=pct;p.progressHistory??=[];p.progressHistory.push({date:today(),at:stamp(),memberId:id,previous:before,percent:pct});saveChange(p.name+' · '+name(id)+' 진행률 '+pct+'% 저장')}
function projectProgressPage(){let p=project();if(!p)return activeCard();let ts=tasks(),pProg=projectProgress(p),plan=plannedProgress(p),hist=p.progressHistory||[],staff=progressRoster(p),yesterday=new Date(Date.now()-86400000).toLocaleDateString('sv-SE');let day=hist.filter(h=>h.date===today()),prev=hist.filter(h=>h.date===yesterday);let lastChange=new Map();for(let h of day)lastChange.set(h.memberId,(lastChange.get(h.memberId)||0)+(Number(h.percent)-Number(h.previous)));return `<div class="panel"><div class="eyebrow">진행 상황 · 담당자 직접 입력</div><h2>${E(p.name)}</h2><div class="row wrap"><div><div class="muted small">예상 기간</div><strong>${E(DURATIONS[p.duration]?.[0]||'미설정')}</strong></div><div><div class="muted small">시작일</div><strong>${E((p.startDate||p.createdAt||today()).slice(0,10))}</strong></div><div><div class="muted small">계획 진행률</div><strong>${plan}%</strong></div></div><div class="row" style="margin-top:18px"><strong>실제 입력 진행률</strong><strong>${pProg}%</strong></div><div class="progress"><div style="width:${pProg}%"></div></div><p class="muted small">${pProg>=plan?'계획 대비 '+(pProg-plan)+'%p 앞서거나 동일합니다.':'계획 대비 '+(plan-pProg)+'%p 낮습니다.'} · 현재 참여 직원의 배정 업무 수 가중 평균입니다. 미참여 직원의 과거 업무는 제외하며 실제 작업 시간이나 성실도를 판정하지 않습니다.</p></div><section class="panel" style="margin-top:16px"><div class="row wrap"><h2 style="margin:0">직원별 진행률 입력</h2><span class="badge">${staff.length}명 배정</span></div><p class="muted small">직원별 %를 담당자가 설정하면 즉시 프로젝트 전체 진행률에 반영됩니다. 오늘 변경량도 기록됩니다.</p>${staff.map(m=>{let assigned=ts.filter(t=>t.assigneeId===m.id),pct=Number(p.employeeProgress?.[m.id]??(assigned.length?Math.round(assigned.filter(done).length/assigned.length*100):0)),delta=lastChange.get(m.id)||0;return `<div class="worker-progress"><div class="row wrap"><div><strong>${E(m.name)}</strong><div class="muted small">${E(m.role||'직원')} · 배정 업무 ${assigned.length}개 · 완료 ${assigned.filter(done).length}개</div></div><span class="badge">오늘 ${delta>0?'+':''}${delta}%p</span></div><div class="row" style="margin-top:12px;gap:10px"><input id="employeePercent_${E(m.id)}" type="number" min="0" max="100" value="${pct}" class="field" style="width:94px" aria-label="${E(m.name)} 진행률"><span>%</span><button class="btn tiny" onclick="saveEmployeeProgress('${E(m.id)}')">진행률 저장</button></div><div class="progress" style="margin-top:10px"><div style="width:${pct}%"></div></div></div>`}).join('')||'<div class="empty">프로젝트에 직원을 투입하면 여기에서 진행률을 관리할 수 있어요.</div>'}</section><div class="cols" style="margin-top:16px"><section class="panel"><h2>프로젝트 현황</h2><div class="person"><strong>총 업무</strong><span class="badge">${ts.length}건</span></div><div class="person"><strong>완료 업무</strong><span class="badge">${ts.filter(done).length}건</span></div><div class="person"><strong>오늘 진행률 수정</strong><span class="badge">${day.length}회</span></div><div class="person"><strong>어제 진행률 수정</strong><span class="badge">${prev.length}회</span></div></section><section class="panel"><h2>최근 진행 기록</h2>${hist.slice(-15).reverse().map(h=>`<div class="person"><div class="info"><strong>${E(name(h.memberId))}</strong><span class="muted small">${E(h.date)} · ${Number(h.previous)||0}% → ${Number(h.percent)||0}%</span></div></div>`).join('')||'<div class="empty">아직 진행률 변경 기록이 없어요.</div>'}</section></div><p class="hint">진행률과 계획 비교는 담당자가 입력한 추정치입니다. 성실도 평가 대신, 추이 및 배정 업무 수를 참고하세요. 과거 하루 보고서 데이터는 삭제되지 않고 백업에 보존됩니다.</p>`}

function name(id){return data.members.find(m=>m.id===id)?.name||'미배정'}

function saveChange(msg){persist();render();toast(msg)}

function render(){document.body.classList.toggle('dark',!!pref.dark);document.getElementById('nav').innerHTML=tabs.map(([id,n,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><span>${icon}</span>${n}</button>`).join('');document.getElementById('bottom').innerHTML=tabs.map(([id,n,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><b>${icon}</b>${n}</button>`).join('');document.getElementById('settingsButton').setAttribute('aria-current',page==='more'?'page':'false');document.getElementById('topTitle').textContent=({home:'오늘의 업무',projects:'프로젝트 관리',work:'프로젝트 업무',report:'전체 진행 분석',people:'직원 관리',more:'설정'})[page];document.getElementById('view').innerHTML=({home:homePage,projects:projectsPage,work:workPage,report:progressPage,people:peoplePage,more:morePage})[page]();}
function activeCard(){let p=project();if(!p)return `<div class="panel"><h2>첫 프로젝트를 만들어보세요</h2><p class="muted">프로젝트를 여러 개 만들고 선택해서 관리합니다. 기본 직원에게 자동 배정하고 보조 직원은 필요할 때 프로젝트에 참여시킬 수 있어요.</p><button class="btn" onclick="editProject()">＋ 첫 프로젝트 시작</button></div>`;let t=tasks(),n=progress(t);return `<div class="panel"><div class="row wrap"><div><div class="eyebrow">지금 진행하는 프로젝트</div><h2 style="margin:8px 0;font-size:23px">${E(p.name)}</h2><div class="muted small">${E(p.description||'프로젝트 업무를 관리하세요')}</div></div><button class="btn alt tiny" onclick="navigate('projects')">프로젝트 관리</button></div><div class="row" style="margin:22px 0 9px"><strong>전체 진행률</strong><strong>${n}%</strong></div><div class="progress"><div style="width:${n}%"></div></div><div class="muted small" style="margin-top:9px">완료 업무 ${t.filter(done).length}건 / 전체 ${t.length}건 · 직원별 진행률 입력 기준(입력 전 완료 건수 기준)</div></div>`}
function homePage(){let ts=tasks(),d=ts.filter(done).length,rev=ts.filter(t=>t.status==='review').length,over=ts.filter(t=>!done(t)&&t.due&&t.due<today()).length;return `<p class="muted" style="margin:-10px 0 19px">여러 프로젝트를 만들 수 있으며 선택한 프로젝트의 직원·업무·진행률을 관리합니다.</p>${activeCard()}${project()?`<div class="grid metrics"><div class="panel metric"><div class="muted small">전체 업무</div><strong>${ts.length}</strong></div><div class="panel metric"><div class="muted small">완료</div><strong>${d}</strong></div><div class="panel metric"><div class="muted small">검토 대기</div><strong>${rev}</strong></div><div class="panel metric"><div class="muted small">마감 지연</div><strong>${over}</strong></div></div><div class="cols"><section class="panel"><div class="row wrap"><h2 style="margin:0;font-size:19px">우선 처리할 업무</h2><button class="btn tiny" onclick="editTask()">＋ 업무 추가</button></div>${taskRows(ts.filter(t=>!done(t)).sort((a,b)=>(a.status==='review'?-1:0)-(b.status==='review'?-1:0)).slice(0,6))}<button class="btn alt" style="width:100%;margin-top:14px" onclick="navigate('work')">전체 업무 보기</button></section><section class="panel"><h2 style="margin:0 0 13px;font-size:19px">팀원별 진행 현황</h2>${peopleSummary(ts)}<button class="btn alt" style="width:100%;margin-top:15px" onclick="navigate('report')">직원별 진행률 관리 →</button></section></div>`:''}`}
function taskRows(ts){if(!ts.length)return `<div class="empty">표시할 업무가 없어요.</div>`;return ts.map(t=>`<div class="task"><div><strong>${E(t.title)}</strong><p class="small muted">${E(name(t.assigneeId))} · ${status(t.status)}${t.due?' · 마감 '+E(t.due):''}</p></div><div class="task-controls"><button class="btn alt tiny" onclick="editTask('${E(t.id)}')">수정</button><select class="field" style="width:auto;padding:8px" aria-label="업무 상태" onchange="setTaskStatus('${E(t.id)}',this.value)">${['todo','progress','review','done'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div></div>`).join('')}
function originalWorkPage(){let p=project();if(!p)return activeCard();let ts=tasks().filter(t=>filter==='all'||(filter==='done'?done(t):t.status===filter));return `<div class="row wrap" style="margin-bottom:18px"><div class="muted">${E(p.name)} · 업무 등록 및 담당자 배정 <button class="btn alt tiny" onclick="navigate('projects')">프로젝트 변경</button></div><button class="btn" onclick="editTask()">＋ 업무 만들기</button></div><div class="tabs" style="margin-bottom:16px">${[['all','전체'],['todo','할 일'],['progress','진행 중'],['review','검토 대기'],['done','완료']].map(([k,v])=>`<button class="${filter===k?'active':''}" onclick="filter='${k}';render()">${v}</button>`).join('')}</div><div class="panel">${taskRows(ts)}</div><div class="hint" style="margin-top:15px">직원별 작업 진행률은 ‘진행 분석’에서 직접 입력하세요. 업무 상태는 별도로 관리됩니다.</div>`}
function peopleSummary(ts){let counts=data.members.map(m=>({m,total:ts.filter(t=>t.assigneeId===m.id).length,done:ts.filter(t=>t.assigneeId===m.id&&done(t)).length}));return counts.map(({m,total,done:d})=>`<div class="person"><span class="avatar">${E(m.name?.slice(0,1)||'팀')}</span><div class="info"><strong>${E(m.name)}</strong><span class="muted small">${E(m.role||'팀원')} · 완료 ${d}/${total}</span></div><span class="badge">${total?Math.round(d/total*100):0}%</span></div>`).join('')||'<div class="empty">직원을 등록해 주세요</div>'}

function recs(title){let z=(title||'').toLowerCase();let keys=[['디자인|ui|ux|화면|시안','디자'],['api|서버|db|데이터|인증|백엔드','백엔드'],['프론트|웹|컴포넌트|퍼블리싱|html|css','프론트'],['기획|요구|정책|일정|분석','기획']];let key=keys.find(([regex])=>new RegExp(regex).test(z))?.[1];if(key){let m=data.members.find(m=>(m.role||'').includes(key));if(m)return m.id}let counts=Object.fromEntries(data.members.map(m=>[m.id,tasks().filter(t=>t.assigneeId===m.id&&!done(t)).length]));return [...data.members].sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0))[0]?.id||''}
function editTask(id=''){let t=data.tasks.find(t=>t.id===id)||{title:'',description:'',assigneeId:'',status:'todo',priority:'medium',due:''};openModal(`<h2>${id?'업무 수정':'새 업무 만들기'}</h2><form onsubmit="saveTask(event,'${E(id)}')"><label class="fieldlabel">업무 이름 *</label><input class="field" id="tasktitle" name="title" maxlength="110" required value="${E(t.title)}" oninput="suggestAssignee(this.value)" placeholder="예: 로그인 API 개발"><label class="fieldlabel">업무 내용</label><textarea class="field" name="description" rows="3">${E(t.description||'')}</textarea><div class="two"><div><label class="fieldlabel">담당 직원</label><select class="field" id="assignee" name="assigneeId"><option value="">미배정</option>${projectStaff(project()).map(m=>`<option value="${E(m.id)}" ${t.assigneeId===m.id?'selected':''}>${E(m.name)} · ${E(m.role)}</option>`).join('')}</select></div><div><label class="fieldlabel">상태</label><select class="field" name="status">${['todo','progress','review','done'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div></div><label class="fieldlabel">마감일 (선택)</label><input class="field" type="date" name="due" value="${E(t.due||'')}"><div class="actions">${id?`<button type="button" class="btn danger" onclick="deleteTask('${E(id)}')">삭제</button>`:''}<button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`);if(!id)suggestAssignee('')}
function suggestAssignee(value){let el=document.getElementById('assignee');if(el&&(!el.dataset.changed||el.value===''))el.value=recs(value);if(el&&!el.dataset.bound){el.dataset.bound='1';el.addEventListener('change',()=>el.dataset.changed='1')}}
function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),t=data.tasks.find(x=>x.id===id),oldDone=t&&done(t),newStatus=f.get('status');if(!t){t={id:uid(),projectId:pref.activeId,createdAt:stamp()};data.tasks.push(t)}Object.assign(t,{title:String(f.get('title')).trim(),description:String(f.get('description')),assigneeId:String(f.get('assigneeId')),status:newStatus,due:String(f.get('due'))});if(!oldDone&&done(t))t.completedAt=stamp();if(oldDone&&!done(t))t.completedAt=null;closeModal();saveChange('업무를 저장했어요')}
function setTaskStatus(id,s){let t=data.tasks.find(t=>t.id===id);if(!t)return;let was=done(t);t.status=s;if(!was&&done(t))t.completedAt=stamp();if(was&&!done(t))t.completedAt=null;saveChange('업무 상태를 변경했어요')}
function deleteTask(id){if(!confirm('이 업무를 삭제할까요?'))return;data.tasks=data.tasks.filter(t=>t.id!==id);closeModal();saveChange('업무를 삭제했어요')}
function editMember(id=''){let m=data.members.find(x=>x.id===id)||{name:'',role:'',core:false,supportFor:''};openModal(`<h2>${id?'직원 정보 수정':'보조 직원 추가'}</h2><form onsubmit="saveMember(event,'${E(id)}')"><label class="fieldlabel">이름 *</label><input class="field" name="name" value="${E(m.name)}" required maxlength="40"><label class="fieldlabel">담당 직무</label><input class="field" name="role" value="${E(m.role)}" maxlength="70" placeholder="예: 프론트엔드 개발"><label class="fieldlabel">보조할 기존 직원</label><select class="field" name="supportFor" ${m.core?'disabled':''}><option value="">${m.core?'기본 직원 (보조 역할 아님)':'선택하지 않음'}</option>${data.members.filter(x=>x.id!==id&&x.core).map(x=>`<option value="${E(x.id)}" ${m.supportFor===x.id?'selected':''}>${E(x.name)} · ${E(x.role)}</option>`).join('')}</select><p class="muted small">${m.core?'기본 직원의 역할은 고정됩니다.':'보조할 직원을 지정해도 진행 중인 프로젝트에는 자동으로 투입되지 않습니다.'}</p><div class="actions">${id&&!m.core?`<button type="button" class="btn danger" onclick="deleteMember('${E(id)}')">삭제</button>`:''}<button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`)}

function saveMember(e,id){e.preventDefault();let f=new FormData(e.target),m=data.members.find(x=>x.id===id);if(!m){m={id:uid(),core:false};data.members.push(m)}m.name=String(f.get('name')).trim();if(!m.core)m.role=String(f.get('role')).trim();m.supportFor=m.core?'':String(f.get('supportFor')||'');closeModal();saveChange('직원 정보를 저장했어요')}
function deleteMember(id){if(data.members.find(m=>m.id===id)?.core){toast('기본 직원은 삭제할 수 없어요');return}if(!confirm('이 직원을 삭제할까요? 기존 담당 업무는 미배정으로 변경됩니다.'))return;data.members=data.members.filter(m=>m.id!==id);data.tasks.forEach(t=>{if(t.assigneeId===id)t.assigneeId=''});closeModal();saveChange('직원을 삭제했어요')}
function projectTemplates(kind){if(!['web','mobile','general'].includes(kind))kind=/앱|iOS|Android|Flutter|모바일|PWA/.test(kind)?'mobile':'web';let common=[['요구사항 정리','기획'],['화면 구조와 사용자 흐름 설계','디자인'],['디자인 시안 및 UI 가이드','디자인'],['프론트엔드 주요 화면 구현','프론트'],['서버 API 및 데이터 설계','백엔드'],['프론트엔드·서버 연동','프론트'],['기능 통합 테스트','기획'],['오류 수정 및 최종 검수','백엔드']];if(kind==='mobile')return [['앱 기능 및 화면 정의','기획'],['모바일 UI/UX 시안','디자인'],['앱 주요 화면 구현','프론트'],['서버 데이터/API 구축','백엔드'],['로그인 및 데이터 연동','백엔드'],['기기별 UI 테스트','디자인'],['통합 테스트·버그 수정','프론트'],['배포 준비·최종 검수','기획']];if(kind==='general')return [['목표·범위 확정','기획'],['세부 일정·업무 구조 정의','기획'],['사용자 경험 및 결과물 설계','디자인'],['핵심 작업 1차 구현','프론트'],['데이터·운영 구조 준비','백엔드'],['중간 결과 검토 및 수정','디자인'],['전체 품질 검토','기획'],['최종 결과물 정리','백엔드']];return common}
function projectStaff(p){return data.members.filter(m=>(p?.memberIds||[]).includes(m.id))}
function pickByRole(role,counts,staff){let all=staff||data.members.filter(m=>m.core);if(!all.length)return '';let tests={기획:/기획|pm|관리|분석|qa|테스트/i,디자인:/디자인|ui|ux|시각/i,프론트:/프론트|웹|앱|클라이언트|퍼블리싱/i,백엔드:/백엔드|서버|api|db|데이터/i};let possible=all.filter(m=>tests[role]?.test(m.role||''));if(!possible.length)possible=all;return [...possible].sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0))[0].id}

function groupedFeaturePicker(selected=[],locked=[]){let groups={};for(let [id,item] of Object.entries(FEATURE_LIBRARY))(groups[item.group]??=[]).push([id,item]);return `<div class="catalog-tools"><input type="search" class="field" placeholder="기능 검색 (예: 로그인, 결제, 알림...)" oninput="filterFeatureCatalog(this.value)" aria-label="기능 검색"><button type="button" class="btn alt tiny" onclick="toggleFeatureGroups(true)">전체 펼치기</button><button type="button" class="btn alt tiny" onclick="toggleFeatureGroups(false)">전체 접기</button></div><div id="featureCatalog">${Object.entries(groups).map(([group,items],i)=>`<details class="catalog-group" ${i===0?'open':''}><summary>${E(group)} <span class="muted small">${items.length}개 기능</span></summary><div class="featuregrid">${items.map(([id,item])=>`<label class="featurechoice" data-search="${E((group+' '+item.name).toLowerCase())}"><input type="checkbox" name="feature" value="${E(id)}" ${selected.includes(id)?'checked':''} ${locked.includes(id)?'disabled':''}><span>${E(item.name)}${locked.includes(id)?' · 추가됨':''}</span><small>${item.tasks.length}개</small></label>`).join('')}</div></details>`).join('')}</div>`}
function filterFeatureCatalog(q){q=q.toLowerCase().trim();document.querySelectorAll('#featureCatalog .catalog-group').forEach(group=>{let n=0;group.querySelectorAll('.featurechoice').forEach(el=>{let ok=!q||el.dataset.search.includes(q);el.hidden=!ok;if(ok)n++});group.hidden=n===0;if(q&&n)group.open=true})}
function toggleFeatureGroups(open){document.querySelectorAll('#featureCatalog details:not([hidden])').forEach(x=>x.open=open)}
function requestedTasks(kind,features){let base=kind==='none'?[]:projectTemplates(kind);for(let id of features){let pack=FEATURE_LIBRARY[id];if(pack)base.push(...pack.tasks.map(t=>[t[0],t[1],id]))}return base}
function seedProjectTasks(id,kind,features=[]){let staff=projectStaff(data.projects.find(p=>p.id===id));let counts=Object.fromEntries(staff.map(m=>[m.id,0]));let items=requestedTasks(kind,features);for(let [title,role,feature] of items){let assigneeId=pickByRole(role,counts,staff);if(assigneeId)counts[assigneeId]=(counts[assigneeId]||0)+1;data.tasks.push({id:uid(),projectId:id,title,description:`${feature?'선택 기능: '+FEATURE_LIBRARY[feature].name+' · ':''}자동 생성된 시뮬레이션 업무입니다. 실제 요구사항에 맞게 수정하세요.`,assigneeId,status:'todo',priority:'medium',createdAt:stamp(),due:'',featureId:feature||'',suggestedRole:role})}return items.length}
function featurePicker(selected=[]){return `<div class="featuregrid">${Object.entries(FEATURE_LIBRARY).map(([key,item])=>`<label class="featurechoice"><input type="checkbox" name="feature" value="${key}" ${selected.includes(key)?'checked':''}><span>${E(item.name)}</span><small>${item.tasks.length}개 업무</small></label>`).join('')}</div>`}
function updateFeatureEstimate(){let form=document.getElementById('projectForm');if(!form)return;let features=[...form.querySelectorAll('[name="feature"]:checked')].map(el=>el.value);let n=(form.elements.autoseed?.checked?projectTemplates(form.elements.kind.value).length:0)+features.reduce((a,k)=>a+(FEATURE_LIBRARY[k]?.tasks.length||0),0);let box=document.getElementById('featureEstimate');if(box)box.textContent=`예상 생성 업무 ${n}개 · 현재 프로젝트 참여 직원에게 역할·현재 배정 수를 고려해 자동 배분`;}
function editProject(id=''){let p=data.projects.find(p=>p.id===id)||{name:'',description:''};openModal(`<h2>${id?'프로젝트 수정':'새 프로젝트 시작'}</h2><p class="muted small">${id?'이름과 설명을 수정할 수 있어요. 기능을 추가하려면 아래의 기능 확장 메뉴를 사용하세요.':'프로젝트 이름을 직접 정하고 기간, 개발 유형, 필요한 기능을 선택하세요. 생성 업무는 기본 직원에게 자동 배정됩니다.'}</p><form id="projectForm" onsubmit="saveProject(event,'${E(id)}')"><label class="fieldlabel">프로젝트 이름 *</label><input class="field" name="name" value="${E(p.name)}" required maxlength="90" placeholder="예: 온라인 쇼핑몰 개발"><label class="fieldlabel">예상 프로젝트 기간</label><select name="duration" class="field">${Object.entries(DURATIONS).map(([key,val])=>`<option value="${key}" ${((p.duration||'m1')===key)?'selected':''}>${val[0]}</option>`).join('')}</select><label class="fieldlabel">프로젝트 시작일</label><input class="field" type="date" name="startDate" value="${E((p.startDate||p.createdAt||today()).slice(0,10))}"><label class="fieldlabel">프로젝트 설명 (선택)</label><textarea class="field" name="description" rows="2" placeholder="목표나 주요 기능을 간단하게 적어주세요">${E(p.description||'')}</textarea>${!id?`<label class="fieldlabel">프로젝트 유형</label><select name="kind" class="field" onchange="updateFeatureEstimate()">${projectKindOptions()}</select><label class="checkline"><input type="checkbox" name="autoseed" checked onchange="updateFeatureEstimate()"> 기본 프로젝트 업무 8개 생성</label><label class="fieldlabel">추가할 기능 선택 (여러 개 가능)</label><div onchange="updateFeatureEstimate()">${groupedFeaturePicker()}</div><div class="hint" id="featureEstimate">기능별 추가 업무를 계산합니다.</div><div class="hint" style="margin-top:8px">자동 생성은 실제 요구사항 분석이 아닌 <strong>업무 템플릿 시뮬레이션</strong>입니다. 추가 직원을 프로젝트에 직접 참여시키면 이후 업무부터 배정할 수 있습니다.</div>`:''}<div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">${id?'변경 저장':'프로젝트 시작'}</button></div></form>`);updateFeatureEstimate()}
function scheduleProjectTasks(p){let ts=data.tasks.filter(t=>t.projectId===p.id),days=DURATIONS[p.duration]?.[1]||30,start=new Date((p.startDate||today())+'T12:00:00');let per=new Map();ts.forEach(t=>{let a=per.get(t.assigneeId)||[];a.push(t);per.set(t.assigneeId,a)});per.forEach(arr=>arr.forEach((t,i)=>{if(!t.due){let d=new Date(start.getTime()+Math.ceil((i+1)*days/arr.length)*86400000);t.due=d.toLocaleDateString('sv-SE')}}))}
function saveProject(e,id){e.preventDefault();let f=new FormData(e.target),p=data.projects.find(x=>x.id===id),newProject=!p;if(!p){p={id:uid(),createdAt:stamp(),status:'active',memberIds:data.members.filter(m=>m.core).map(m=>m.id)};data.projects.push(p)}p.name=String(f.get('name')).trim();p.description=String(f.get('description')).trim();p.duration=String(f.get('duration')||'m1');p.startDate=String(f.get('startDate')||today());pref.activeId=p.id;if(newProject){p.kind=String(f.get('kind')||'web');p.features=f.getAll('feature').map(String);if(f.has('autoseed')||p.features.length){let count=seedProjectTasks(p.id,f.has('autoseed')?p.kind:'none',p.features);scheduleProjectTasks(p);toast(`${count}개 업무를 자동 배정했어요`)}}closeModal();navigate('home');saveChange(newProject?'새 프로젝트를 시작했어요':'프로젝트를 수정했어요')}
function addProjectFeatures(){let p=project();if(!p)return;let selected=p.features||[];openModal(`<h2>프로젝트 기능 추가</h2><p class="muted small">분류를 펼쳐 새 기능을 선택하세요. 이미 추가한 기능은 잠기며, 중복 생성하지 않습니다.</p><form onsubmit="saveAddedFeatures(event)"><div onchange="updateAddEstimate()">${groupedFeaturePicker(selected,selected)}</div><div class="hint" style="margin-top:12px">선택 기능마다 기획·구현·검증 업무를 자동 생성합니다.</div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">선택 기능 추가</button></div></form>`)}
function saveAddedFeatures(e){e.preventDefault();let p=project();if(!p)return;let f=new FormData(e.target),selected=f.getAll('feature').filter(x=>!(p.features||[]).includes(x));if(!selected.length){toast('새 기능을 선택해 주세요');return}let staff=projectStaff(p);let counts=Object.fromEntries(staff.map(m=>[m.id,data.tasks.filter(t=>t.projectId===p.id&&t.assigneeId===m.id&&!done(t)).length]));for(let key of selected){for(let [title,role] of FEATURE_LIBRARY[key].tasks){let assigneeId=pickByRole(role,counts,staff);if(assigneeId)counts[assigneeId]=(counts[assigneeId]||0)+1;data.tasks.push({id:uid(),projectId:p.id,title,description:`추가 기능: ${FEATURE_LIBRARY[key].name} · 제안 업무`,assigneeId,status:'todo',priority:'medium',createdAt:stamp(),due:'',featureId:key,suggestedRole:role})}}p.features=[...(p.features||[]),...selected];closeModal();saveChange(`${selected.length}개 기능의 업무가 생성됐어요`)}
function editProjectTeam(id){let p=data.projects.find(x=>x.id===id);if(!p)return;openModal(`<h2>프로젝트 참여 인원</h2><p class="muted small">${E(p.name)} · 이 프로젝트의 참여자만 선택합니다. 다른 프로젝트의 인원은 변경되지 않아요.</p><form onsubmit="saveProjectTeam(event,'${E(id)}')">${data.members.map(m=>`<label class="featurechoice" style="margin:9px 0"><input type="checkbox" name="staff" value="${E(m.id)}" ${(p.memberIds||[]).includes(m.id)?'checked':''}><span><strong>${E(m.name)}</strong> · ${E(m.role)} ${m.supportFor?'('+E(name(m.supportFor))+' 보조)':''}</span></label>`).join('')}<div class="hint">배정된 업무가 있는 직원을 제외해도 기존 업무 기록은 보존됩니다. 제외된 직원에게는 새 업무를 배정하지 않습니다. 참여자로 저장하는 즉시 진행 분석에 표시됩니다. 업무를 재배정하면 업무 수와 전체 진행률이 자동 갱신됩니다.</div><div class="actions"><button class="btn alt" type="button" onclick="closeModal()">취소</button><button class="btn">참여자 저장</button></div></form>`)}
function rebalanceProject(id){
 let p=data.projects.find(x=>x.id===id);if(!p)return;
 let staff=projectStaff(p),open=data.tasks.filter(t=>t.projectId===id&&!done(t));
 if(!staff.length){toast('프로젝트 참여자를 먼저 등록해 주세요');return}
 let aux=staff.filter(m=>!m.core&&m.supportFor&&staff.some(x=>x.id===m.supportFor));
 let prev=p.reassignmentHistory||[];
 openModal(`<h2>업무 자동 재배정</h2><p class="muted small"><strong>${E(p.name)}</strong> · 참여자 ${staff.length}명 · 미완료 업무 ${open.length}건</p><div class="hint">완료된 업무는 건드리지 않아요. 자동 재배정은 담당자의 확인 후 적용되며 변경 내역이 저장됩니다.</div><form onsubmit="applyRebalance(event,'${E(id)}')"><label class="fieldlabel">재배정 방법</label><select class="field" name="mode" onchange="showRebalancePreview('${E(id)}')"><option value="keep">① 기존 업무 유지</option><option value="equal">② 미완료 업무를 역할별 균등 재배분</option><option value="helper" ${aux.length?'':'disabled'}>③ 보조 직원에게 일부 업무 분배${aux.length?'':' (투입된 보조 직원 없음)'}</option></select><div id="rebalancePreview" class="reportbox" style="margin-top:14px"></div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn" type="submit">선택 방식 적용</button></div></form>${prev.length?`<div class="section"><h2>최근 재배정 기록</h2></div><div class="small muted">${prev.slice(-4).reverse().map(h=>`${E(h.at?.slice(0,16)||'')} · ${E(h.mode)} · ${h.changed||0}건 변경`).join('<br>')}</div>`:''}`);
 showRebalancePreview(id)
}
function rebalancePlan(id,mode){
 let p=data.projects.find(x=>x.id===id),staff=projectStaff(p),open=data.tasks.filter(t=>t.projectId===id&&!done(t));
 let counts=Object.fromEntries(staff.map(m=>[m.id,0]));let out=[];
 // To preserve work already in progress, never move progress/review tasks automatically.
 for(let t of open.filter(t=>t.status!=='todo')){if(counts[t.assigneeId]!=null)counts[t.assigneeId]++}
 const compatible=(t,eligible)=>{let role=t.suggestedRole||(/디자인|UI|UX/.test(t.title)?'디자인':/서버|API|DB|데이터/.test(t.title)?'백엔드':/화면|프론트/.test(t.title)?'프론트':'기획');let rules={기획:/기획|pm|관리|분석|qa|테스트/i,디자인:/디자인|ui|ux|시각/i,프론트:/프론트|웹|앱|클라이언트|퍼블리싱/i,백엔드:/백엔드|서버|api|db|데이터/i};let fit=eligible.filter(m=>rules[role]?.test(m.role||''));return fit.length?fit:eligible};
 for(let t of open.filter(t=>t.status==='todo')){
  let target=t.assigneeId;
  if(mode==='equal'){
   let pool=compatible(t,staff);if(pool.length)target=[...pool].sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0))[0].id;
  }else if(mode==='helper'){
   let helper=auxFor(t,staff);if(helper.length){let eligible=[...helper,staff.find(m=>m.id===t.assigneeId)].filter(Boolean);let current=eligible.find(m=>m.id===t.assigneeId);let pendingForOriginal=open.filter(x=>x.status==='todo'&&x.assigneeId===t.assigneeId).length;let movedAlready=out.filter(x=>x.from===t.assigneeId&&x.to!==t.assigneeId).length; if(current&&pendingForOriginal>=2&&movedAlready<Math.floor(pendingForOriginal/2))target=helper[(movedAlready)%helper.length].id}
  }
  if(counts[target]!=null)counts[target]++;
  if(target!==t.assigneeId&&target)out.push({id:t.id,title:t.title,from:t.assigneeId,to:target});
 }
 return out;
}
function auxFor(t,staff){return staff.filter(m=>!m.core&&m.supportFor===t.assigneeId&&m.id!==t.assigneeId)}
function showRebalancePreview(id){let mode=document.querySelector('#modal select[name="mode"]')?.value||'keep',plan=rebalancePlan(id,mode),el=document.getElementById('rebalancePreview');if(!el)return;el.innerHTML=mode==='keep'?'기존 업무 배정을 유지합니다. 앞으로 생성하는 업무에는 현재 참여 직원이 반영됩니다.':plan.length?`<strong>예상 변경 ${plan.length}건</strong><br>${plan.slice(0,10).map(x=>`· ${E(x.title)}: ${E(name(x.from))} → ${E(name(x.to))}`).join('<br>')}${plan.length>10?`<br>외 ${plan.length-10}건`:''}<br><small>진행 중·검토 대기·완료 업무는 변경하지 않습니다.</small>`:'변경할 수 있는 미시작 업무가 없거나 적합한 보조 직원이 없습니다.'}
function applyRebalance(e,id){e.preventDefault();let mode=new FormData(e.target).get('mode'),p=data.projects.find(x=>x.id===id);if(!p)return;let plan=rebalancePlan(id,mode);let at=stamp();for(let x of plan){let t=data.tasks.find(z=>z.id===x.id);if(!t||done(t)||t.status!=='todo')continue;t.assigneeId=x.to;t.assignmentHistory??=[];t.assignmentHistory.push({at,from:x.from,to:x.to,reason:mode})}p.reassignmentHistory??=[];p.reassignmentHistory.push({at,mode:({keep:'기존 유지',equal:'균등 재배정',helper:'보조 인력 분배'})[mode],changed:plan.length,changes:plan});syncProgressRoster(p);closeModal();saveChange(`${plan.length}개 미시작 업무의 배정을 조정했어요`)}

function saveProjectTeam(e,id){e.preventDefault();let p=data.projects.find(x=>x.id===id);if(!p)return;p.memberIds=new FormData(e.target).getAll('staff').map(String);syncProgressRoster(p);closeModal();saveChange('참여 인원과 진행 분석이 즉시 동기화됐어요')}

function reportPage(){let p=project();if(!p)return activeCard();let d=today(),r=reports(),todayTs=tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===d),todayCount=todayTs.length;let entries=data.dailyReports.filter(x=>x.projectId===p.id&&((x.date||x.createdAt||'').slice(0,10)===d));return `<div class="hint">회사 업무 종료 기준은 <strong>18:00</strong>으로 설정했어요. 18시 이전에도 초안을 저장할 수 있고, 퇴근 후 직원들의 보고 내용을 확인해 최종 보고서를 작성하면 됩니다.</div><div class="grid metrics"><div class="panel metric"><div class="muted small">오늘 완료 업무</div><strong>${todayCount}</strong></div><div class="panel metric"><div class="muted small">프로젝트 진행률</div><strong>${progress(tasks())}%</strong></div><div class="panel metric"><div class="muted small">직원 일일 보고</div><strong>${entries.length}</strong></div><div class="panel metric"><div class="muted small">기록된 담당자 보고</div><strong>${r.length}</strong></div></div><div class="cols"><div class="panel"><div class="row wrap"><h2 style="font-size:19px;margin:0">담당자 하루 보고서</h2><button class="btn" onclick="editReport()">＋ ${r.some(x=>x.date===d)?'오늘 보고 수정':'오늘 보고 작성'}</button></div><p class="muted small">기존 직원 보고와 업무 완료 기록을 참고해 상사에게 보고할 내용을 작성해요.</p>${r.length?r.map(x=>`<div class="task"><div><strong>${E(x.date)} · ${E(x.title||'일일 업무 결과')}</strong><p class="muted small">${x.submittedAt?'보고 완료':'임시 저장'} · ${E((x.summary||'').slice(0,65))}</p></div><button class="btn alt tiny" onclick="editReport('${E(x.id)}')">열기</button></div>`).join(''):'<div class="empty">아직 작성한 하루 보고서가 없어요.</div>'}</div><div class="panel"><h2 style="font-size:19px;margin:0 0 14px">오늘의 팀원 성과</h2>${peopleSummary(tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===d))}<div class="section"><h2>오늘 완료한 업무</h2></div>${todayTs.length?todayTs.map(t=>`<div class="person"><div class="info"><strong>${E(t.title)}</strong><span class="muted small">${E(name(t.assigneeId))}</span></div></div>`).join(''):'<div class="empty">오늘 완료 시간 기록이 있는 업무가 없어요. 이전 버전의 완료 업무는 날짜를 추정하지 않습니다.</div>'}</div></div>`}
function reportDayTasks(date){return tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===date)}
function employeeAssessments(date,old){return data.members.map(m=>{let a=(old?.assessments||[]).find(x=>x.memberId===m.id)||{};let todayDone=reportDayTasks(date).filter(t=>t.assigneeId===m.id);return {m,a,todayDone}})}
function editReport(id=''){let r=data.managerReports.find(x=>x.id===id)||data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===today())||{date:today(),summary:'',next:'',issues:'',title:'일일 업무 결과'};openModal(`<h2>하루 보고서 간편 작성</h2><p class="muted small">직원별 상태와 점수, 체크 항목만 선택해도 보고서 초안을 만들어줘요.</p><form id="reportForm" onsubmit="saveReport(event,'${E(r.id||'')}')"><label class="fieldlabel">보고 날짜</label><input class="field" type="date" name="date" required value="${E(r.date)}" onchange="refreshReportAssessments(this.value)"><div id="assessments">${assessmentFields(r.date,r)}</div><div class="reporttools"><button class="btn alt" type="button" onclick="generateReportDraft()">✦ 선택 항목으로 보고서 자동 작성</button><button class="btn alt" type="button" onclick="copyReportText()">보고서 복사</button></div><label class="fieldlabel">자동 생성된 상사 보고서 · 직접 수정 가능 *</label><textarea class="field" name="summary" required rows="10" placeholder="위에서 항목을 선택하고 자동 작성 버튼을 누르세요">${E(r.summary||'')}</textarea><label class="fieldlabel">내일 할 일 (선택)</label><textarea class="field" name="next" rows="2">${E(r.next||'')}</textarea><label class="fieldlabel">문제점 및 지원 요청 (선택)</label><textarea class="field" name="issues" rows="2">${E(r.issues||'')}</textarea><div class="hint" style="margin-top:14px">18시 이후에 최종 제출하는 흐름을 권장해요. 18시 이전에도 보고서를 작성·저장할 수 있어요. 이 기능은 문장 자동 생성이며 실제 AI API를 호출하지 않아요.</div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button type="submit" class="btn alt" onclick="this.form.dataset.submit='draft'">임시 저장</button><button type="submit" class="btn" onclick="this.form.dataset.submit='send'">보고 완료</button></div></form>`)}
function assessmentFields(date,r){return employeeAssessments(date,r).map(({m,a,todayDone})=>`<div class="scorecard" data-member="${E(m.id)}"><div class="scorehead"><strong>${E(m.name)} <span class="muted small">· ${E(m.role||'직원')}</span></strong><span class="badge">기록상 완료 ${todayDone.length}건</span></div><div class="scoregrid"><div><label class="fieldlabel">오늘 업무 상태</label><select class="field as-state"><option value="normal" ${a.state==='normal'?'selected':''}>정상 진행</option><option value="fast" ${a.state==='fast'?'selected':''}>계획보다 빠름</option><option value="slow" ${a.state==='slow'?'selected':''}>일부 지연</option><option value="blocked" ${a.state==='blocked'?'selected':''}>지원 필요</option><option value="off" ${a.state==='off'?'selected':''}>업무 없음 / 휴무</option></select></div><div><label class="fieldlabel">평가 점수 (선택)</label><select class="field as-score"><option value="" ${a.score===''||a.score==null?'selected':''}>점수 미입력</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${Number(a.score)===n?'selected':''}>${n}점 / 5점</option>`).join('')}</select></div></div><label class="checkline"><input type="checkbox" class="as-plan" ${a.plan?'checked':''}> 오늘 계획 업무를 수행함</label><label class="checkline"><input type="checkbox" class="as-share" ${a.share?'checked':''}> 진행 상황을 보고·공유함</label><label class="checkline"><input type="checkbox" class="as-quality" ${a.quality?'checked':''}> 검토 가능한 결과물이 있음</label><label class="fieldlabel">추가 메모 (선택)</label><input class="field as-memo" maxlength="250" value="${E(a.memo||'')}" placeholder="예: 로그인 화면 완성, 테스트 필요"></div>`).join('')||'<div class="empty">직원을 먼저 추가하세요.</div>'}
function refreshReportAssessments(date){let r=data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===date);document.getElementById('assessments').innerHTML=assessmentFields(date,r);if(r){let f=document.getElementById('reportForm');f.elements.summary.value=r.summary||'';f.elements.next.value=r.next||'';f.elements.issues.value=r.issues||''}}
function collectAssessments(){return [...document.querySelectorAll('#assessments [data-member]')].map(el=>({memberId:el.dataset.member,state:el.querySelector('.as-state').value,score:el.querySelector('.as-score').value,plan:el.querySelector('.as-plan').checked,share:el.querySelector('.as-share').checked,quality:el.querySelector('.as-quality').checked,memo:el.querySelector('.as-memo').value.trim()}))}
function generateReportDraft(){let f=document.getElementById('reportForm'),date=f.elements.date.value,ts=tasks(),completed=reportDayTasks(date),ass=collectAssessments(),labels={normal:'정상 진행',fast:'계획보다 빠르게 진행',slow:'일부 지연',blocked:'추가 지원 필요',off:'업무 없음 또는 휴무'};let lines=[`[${date} 프로젝트 일일 업무보고]`,`프로젝트: ${project()?.name||''}`,`진행 현황: 전체 ${ts.length}건 중 완료 ${ts.filter(done).length}건 (진행률 ${progress(ts)}%)`,`당일 완료 기록: ${completed.length}건`,'','■ 직원별 보고'];for(let a of ass){let m=data.members.find(x=>x.id===a.memberId),dt=completed.filter(t=>t.assigneeId===a.memberId),checks=[a.plan&&'계획 업무 수행',a.share&&'진행 상황 공유',a.quality&&'검토 가능 결과물'].filter(Boolean);lines.push(`- ${m?.name||'직원'} (${m?.role||'담당'}): ${labels[a.state]}${a.score?' / 자체 평가 '+a.score+'점(5점 만점)':''}; 체크 ${checks.length}/3${checks.length?' ['+checks.join(', ')+']':''}; 당일 완료 기록 ${dt.length}건${dt.length?' ('+dt.map(t=>t.title).join(', ')+')':''}${a.memo?' / 메모: '+a.memo:''}`)}lines.push('','■ 종합 의견',`총 ${ass.length}명의 입력 내용을 기준으로 정리했습니다. 체크 항목과 평점은 담당자 입력 값이며, 실제 작업 기록과는 구분됩니다.`);f.elements.summary.value=lines.join('\n');toast('보고서 초안을 작성했어요. 확인 후 저장하세요.')}
async function copyReportText(){let f=document.getElementById('reportForm');try{await navigator.clipboard.writeText([f.elements.summary.value,f.elements.next.value&&'내일 계획: '+f.elements.next.value,f.elements.issues.value&&'지원 요청: '+f.elements.issues.value].filter(Boolean).join('\n\n'));toast('보고서 내용을 복사했어요')}catch(e){f.elements.summary.focus();f.elements.summary.select();toast('복사가 제한되어 텍스트를 선택했어요')}}
function saveReport(e,id){e.preventDefault();let f=new FormData(e.target),date=String(f.get('date')),r=data.managerReports.find(x=>x.id===id&&x.projectId===pref.activeId)||data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===date);if(!r){r={id:uid(),projectId:pref.activeId,createdAt:stamp()};data.managerReports.push(r)}Object.assign(r,{date,title:'일일 업무 결과',summary:String(f.get('summary')),next:String(f.get('next')),issues:String(f.get('issues')),assessments:collectAssessments(),updatedAt:stamp()});if(e.target.dataset.submit==='send')r.submittedAt=stamp();else r.submittedAt=null;closeModal();saveChange(r.submittedAt?'하루 보고서를 완료했어요':'보고서를 임시 저장했어요')}
let projectViewFilter='all';
function projectsPage(){let chosen=data.projects.filter(p=>projectViewFilter==='all'||(projectViewFilter==='completed'?p.status==='completed':p.status!=='completed'));return `<div class="row wrap" style="margin-bottom:18px"><div class="muted">프로젝트별 업무와 인원을 관리하세요. 여러 프로젝트를 동시에 진행할 수 있습니다.</div><button class="btn" onclick="editProject()">＋ 새 프로젝트</button></div><div class="tabs" style="margin-bottom:18px">${[['all','전체'],['ongoing','진행 중'],['completed','완료']].map(([k,n])=>`<button class="${projectViewFilter===k?'active':''}" onclick="projectViewFilter='${k}';render()">${n}</button>`).join('')}</div><div class="grid two project-cards">${chosen.map(p=>{let ts=data.tasks.filter(t=>t.projectId===p.id),pct=projectProgress(p),selected=p.id===pref.activeId;return `<article class="panel project-card"><div class="row wrap"><h2 style="margin:0;font-size:19px">${E(p.name)}</h2><div class="row wrap"><span class="badge">${p.status==='completed'?'완료':'진행 중'}</span>${selected?'<span class="badge">현재 보고 있음</span>':''}</div></div><p class="muted small">업무 ${ts.length}개 · 완료 ${ts.filter(done).length}개 · 참여자 ${progressRoster(p).length}명</p><div class="row"><strong>전체 진행률</strong><strong>${pct}%</strong></div><div class="progress" style="margin:10px 0 17px"><div style="width:${pct}%"></div></div><div class="task-controls"><button class="btn tiny" onclick="openProjectWork('${E(p.id)}')">업무 보기</button><button class="btn alt tiny" onclick="openProjectProgress('${E(p.id)}')">진행 분석</button><button class="btn alt tiny" onclick="editProjectTeam('${E(p.id)}')">참여자</button><button class="btn alt tiny" onclick="rebalanceProject('${E(p.id)}')">업무 재배정</button><button class="btn alt tiny" onclick="editProject('${E(p.id)}')">수정</button></div><details style="margin-top:15px"><summary class="muted small" style="cursor:pointer">업무 미리보기 (${ts.length}개)</summary><div style="max-height:260px;overflow:auto;margin-top:8px">${ts.slice(0,15).map(t=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line);gap:8px"><span class="small">${E(t.title)}</span><span class="muted small">${E(name(t.assigneeId))} · ${status(t.status)}</span></div>`).join('')||'<div class="empty">업무가 없습니다.</div>'}${ts.length>15?`<button class="btn alt tiny" onclick="openProjectWork('${E(p.id)}')">나머지 ${ts.length-15}건 보기</button>`:''}</div></details></article>`}).join('')||'<div class="panel"><div class="empty">등록된 프로젝트가 없어요. 새 프로젝트를 만들어 시작하세요.</div></div>'}</div>`}
function openProjectWork(id){pref.activeId=id;filter='all';persist();navigate('work')}
function openProjectProgress(id){pref.activeId=id;analysisProjectId=id;page='report';persist();render();window.scrollTo(0,0)}
function morePage(){return `<div class="section"><h2>데이터 및 환경</h2></div><div class="panel"><div class="row wrap"><div><strong>데이터 백업</strong><div class="muted small">프로젝트·직원·업무·보고서 전체를 JSON으로 저장</div></div><button class="btn alt tiny" onclick="exportData()">백업 다운로드</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>데이터 불러오기</strong><div class="muted small">기존 NEXUS 백업 파일도 사용할 수 있어요.</div></div><button class="btn alt tiny" onclick="document.getElementById('import').click()">JSON 불러오기</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>전체 기록 초기화</strong><div class="muted small">프로젝트·업무·보조 직원·진행 기록 삭제 (기본 직원은 유지)</div></div><button class="btn danger tiny" onclick="resetSimulation()">초기화</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>화면 테마</strong><div class="muted small">라이트 / 다크 모드</div></div><button class="btn alt tiny" onclick="toggleTheme()">테마 변경</button></div></div>`}
function resetSimulation(){if(!confirm('모든 프로젝트, 업무, 추가 직원, 진행 기록을 완전히 초기화할까요? 기본 직원 4명만 남습니다. 복구할 수 없으니 필요한 경우 먼저 백업하세요.'))return;if(!confirm('정말 초기화할까요? 이 작업은 되돌릴 수 없습니다.'))return;data={projects:[],tasks:[],members:starters(),activities:[],dailyReports:[],managerReports:[]};pref.activeId='';pref.staffInitialized=true;page='home';persist();render();toast('초기화 완료 · 새 프로젝트를 만들어 주세요')}
function exportData(){persist();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!Array.isArray(d.members)||!Array.isArray(d.tasks))throw Error('올바른 NEXUS 백업이 아닙니다');if(!confirm('현재 데이터가 불러온 데이터로 교체됩니다. 계속할까요?'))return;localStorage.setItem(KEY,JSON.stringify(d));data=d;load();saveChange('백업 데이터를 복원했어요')}catch(err){alert('불러오기 실패: '+err.message)}finally{e.target.value=''}}

let workView='list', calendarMonth=today().slice(0,7), activityScope='project';
const stateColumns=[['todo','할 일'],['progress','진행 중'],['review','검토 대기'],['done','완료']];
function workPage(){
 const p=project();if(!p)return activeCard();
 const buttons=[['list','☷ 목록'],['board','▦ 칸반'],['calendar','▣ 캘린더'],['activity','◷ 활동 기록']];
 const select=`<div class="row wrap" style="margin-bottom:14px"><div><strong>${E(p.name)}</strong><div class="muted small">같은 업무를 다양한 방식으로 확인하고 관리하세요.</div></div><button class="btn alt tiny" onclick="navigate('projects')">프로젝트 변경</button></div><nav class="workview-tabs" aria-label="업무 보기 방식">${buttons.map(([k,v])=>`<button class="${workView===k?'active':''}" onclick="workView='${k}';render()">${v}</button>`).join('')}</nav>`;
 if(workView==='list')return select+originalWorkPage();

function moveKanbanTask(e,id,statusValue){e.preventDefault();const t=data.tasks.find(x=>x.id===id&&x.projectId===pref.activeId);if(!t||!stateColumns.some(([s])=>s===statusValue))return;if(t.status===statusValue)return;setTaskStatus(id,statusValue)}
function beginKanbanDrag(e,id){if(e.dataTransfer){e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move'}}
function receiveKanbanDrop(e,state){e.preventDefault();const id=e.dataTransfer?.getData('text/plain');if(!id)return;moveKanbanTask(e,id,state)}
function kanbanView(p){const ts=tasks();return `<div class="row wrap" style="margin:15px 0"><span class="muted small">카드를 다른 칸으로 끌어 이동하거나, 모바일에서는 카드 아래 상태 선택으로 변경하세요.</span><button class="btn tiny" onclick="editTask()">＋ 업무 추가</button></div><div class="kanban-scroll"><div class="kanban-board">${stateColumns.map(([state,label])=>{const arr=ts.filter(t=>(t.status||'todo')===state||(state==='done'&&t.status==='completed'));return `<section class="kanban-column" ondragover="event.preventDefault()" ondrop="receiveKanbanDrop(event,'${state}')"><div class="kanban-heading"><strong>${label}</strong><span class="badge">${arr.length}</span></div><div class="kanban-stack">${arr.map(t=>`<article class="kanban-task" draggable="true" ondragstart="beginKanbanDrag(event,'${E(t.id)}')"><strong>${E(t.title)}</strong><span class="muted small">${E(name(t.assigneeId))}</span><span class="muted small">${t.due?'마감 '+E(t.due):'마감 미지정'}</span><div class="row wrap"><button class="btn alt tiny" onclick="editTask('${E(t.id)}')">상세</button><select class="field kanban-status" aria-label="${E(t.title)} 상태 변경" onchange="setTaskStatus('${E(t.id)}',this.value)">${stateColumns.map(([x,v])=>`<option value="${x}" ${state===x?'selected':''}>${v}</option>`).join('')}</select></div></article>`).join('')||'<div class="empty small">업무 없음</div>'}</div></section>`}).join('')}</div></div>`}
function shiftCalendar(n){let [y,m]=calendarMonth.split('-').map(Number);let d=new Date(y,m-1+n,1);calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
function calendarView(p){let [y,m]=calendarMonth.split('-').map(Number);let first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),ts=tasks();let cells=[];for(let i=0;i<first;i++)cells.push('<div class="calendar-cell empty-cell"></div>');for(let day=1;day<=days;day++){let date=`${calendarMonth}-${String(day).padStart(2,'0')}`,arr=ts.filter(t=>t.due===date);cells.push(`<div class="calendar-cell ${date===today()?'is-today':''}"><div class="calendar-day">${day}${date===today()?' · 오늘':''}</div>${arr.slice(0,4).map(t=>`<button class="calendar-task ${done(t)?'is-done':''}" title="${E(t.title)}" onclick="editTask('${E(t.id)}')">${E(t.title)}</button>`).join('')}${arr.length>4?`<button class="calendar-more" onclick="showCalendarDay('${date}')">+${arr.length-4}건 더 보기</button>`:''}</div>`)}return `<div class="panel"><div class="row wrap calendar-toolbar"><button class="btn alt tiny" onclick="shiftCalendar(-1)">〈 이전 달</button><h2>${y}년 ${m}월</h2><div class="row wrap"><button class="btn alt tiny" onclick="calendarMonth=today().slice(0,7);render()">이번 달</button><button class="btn alt tiny" onclick="shiftCalendar(1)">다음 달 〉</button></div></div><div class="calendar-grid">${['일','월','화','수','목','금','토'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('')}${cells.join('')}</div><div class="hint">각 업무의 마감일을 기준으로 표시합니다. 업무를 누르면 마감일을 수정할 수 있어요.</div></div>`}
function showCalendarDay(date){let arr=tasks().filter(t=>t.due===date);openModal(`<h2>${E(date)} 마감 업무 (${arr.length}건)</h2>${arr.map(t=>`<div class="task"><div><strong>${E(t.title)}</strong><p class="muted small">${E(name(t.assigneeId))} · ${status(t.status)}</p></div><button class="btn alt tiny" onclick="editTask('${E(t.id)}')">보기</button></div>`).join('')}<div class="actions"><button class="btn alt" onclick="closeModal()">닫기</button></div>`)}

function activityView(p){let arr=(data.activities||[]).filter(a=>activityScope==='all'||a.projectId===p.id).slice(0,150);return `<div class="panel"><div class="row wrap" style="margin-bottom:16px"><div><h2 style="margin:0">업무 활동 기록</h2><p class="muted small">프로젝트의 변경 사항을 시간 순으로 확인합니다. 기록은 이 기기의 브라우저에 저장됩니다.</p></div><select class="field" style="max-width:170px" onchange="activityScope=this.value;render()"><option value="project" ${activityScope==='project'?'selected':''}>현재 프로젝트</option><option value="all" ${activityScope==='all'?'selected':''}>전체 프로젝트</option></select></div>${arr.length?arr.map(a=>`<div class="activity-entry"><span class="activity-dot"></span><div><strong>${E(a.detail||a.type||'변경 기록')}</strong><div class="muted small">${E(pName(a.projectId))} · ${E((a.at||a.createdAt||'').replace('T',' ').slice(0,19))}</div></div></div>`).join(''):'<div class="empty">아직 기록이 없습니다. 업무의 상태를 변경하면 여기에 기록돼요.</div>'}</div>`}
// Keep original task update behavior and add a readable activity entry.
const originalSetTaskStatus=setTaskStatus;
setTaskStatus=function(id,s){const t=data.tasks.find(x=>x.id===id);if(!t||t.status===s)return;const previous=status(t.status),title=t.title,pid=t.projectId;writeActivity('업무 상태 변경',`${title}: ${previous} → ${status(s)}`,pid);originalSetTaskStatus(id,s)};
const originalSaveTask=saveTask;
saveTask=function(e,id){const existing=data.tasks.find(t=>t.id===id),f=new FormData(e.target),title=String(f.get('title')||'').trim();writeActivity(id?'업무 수정':'업무 생성',`${id?'업무 수정':'업무 생성'}: ${title}`,existing?.projectId||pref.activeId);originalSaveTask(e,id)};
const originalSaveProject=saveProject;
saveProject=function(e,id){const f=new FormData(e.target);writeActivity(id?'프로젝트 수정':'프로젝트 생성',`${id?'프로젝트 수정':'프로젝트 생성'}: ${String(f.get('name')||'').trim()}`,id||pref.activeId);originalSaveProject(e,id)};

load();render();
</script></body></html>

<body data-theme="light"><div class="shell">

<div class="content"><header class="topbar"><div style="display:flex;align-items:center;gap:9px"><button class="iconbtn mobile-back" id="backBtn" onclick="goBack()" aria-label="뒤로가기">‹</button><div class="mobile-topbrand"><span class="mobile-topbrand-mark">✦</span><span>NEXUS<small>WORKSPACE</small></span></div><div class="crumb">Workspace <span style="margin:0 7px">/</span> <b id="crumb">개요</b></div></div><div class="top-actions"><span class="tiny muted top-hide" id="todayLabel"></span><button class="iconbtn" aria-label="검색" onclick="openSearch()">⌕</button><button class="iconbtn" id="themeButton" onclick="toggleTheme()" aria-label="테마 전환">☾</button><button class="iconbtn" aria-label="새 업무" onclick="openTask()">＋</button></div></header><main id="main" class="main"></main></div>
</div><nav class="mobile-nav" id="mobileNav" aria-label="하단 메뉴"></nav><div class="modalx" id="modal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeModal()"><div id="dialog" class="dialog"></div></div><div class="toastx" id="toast" role="status"></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importJSON(event)">
<script>
'use strict';
const KEY='nexus_workspace_v1';const pages=[['dashboard','개요','▦'],['tasks','업무 관리','☷'],['projects','프로젝트','▣'],['calendar','캘린더','▦'],['team','팀 관리','♙'],['analytics','분석 리포트','◫'],['settings','설정','⚙']];const statuses=[['todo','할 일'],['progress','진행 중'],['review','검토'],['done','완료']];const priorities=[['low','낮음'],['medium','보통'],['high','높음']];let page='dashboard',historyStack=[],filterProject='all',filterStatus='all',filterSearch='',calendarOffset=0,toastTimer;const dateISO=(d)=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const plusDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return dateISO(d)};const uid=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v??'').trim();const findName=(arr,id,fallback='미지정')=>arr.find(x=>x.id===id)?.name||fallback;const label=(arr,id)=>arr.find(x=>x[0]===id)?.[1]||id;const formatDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'-';const now=()=>new Date().toISOString();
function seed(){const a=uid(),b=uid(),c=uid(),m1=uid(),m2=uid(),m3=uid(),m4=uid();return {version:1,theme:'light',members:[{id:m1,name:'김서연',role:'프로덕트 매니저',email:'seoyeon@example.com'},{id:m2,name:'박지훈',role:'프론트엔드 개발자',email:'jihoon@example.com'},{id:m3,name:'이하린',role:'UI/UX 디자이너',email:'harin@example.com'},{id:m4,name:'최도윤',role:'백엔드 개발자',email:'doyun@example.com'}],projects:[{id:a,name:'NEXUS 플랫폼 리뉴얼',description:'플랫폼 경험과 대시보드 개편',color:'#665ce9',createdAt:now()},{id:b,name:'모바일 앱 출시',description:'반응형 모바일 앱 경험 최적화',color:'#16ae92',createdAt:now()},{id:c,name:'분석 시스템 고도화',description:'지표와 리포트 자동화',color:'#e8a14d',createdAt:now()}],tasks:[{id:uid(),title:'대시보드 컴포넌트 개발',description:'반응형 카드 및 위젯 구성',projectId:a,assigneeId:m2,status:'progress',priority:'high',due:plusDays(2),createdAt:now()},{id:uid(),title:'디자인 시스템 정리',description:'컬러, 타이포그래피, 간격 정의',projectId:a,assigneeId:m3,status:'done',priority:'medium',due:plusDays(-2),createdAt:now()},{id:uid(),title:'사용자 온보딩 설계',description:'첫 사용 흐름 최적화',projectId:b,assigneeId:m1,status:'todo',priority:'high',due:plusDays(5),createdAt:now()},{id:uid(),title:'REST API 명세 작성',description:'엔드포인트와 요청 스키마 문서화',projectId:b,assigneeId:m4,status:'review',priority:'medium',due:plusDays(1),createdAt:now()},{id:uid(),title:'리포트 시각화 개선',description:'기간별 성과 차트 구성',projectId:c,assigneeId:m2,status:'todo',priority:'low',due:plusDays(8),createdAt:now()},{id:uid(),title:'품질 점검 및 QA',description:'주요 워크플로우 테스트',projectId:a,assigneeId:m1,status:'done',priority:'high',due:plusDays(-1),createdAt:now()}],activities:[]}}let data;function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.tasks)&&Array.isArray(saved.projects)&&Array.isArray(saved.members)){data=saved;data.activities=Array.isArray(saved.activities)?saved.activities:[];return}}catch(e){}data=seed();save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('저장 공간 오류: JSON 백업을 권장합니다')}}function log(action){data.activities.unshift({id:uid(),action,at:now()});data.activities=data.activities.slice(0,80)}function commit(action){if(action)log(action);save();render();if(action)toast(action)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}function navigate(next,record=true){if(!pages.some(p=>p[0]===next))return;if(page!==next&&record)historyStack.push(page);page=next;filterSearch='';render();window.scrollTo(0,0)}function goBack(){if(document.getElementById('modal').classList.contains('open')){closeModal();return}navigate(historyStack.pop()||'dashboard',false)}function toggleTheme(){data.theme=data.theme==='dark'?'light':'dark';save();render()}function head(title,subtitle,action=''){return `<div class="headrow"><div><h1 class="page-title">${title}</h1><div class="sub">${subtitle}</div></div>${action}</div>`}function btnNewTask(){return '<button class="btn-primaryx" onclick="openTask()">＋ 새 업무</button>'}function pillStatus(s){let cl=s==='done'?'good':s==='review'?'warn':'';return `<span class="pill ${cl}">${esc(label(statuses,s))}</span>`}function pillPriority(p){return `<span class="pill ${p==='high'?'bad':p==='low'?'good':''}">${esc(label(priorities,p))}</span>`}function pct(p){let a=data.tasks.filter(t=>t.projectId===p.id);return a.length?Math.round(a.filter(t=>t.status==='done').length/a.length*100):0}function stat(title,num,foot,icon){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-symbol">${icon}</span></div><div class="stat-number">${num}</div><div class="stat-foot">${foot}</div></div>`}function dashboard(){let total=data.tasks.length,done=data.tasks.filter(t=>t.status==='done').length,active=data.tasks.filter(t=>t.status==='progress').length,over=data.tasks.filter(t=>t.status!=='done'&&t.due&&t.due<dateISO(new Date())).length;return head('워크스페이스 개요','오늘도 한눈에 업무 현황을 확인하세요.',btnNewTask())+`<div class="stats">${stat('전체 프로젝트',data.projects.length,'등록된 프로젝트 수','▣')}${stat('진행 중인 업무',active,'전체 '+total+'개 업무 중','◷')}${stat('완료된 업무',done,'전체 완료율 '+(total?Math.round(done/total*100):0)+'%','✓')}${stat('기한 지난 업무',over,over?'확인이 필요한 업무':'모든 일정 정상','!')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>프로젝트 진행 현황</h3><button class="btn-soft" onclick="navigate('projects')">전체 보기 →</button></div>${data.projects.length?data.projects.slice(0,5).map(p=>`<div class="project-row" onclick="openProject('${p.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><div class="project-name"><span style="color:${esc(p.color)}">●</span> ${esc(p.name)}</div><b style="font-size:12px">${pct(p)}%</b></div><div class="progress-track"><div class="progress-value" style="width:${pct(p)}%;background:${esc(p.color)}"></div></div><div class="project-meta"><span>${data.tasks.filter(t=>t.projectId===p.id).length}개 업무</span><span>${data.tasks.filter(t=>t.projectId===p.id&&t.status==='done').length}개 완료</span></div></div>`).join(''):'<div class="empty">프로젝트를 만들어 시작해 보세요.</div>'}</section><section class="panel"><div class="panel-title"><h3>최근 활동</h3><span class="tiny muted">최신 업데이트</span></div>${activities(6)}</section><section class="panel"><div class="panel-title"><h3>마감 예정 업무</h3><button class="btn-soft" onclick="navigate('tasks')">업무 관리 →</button></div>${upcoming()}</section><section class="panel"><div class="panel-title"><h3>업무 분포</h3><span class="tiny muted">상태별 현황</span></div>${statusBars()}</section></div>`}function upcoming(){let tasks=data.tasks.filter(t=>t.status!=='done'&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);return tasks.length?tasks.map(t=>`<div class="project-row" onclick="openTask('${t.id}')"><div class="d-flex justify-content-between align-items-center gap-2"><div class="project-name">${esc(t.title)}</div><span class="tiny ${t.due<dateISO(new Date())?'':'muted'}" style="color:${t.due<dateISO(new Date())?'var(--bad)':''}">${formatDate(t.due)}</span></div><div class="project-meta"><span>${esc(findName(data.projects,t.projectId))}</span><span>${esc(findName(data.members,t.assigneeId))}</span></div></div>`).join(''):'<div class="empty">마감 예정 업무가 없습니다.</div>'}function statusBars(){let n=Math.max(data.tasks.length,1);return statuses.map(([k,v])=>{let count=data.tasks.filter(t=>t.status===k).length;return `<div style="margin:14px 0"><div class="d-flex justify-content-between tiny"><b>${v}</b><span>${count}개</span></div><div class="progress-track"><div class="progress-value" style="width:${count/n*100}%"></div></div></div>`}).join('')}function activities(n=25){return data.activities.length?data.activities.slice(0,n).map(a=>`<div class="activity"><div class="activity-dot">↗</div><div><div class="activity-text">${esc(a.action)}</div><div class="activity-time">${new Date(a.at).toLocaleString('ko-KR')}</div></div></div>`).join(''):'<div class="empty">업무를 추가하거나 변경하면 여기에 활동이 기록됩니다.</div>'}
function taskFilters(){return `<div class="toolbar"><input class="search" aria-label="업무 검색" placeholder="⌕ 업무 제목·내용 검색" value="${esc(filterSearch)}" oninput="filterSearch=this.value;renderBoard()"><div class="d-flex gap-2 flex-wrap"><select class="field" aria-label="프로젝트 필터" onchange="filterProject=this.value;renderBoard()"><option value="all">모든 프로젝트</option>${data.projects.map(p=>`<option value="${p.id}" ${filterProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select class="field" aria-label="상태 필터" onchange="filterStatus=this.value;renderBoard()"><option value="all">모든 상태</option>${statuses.map(([s,v])=>`<option value="${s}" ${filterStatus===s?'selected':''}>${v}</option>`).join('')}</select></div></div>`}function filteredTasks(){return data.tasks.filter(t=>(filterProject==='all'||t.projectId===filterProject)&&(filterStatus==='all'||t.status===filterStatus)&&(!filterSearch||(t.title+' '+t.description+' '+findName(data.projects,t.projectId)).toLowerCase().includes(filterSearch.toLowerCase())))}function boardMarkup(){let ts=filteredTasks();return `<div class="board">${statuses.map(([key,title])=>`<section class="column" data-status="${key}" ondragover="event.preventDefault();this.classList.add('drop-target')" ondragleave="this.classList.remove('drop-target')" ondrop="dropTask(event,'${key}')"><div class="column-head"><span>${title}</span><span class="count">${ts.filter(t=>t.status===key).length}</span></div>${ts.filter(t=>t.status===key).map(t=>`<article class="task" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="openTask('${t.id}')"><div class="d-flex justify-content-between gap-2">${pillPriority(t.priority)}<span class="tiny muted">${formatDate(t.due)}</span></div><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(findName(data.projects,t.projectId))}</div><div class="task-info" style="margin-to openMember()">＋ 팀원 추가</button>')+`<div class="team-grid">${data.members.map(m=>`<div class="member" style="cursor:pointer" onclick="openMember('${m.id}')"><div class="avatar">${esc(m.name.slice(0,2))}</div><div style="min-width:0"><strong>${esc(m.name)}</strong><small>${esc(m.role)}</small><small style="overflow:hidden;text-overflow:ellipsis">${esc(m.email||'이메일 없음')}</small><small>담당 업무 ${data.tasks.filter(t=>t.assigneeId===m.id).length}개</small></div></div>`).join('')}</div>${!data.members.length?'<div class="empty">팀원을 추가하세요.</div>':''}`}function calendarPage(){let current=new Date();current.setDate(1);current.setMonth(current.getMonth()+calendarOffset);let y=current.getFullYear(),m=current.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let cells=[];for(let i=0;i<Math.ceil((first+last)/7)*7;i++){let d=i-first+1,key=dateISO(new Date(y,m,d)),valid=d>=1&&d<=last,ev=data.tasks.filter(t=>t.due===key);cells.push(`<div class="day ${valid?'':'faded'} ${key===dateISO(new Date())?'today':''}" onclick="${valid?`openDay('${key}')`:''}"><b>${valid?d:''}</b>${valid?ev.slice(0,3).map(t=>`<div class="event">${esc(t.title)}</div>`).join(''):''}${ev.length>3?`<div class="tiny muted">+${ev.length-3}</div>`:''}</div>`)}return head('캘린더','업무 마감일과 일정을 월별로 확인하세요.',btnNewTask())+`<div class="panel"><div class="panel-title"><h3>${y}년 ${m+1}월</h3><div class="d-flex gap-2"><button class="btn-soft" onclick="calendarOffset--;render()">‹</button><button class="btn-soft" onclick="calendarOffset=0;render()">오늘</button><button class="btn-soft" onclick="calendarOffset++;render()">›</button></div></div><div class="calendar-grid">${['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></div>`}function analyticsPage(){let counts=statuses.map(([s])=>data.tasks.filter(t=>t.status===s).length),mx=Math.max(1,...counts);return head('분석 리포트','워크스페이스의 현재 성과를 시각화합니다.','<button class="btn-soft" onclick="exportCSV()">↓ CSV 내보내기</but ick="navigate('analytics')">◫ 분석 리포트</button><button class="btn-soft" onclick="navigate('projects')">▣ 프로젝트</button></div></div><div class="panel" style="max-width:740px"><div class="panel-title"><h3>워크스페이스 설정</h3></div><div class="settings-row"><div><b style="font-size:13px">다크 모드</b><div class="sub">어두운 화면으로 변경합니다.</div></div><button class="btn-soft" onclick="toggleTheme()">${data.theme==='dark'?'☀ 라이트 모드':'☾ 다크 모드'}</button></div><div class="settings-row"><div><b style="font-size:13px">JSON 전체 백업</b><div class="sub">프로젝트, 업무, 팀, 활동 내역을 파일로 저장합니다.</div></div><button class="btn-soft" onclick="exportJSON()">↓ 백업</button></div><div class="settings-row"><div><b style="font-size:13px">JSON 데이터 복원</b><div class="sub">백업 파일을 불러옵니다. 현재 데이터는 대체됩니다.</div></div><button class="btn-soft" onclick="document.getElementById('importFile').click()">↑ 복원</button></div><div class="settings-row"><div><b style="font-size:13px">데모 데이터 초기화</b><div class="sub">현재 데이터를 초기 샘플로 되돌립니다.</div></div><button class="btn-soft" style="color:var(--bad)" onclick="resetDemo()">초기화</button></div></div><div class="panel section-gap" style="max-width:740px"><h3 style="font-size:15px;font-weight:800">데이터 및 기술 안내</h3><p class="sub" style="line-height:1.9">NEXUS는 단일 HTML 파일로 실행되는 로컬 우선형 업무 플랫폼입니다. 모든 편집은 현재 브라우저의 localStorage에 저장됩니다. 서버와 계정 간 자동 동기화는 지원하지 않으며, 브라우저 데이터 삭제 또는 저장소 격리 시 기록이 사라질 수 있으므로 JSON 백업을 정기적으로 보관하세요. Bootstrap 5는 CDN으로 연결되며 오프라인에서도 핵심 기능은 동작하지만 스타일은 캐시 상태에 따라 달라질 수 있습니다.</p><span class="pill">NEXUS v2.1 · Single File</span></div>`}
function render(){document.body.dataset.theme=data.theme==='dark'?'dark':'light';document.querySelector('meta[name=theme-color]').content=data.theme==='dark'?'#0e1423':'#f5f7fb';document.getElementById('themeButton').textContent=data.theme==='dark'?'☀':'☾';document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});document.getElementById('crumb').textContent=pages.find(p=>p[0]===page)[1];document.getElementById('sidebarNav').innerHTML=pages.filter(p=>p[0]!=='settings').map(([p,n,i])=>`<button class="nav-itemx ${page===p?'active':''}" onclick="navigate('${p}')"><span class="nav-icon">${i}</span>${n}</button>`).join('');document.getElementById('mobileNav').innerHTML=[...pages.slice(0,4),pages[6]].map(([p,n,i])=>`<button aria-label="${n}" class="${page===p?'active':''}" onclick="navigate('${p}')"><span>${i}</span>${n}</button>`).join('');document.getElementById('main').innerHTML=({dashboard, tasks:tasksPage,projects:projectsPage,calendar:calendarPage,team:teamPage,analytics:analyticsPage,settings:settingsPage}[page])()}
function modal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}function options(arr,id){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}function selectOpts(arr,id){return arr.map(([k,v])=>`<option value="${k}" ${k===id?'selected':''}>${v}</option>`).join('')}function openTask(id='',date=''){let t=data.tasks.find(x=>x.id===id)||{title:'',description:'',projectId:data.projects[0]?.id||'',assigneeId:'',status:'todo',priority:'medium',due:date};modal(`<div class="d-flex align-items-center justify-content-between"><h2>${id?'업무 상세 및 수정':'새 업무 만들기'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form id="taskForm" onsubmit="saveTask(event,'${id}')"><label class="formlabel">업무 제목 *</label><input class="field" name="title" maxlength="110" required value="${esc(t.title)}" placeholder="예: 대시보드 개발"><label class="formlabel">상세 설명</label><textarea class="field" name="description" maxlength="1500" placeholder="업무 설명을 입력하세요">${esc(t.description)}</textarea><div class="form-grid"><div><label class="formlabel">프로젝트</label><select class="field" name="projectId"><option value="">미지정</option>${options(data.projects,t.projectId)}</select></div><div><label class="formlabel">담당자</label><select class="field" name="assigneeId"><option value="">미지정</option>${options(data.members,t.assigneeId)}</select></div><div><label class="formlabel">업무 상태</label><select class="field" name="status">${selectOpts(statuses,t.status)}</select></div><div><label class="formlabel">우선순위</label><select class="field" name="priority">${selectOpts(priorities,t.priority)}</select></div></div><label class="formlabel">마감일</label><input class="field" name="due" type="date" value="${esc(t.due)}"><div class="dialog-bottom">${id?`<butt function toggleChecklist(id,cid){let t=data.tasks.find(t=>t.id===id),c=t?.checklist?.find(x=>x.id===cid);if(!c)return;c.done=!c.done;commit('체크리스트 갱신: '+t.title);openTaskDetails(id,'checklist')}
function removeChecklist(id,cid){let t=data.tasks.find(t=>t.id===id);if(!t)return;t.checklist=t.checklist.filter(x=>x.id!==cid);commit('체크리스트 삭제: '+t.title);openTaskDetails(id,'checklist')}
function addComment(e,id){e.preventDefault();let t=data.tasks.find(t=>t.id===id),txt=clean(new FormData(e.target).get('text'));if(!t||!txt)return;t.comments.push({id:uid(),author:'나',text:txt,at:now()});commit('업무 댓글 추가: '+t.title);openTaskDetails(id,'comments')}
function openProjectDetails(id,tab='overview'){let p=data.projects.find(x=>x.id===id);if(!p)return toast('프로젝트를 찾지 못했습니다');p.milestones=Array.isArray(p.milestones)?p.milestones:[];let ts=data.tasks.filter(t=>t.projectId===id),finished=ts.filter(t=>t.status==='done').length;modal(`<div class="v2-modal-head"><div><div class="eyebrow">PROJECT DETAILS</div><h2>${esc(p.name)}</h2></div><button class="iconbtn" onclick="closeModal()">×</button></div><p class="muted">${esc(p.description||'프로젝트 설명이 없습니다.')}</p><div class="detail-info"><div><small>진행률</small><strong>${ts.length?Math.round(finished/ts.length*100):0}%</strong></div><div><small>전체 업무</small><strong>${ts.length}개</strong></div><div><small>완료 업무</small><strong>${finished}개</strong></div></div><div class="v2-tabbar">${[['overview','업무 목록'],['milestones','마일스톤']].map(([k,v])=>`<button class="${tab===k?'sel':''}" onclick="openProjectDetails('${id}','${k}')">${v}</button>`).join('')}</div>${tab==='overview'?`<div class="v2-detail-list">${ts.map(t=>`<button class="detail-row" onclick="openTaskDetails('${t.id}')"><span>${esc(t.title)}</span><small>${esc(label(statuses,t.status))} ›</small></button>`).join('')||'<div class="empty">이 프로젝트에 배정된 업무가 없습니다.</div>'}</div><button class="btn-soft" onclick="closeModal();navigate('tasks');filterProject='${id}';renderBoard()">프로젝트 업무 보드 보기</button>`:`<div class="checklist-list">${p.milestones.map(m=>`<div class="checklist-item"><input type="checkbox" ${m.done?'checked':''} onchange="toggleMilestone('${id}','${m.id}')"><span class="${m.done?'checked-item':''}">${esc(m.text)}</span><button class="iconbtn mini" onclick="removeMilestone('${id}','${m.id}')">×</button></div>`).join('')||'<div class="empty">프로젝트 마일스톤을 등록해 보세요.</div>'}</div><form class="inline-form" onsubmit="addMilestone(event,'${id}')"><input class="field" required name="text" maxlength="120" placeholder="새 마일스톤"><button class="btn-primaryx">추가</button></form>`}<div class="dialog-bottom"><button class="btn-soft" onclick="openProject('${id}')">✎ 프로젝트 편집</button><button class="btn-primaryx" onclick="closeModal()">완료</button></div>`)}
function addMilestone(e,id){e.preventDefault();let p=data.projects.find(p=>p.id===id),text=clean(new FormData(e.target).get('text'));if(!p||!text)return;p.milestones.push({id:uid(),text,done:false});commit('마일스톤 추가: '+p.name);openProjectDetails(id,'milestones')}
function toggleMilestone(id,mid){let p=data.projects.find(p=>p.id===id),m=p?.milestones?.find(m=>m.id===mid);if(!m)return;m.done=!m.done;commit('마일스톤 변경: '+p.name);openProjectDetails(id,'milestones')}
function removeMilestone(id,mid){let p=data.projects.find(p=>p.id===id);if(!p)return;p.milestones=p.milestones.filter(m=>m.id!==mid);commit('마일스톤 삭제: '+p.name);openProjectDetails(id,'milestones')}
const oldReset=resetDemo;resetDemo=function(){oldReset();data.notifications=Array.isArray(data.notifications)?data.notifications:[];data.version=2;save()};
const oldGoBack=goBack;goBack=function(){if(document.getElementById('modal').classList.contains('open')){closeModal();return}if(page==='activity'){page=historyStack.pop()||'dashboard';render();return}oldGoBack()};
const oldNavigate=navigate;navigate=function(p){if(page==='activity'){historyStack.push(page);page=p;render();window.scrollTo(0,0);return}oldNavigate(p)};

// NEXUS v2.1: preserve legacy nexus_workspace_v1 schema and key.
let v21Workspace='all';
function v21SelectWorkspace(id){v21Workspace=id;filterProject=id;filterStatus='all';filterSearch='';if(page!=='tasks'){navigate('tasks')}else{render()}toast(id==='all'?'전체 업무 공간':'프로젝트 작업 공간으로 이동')}
function v21WorkspaceToolbar(){return `<div class="v21-workspace"><span>◈ 워크스페이스</span><select aria-label="워크스페이스 선택" onchange="v21SelectWorkspace(this.value)"><option value="all">전체 프로젝트</option>${data.projects.map(p=>`<option value="${esc(p.id)}" ${filterProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="v21-badge">2.2</span></div>`}
function v21ChangeStatus(e,id){e.stopPropagation();const t=data.tasks.find(t=>t.id===id);if(!t||!statuses.some(x=>x[0]===e.target.value))return;if(t.status===e.target.value)return;t.status=e.target.value;t.updatedAt=now();commit('업무 상태 변경: '+t.title+' → '+label(statuses,t.status))}
const v21BoardMarkup=boardMarkup;
boardMarkup=function(){let html=v21BoardMarkup();return html.replace(/(<article class="task"[^>]*>)([\s\S]*?)(<\/article>)/g,(full,start,body,end)=>{let id=start.match(/openTask\('([^']+)'\)/)?.[1];let task=data.tasks.find(t=>t.id===id);if(!task)return full;return start+body+`<div class="v21-status"><select aria-label="${esc(task.title)} 상태 변경" onclick="event.stopPropagation()" onchange="v21ChangeStatus(event,'${id}')">${selectOpts(statuses,task.status)}</select></div>`+end})};
const v21TasksPage=tasksPage;
tasksPage=function(){let html=v21TasksPage();if(filterProject!=='all'){const p=data.projects.find(p=>p.id===filterProject);if(p){html=html.replace('<div id="taskArea">',`<div class="v21-projectfocus"><div><strong>${esc(p.name)} · 전용 작업 공간</strong><small>${esc(p.description||'프로젝트별 업무 보드')} · ${pct(p)}% 완료</small></div><button class="btn-soft" onclick="openProjectDetails('${p.id}')">프로젝트 상세 →</button></div><div id="taskArea">`)}}return html.replace('<div id="taskArea">',v21WorkspaceToolbar()+'<div class="v21-boardhint">PC에서는 드래그, 모바일에서는 업무 카드 하단 상태 선택으로 이동할 수 있습니다.</div><div id="taskArea">')};
const v21ProjectsPage=projectsPage;
// Expose both view and edit from the project card instead of opening an edit form on tap.
projectsPage=function(){return v21ProjectsPage().replace(/onclick="openProject\('([^']+)'\)"/g,(_,id)=>`onclick="openProjectDetails('${id}')"`)};
const v21EnhanceUI=enhanceUI;
enhanceUI=function(){v21EnhanceUI();let brand=document.querySelector('.brand-copy strong');if(brand)brand.textContent='2.1';if(page==='dashboard'){let main=document.getElementById('main');let welcome=main.querySelector('.v2-welcome');if(welcome){welcome.insertAdjacentHTML('afterend',`<div class="v21-shortcuts"><button class="btn-soft" onclick="navigate('tasks')">▦ 업무 보드</button><button class="btn-soft" onclick="navigate('projects')">▣ 프로젝트</button><button class="btn-soft" onclick="openNotifications()">♧ 알림센터</button><button class="btn-soft" onclick="openActivityPage()">◷ 활동 로그</button></div>`)}}if(page==='projects'){let main=document.getElementById('main');main.insertAdjacentHTML('afterbegin',`<p class="v21-boardhint">프로젝트 카드를 누르면 상세 화면이 열립니다. 상세 화면에서 편집하거나 전용 업무 보드로 이동할 수 있습니다.</p>`)}}
const v21ImportJSON=importJSON;
// Existing v1/v2 exports remain valid; retain additional fields when importing.
const v21ResetDemo=resetDemo;resetDemo=function(){v21ResetDemo();v21Workspace='all'};

load();render();

</script></body></html>

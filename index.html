<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b32"><title>NEXUS | 프로젝트 업무 관리</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#1b2944;--sub:#77829a;--line:#e5eaf2;--primary:#5365e8;--tint:#eff1ff;--ok:#15866b;--warn:#b47720;--shadow:0 12px 34px #1c2f5108}body.dark{--bg:#101726;--panel:#1a2538;--ink:#f1f5ff;--sub:#a2aec5;--line:#334058;--primary:#9aa5ff;--tint:#303654;--ok:#58d0a9;--warn:#e8ba76;--shadow:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{display:flex;min-height:100dvh}.side{width:250px;position:sticky;top:0;height:100dvh;background:var(--panel);border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:28px;flex-shrink:0}.brand{font-size:22px;font-weight:850;letter-spacing:-1.1px;padding:0 14px}.brand i{display:inline-block;width:10px;height:10px;background:var(--primary);border-radius:3px;transform:rotate(18deg);margin-right:10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button,.bottom button{border:0;background:transparent;color:var(--sub);text-align:left;padding:13px 15px;border-radius:13px;font-weight:680}.nav button.active{background:var(--tint);color:var(--primary)}.nav button span{margin-right:12px;font-size:18px}.sidefoot{margin-top:auto;color:var(--sub);font-size:12px;padding:13px}.main{width:min(100%,1400px);min-width:0;margin:auto;padding:28px clamp(18px,3vw,44px) 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:11px;color:var(--sub);font-weight:800}.title{font-size:clamp(25px,3vw,35px);line-height:1.25;font-weight:850;letter-spacing:-1px;margin:9px 0}.muted{color:var(--sub)}.small{font-size:13px}.topright{display:flex;gap:8px;align-items:center}.badge{display:inline-block;color:var(--primary);background:var(--tint);border-radius:100px;padding:5px 11px;font-weight:750;font-size:12px}.btn{background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:12px;padding:11px 15px;font-weight:750;white-space:nowrap}.btn.alt{background:var(--panel);color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--primary);border-color:var(--line)}.btn.danger{background:#fff1f1;color:#bc3f52;border-color:#ffd5d9}.btn.tiny{padding:7px 11px;border-radius:9px;font-size:12px}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:var(--shadow);min-width:0}.metric strong{font-size:28px;display:block;margin-top:9px;letter-spacing:-1px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.section{margin:28px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:19px;letter-spacing:-.5px;margin:0}.progress{height:11px;border-radius:40px;background:var(--tint);overflow:hidden}.progress>div{background:var(--primary);height:100%;border-radius:40px}.task{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.task:last-child{border:0}.task strong{display:block;font-size:14px}.task p{margin:3px 0 0}.task-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);outline-color:var(--primary);min-width:0}.fieldlabel{display:block;font-size:12px;color:var(--sub);font-weight:800;margin:15px 0 6px}.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.person{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.person:last-child{border:0}.avatar{width:39px;height:39px;background:var(--tint);color:var(--primary);display:grid;place-items:center;border-radius:13px;font-weight:850;flex-shrink:0}.person .info{min-width:0;flex:1}.person .info strong{display:block}.empty{padding:30px 12px;text-align:center;color:var(--sub);background:var(--bg);border-radius:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:10px;color:var(--sub)}.tabs button.active{background:var(--tint);color:var(--primary);border-color:var(--primary)}.tablewrap{overflow-x:auto}.simple-table{border-collapse:collapse;width:100%;font-size:13px}.simple-table th,.simple-table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.simple-table th{color:var(--sub);font-size:12px}.modal{position:fixed;inset:0;background:#06112699;z-index:80;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:var(--panel);border-radius:20px;width:min(100%,540px);max-height:88dvh;overflow:auto;padding:24px;box-shadow:0 20px 70px #0003}.dialog h2{margin:0;font-size:21px}.dialog .actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:22px}.bottom{display:none}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1b2944;color:#fff;border-radius:12px;padding:12px 18px;z-index:100;display:none;max-width:90vw}.toast.show{display:block}.hint{background:var(--tint);border-radius:12px;padding:12px 15px;color:var(--ink);font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.reportbox{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;line-height:1.9}.pill{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--sub)}.dangertext{color:#c34b5e}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.side{width:210px}}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:19px 15px calc(105px + env(safe-area-inset-bottom))}.top{margin-bottom:19px}.topright .badge{display:none}.panel{padding:16px;border-radius:16px}.metrics{gap:10px;margin:18px 0}.metric strong{font-size:24px}.section{margin-top:24px}.bottom{position:fixed;z-index:40;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bottom button{font-size:10px;text-align:center;padding:6px 1px;border-radius:9px;line-height:1.35}.bottom button b{display:block;font-size:20px;font-weight:400}.bottom button.active{color:var(--primary);background:var(--tint)}.task{grid-template-columns:1fr}.two,.split{grid-template-columns:1fr}.dialog{border-radius:22px 22px 0 0;width:100%;max-height:91dvh;padding:22px 18px 30px}.modal{align-items:flex-end;padding:0}.task-controls select{flex:1}.top .btn{padding:9px 11px;font-size:12px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><i></i>NEXUS</div><nav class="nav" id="nav"></nav><div class="sidefoot">담당자 전용 · 내 브라우저에 저장<br>관리자 화면은 하나로 간단하게.</div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="breadcrumb">PROJECT WORKSPACE · LOCAL</div><div id="topTitle" class="title">오늘의 업무</div></div><div class="topright"><span class="badge">담당자 계정</span><button class="btn alt tiny" onclick="toggleTheme()" aria-label="테마 변경">◐</button></div></div><div id="view"></div></main></div><nav class="bottom" id="bottom"></nav><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><input id="import" type="file" accept="application/json,.json" hidden onchange="importData(event)"><script>
'use strict';
const KEY='nexus_workspace_v1', PREF='nexus_simple_prefs';
const tabs=[['home','홈','⌂'],['work','업무','☷'],['report','하루 보고','▤'],['people','직원','♧'],['more','설정','⚙']];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const stamp=()=>new Date().toISOString();const fmt=d=>d||'—';
let data, pref={}, page='home', filter='all';
function starters(){return [{id:uid(),name:'김서연',role:'기획 · PM'},{id:uid(),name:'박지훈',role:'프론트엔드 개발'},{id:uid(),name:'이하린',role:'UI/UX 디자인'},{id:uid(),name:'최도윤',role:'백엔드 개발'}]}
function load(){try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.projects)||!Array.isArray(data.tasks)||!Array.isArray(data.members))data={projects:[],tasks:[],members:starters(),activities:[]};try{pref=JSON.parse(localStorage.getItem(PREF))||{}}catch(e){pref={}}data.projects??=[];data.tasks??=[];data.members??=[];data.dailyReports??=[];data.activities??=[];data.managerReports??=[];if(!data.members.length&&!pref.staffInitialized){data.members=starters();pref.staffInitialized=true}if(!Array.isArray(data.managerReports))data.managerReports=[];if(!pref.activeId||!data.projects.some(x=>x.id===pref.activeId)){pref.activeId=data.projects.find(x=>x.status==='active')?.id||data.projects[0]?.id||''}persist()}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(PREF,JSON.stringify(pref))}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function project(){return data.projects.find(x=>x.id===pref.activeId)}
function tasks(){return data.tasks.filter(t=>t.projectId===pref.activeId)}
function done(t){return t.status==='done'||t.status==='completed'}
function progress(ts){return ts.length?Math.round(ts.filter(done).length/ts.length*100):0}
function name(id){return data.members.find(m=>m.id===id)?.name||'미배정'}
function pName(id){return data.projects.find(p=>p.id===id)?.name||'프로젝트'}
function status(s){return ({todo:'할 일',progress:'진행 중',review:'검토 대기',done:'완료',completed:'완료'})[s]||s||'할 일'}
function saveChange(msg){persist();render();toast(msg)}
function toggleTheme(){pref.dark=!pref.dark;saveChange('테마를 변경했어요')}
function render(){document.body.classList.toggle('dark',!!pref.dark);document.getElementById('nav').innerHTML=tabs.map(([id,n,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><span>${icon}</span>${n}</button>`).join('');document.getElementById('bottom').innerHTML=tabs.map(([id,n,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><b>${icon}</b>${n}</button>`).join('');document.getElementById('topTitle').textContent=({home:'오늘의 업무',work:'프로젝트 업무',report:'하루 업무보고',people:'직원 관리',more:'설정 및 프로젝트'})[page];document.getElementById('view').innerHTML=({home:homePage,work:workPage,report:reportPage,people:peoplePage,more:morePage})[page]();}
function activeCard(){let p=project();if(!p)return `<div class="panel"><h2>첫 프로젝트를 만들어보세요</h2><p class="muted">프로젝트 하나를 선택해서 집중적으로 진행합니다. 직원은 준비되어 있고, 업무를 만들 때 자동 배정할 수 있어요.</p><button class="btn" onclick="editProject()">＋ 첫 프로젝트 시작</button></div>`;let t=tasks(),n=progress(t);return `<div class="panel"><div class="row wrap"><div><div class="eyebrow">지금 진행하는 프로젝트</div><h2 style="margin:8px 0;font-size:23px">${E(p.name)}</h2><div class="muted small">${E(p.description||'프로젝트 업무를 관리하세요')}</div></div><button class="btn alt tiny" onclick="navigate('more')">프로젝트 관리</button></div><div class="row" style="margin:22px 0 9px"><strong>전체 진행률</strong><strong>${n}%</strong></div><div class="progress"><div style="width:${n}%"></div></div><div class="muted small" style="margin-top:9px">완료 ${t.filter(done).length}건 / 전체 ${t.length}건 · 업무 건수 기준</div></div>`}
function homePage(){let ts=tasks(),d=ts.filter(done).length,rev=ts.filter(t=>t.status==='review').length,over=ts.filter(t=>!done(t)&&t.due&&t.due<today()).length;return `<p class="muted" style="margin:-10px 0 19px">한 번에 하나의 프로젝트에 집중하고, 하루가 끝나면 결과를 정리하세요.</p>${activeCard()}${project()?`<div class="grid metrics"><div class="panel metric"><div class="muted small">전체 업무</div><strong>${ts.length}</strong></div><div class="panel metric"><div class="muted small">완료</div><strong>${d}</strong></div><div class="panel metric"><div class="muted small">검토 대기</div><strong>${rev}</strong></div><div class="panel metric"><div class="muted small">마감 지연</div><strong>${over}</strong></div></div><div class="cols"><section class="panel"><div class="row wrap"><h2 style="margin:0;font-size:19px">우선 처리할 업무</h2><button class="btn tiny" onclick="editTask()">＋ 업무 추가</button></div>${taskRows(ts.filter(t=>!done(t)).sort((a,b)=>(a.status==='review'?-1:0)-(b.status==='review'?-1:0)).slice(0,6))}<button class="btn alt" style="width:100%;margin-top:14px" onclick="navigate('work')">전체 업무 보기</button></section><section class="panel"><h2 style="margin:0 0 13px;font-size:19px">팀원별 진행 현황</h2>${peopleSummary(ts)}<button class="btn alt" style="width:100%;margin-top:15px" onclick="navigate('report')">오늘 보고서 작성 →</button></section></div>`:''}`}
function taskRows(ts){if(!ts.length)return `<div class="empty">표시할 업무가 없어요.</div>`;return ts.map(t=>`<div class="task"><div><strong>${E(t.title)}</strong><p class="small muted">${E(name(t.assigneeId))} · ${status(t.status)}${t.due?' · 마감 '+E(t.due):''}</p></div><div class="task-controls"><button class="btn alt tiny" onclick="editTask('${E(t.id)}')">수정</button><select class="field" style="width:auto;padding:8px" aria-label="업무 상태" onchange="setTaskStatus('${E(t.id)}',this.value)">${['todo','progress','review','done'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div></div>`).join('')}
function workPage(){let p=project();if(!p)return activeCard();let ts=tasks().filter(t=>filter==='all'||(filter==='done'?done(t):t.status===filter));return `<div class="row wrap" style="margin-bottom:18px"><div class="muted">${E(p.name)} · 업무 등록 및 담당자 배정</div><button class="btn" onclick="editTask()">＋ 업무 만들기</button></div><div class="tabs" style="margin-bottom:16px">${[['all','전체'],['todo','할 일'],['progress','진행 중'],['review','검토 대기'],['done','완료']].map(([k,v])=>`<button class="${filter===k?'active':''}" onclick="filter='${k}';render()">${v}</button>`).join('')}</div><div class="panel">${taskRows(ts)}</div><div class="hint" style="margin-top:15px">직원이 작업을 완료했다면 ‘검토 대기’로 변경하고, 담당자가 검토 후 ‘완료’ 처리하세요. 진행률은 완료된 업무 건수를 기준으로 계산됩니다.</div>`}
function peopleSummary(ts){let counts=data.members.map(m=>({m,total:ts.filter(t=>t.assigneeId===m.id).length,done:ts.filter(t=>t.assigneeId===m.id&&done(t)).length}));return counts.map(({m,total,done:d})=>`<div class="person"><span class="avatar">${E(m.name?.slice(0,1)||'팀')}</span><div class="info"><strong>${E(m.name)}</strong><span class="muted small">${E(m.role||'팀원')} · 완료 ${d}/${total}</span></div><span class="badge">${total?Math.round(d/total*100):0}%</span></div>`).join('')||'<div class="empty">직원을 등록해 주세요</div>'}
function peoplePage(){return `<div class="row wrap" style="margin-bottom:17px"><p class="muted" style="margin:0">가상 팀원으로 시작하고, 필요할 때 추가·수정·삭제하세요.</p><button class="btn" onclick="editMember()">＋ 직원 추가</button></div><div class="panel">${data.members.map(m=>`<div class="person"><span class="avatar">${E(m.name?.slice(0,1))}</span><div class="info"><strong>${E(m.name)}</strong><span class="muted small">${E(m.role||'팀원')}</span></div><button class="btn alt tiny" onclick="editMember('${E(m.id)}')">관리</button></div>`).join('')||'<div class="empty">등록된 직원이 없습니다.</div>'}</div><div class="hint" style="margin-top:14px">업무를 만들 때 업무 분야에 맞는 직원이 추천돼요. 배정 결과는 직접 변경할 수 있습니다.</div>`}
function recs(title){let z=(title||'').toLowerCase();let keys=[['디자인|ui|ux|화면|시안','디자'],['api|서버|db|데이터|인증|백엔드','백엔드'],['프론트|웹|컴포넌트|퍼블리싱|html|css','프론트'],['기획|요구|정책|일정|분석','기획']];let key=keys.find(([regex])=>new RegExp(regex).test(z))?.[1];if(key){let m=data.members.find(m=>(m.role||'').includes(key));if(m)return m.id}let counts=Object.fromEntries(data.members.map(m=>[m.id,tasks().filter(t=>t.assigneeId===m.id&&!done(t)).length]));return [...data.members].sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0))[0]?.id||''}
function editTask(id=''){let t=data.tasks.find(t=>t.id===id)||{title:'',description:'',assigneeId:'',status:'todo',priority:'medium',due:''};openModal(`<h2>${id?'업무 수정':'새 업무 만들기'}</h2><form onsubmit="saveTask(event,'${E(id)}')"><label class="fieldlabel">업무 이름 *</label><input class="field" id="tasktitle" name="title" maxlength="110" required value="${E(t.title)}" oninput="suggestAssignee(this.value)" placeholder="예: 로그인 API 개발"><label class="fieldlabel">업무 내용</label><textarea class="field" name="description" rows="3">${E(t.description||'')}</textarea><div class="two"><div><label class="fieldlabel">담당 직원</label><select class="field" id="assignee" name="assigneeId"><option value="">미배정</option>${data.members.map(m=>`<option value="${E(m.id)}" ${t.assigneeId===m.id?'selected':''}>${E(m.name)} · ${E(m.role)}</option>`).join('')}</select></div><div><label class="fieldlabel">상태</label><select class="field" name="status">${['todo','progress','review','done'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div></div><label class="fieldlabel">마감일 (선택)</label><input class="field" type="date" name="due" value="${E(t.due||'')}"><div class="actions">${id?`<button type="button" class="btn danger" onclick="deleteTask('${E(id)}')">삭제</button>`:''}<button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`);if(!id)suggestAssignee('')}
function suggestAssignee(value){let el=document.getElementById('assignee');if(el&&(!el.dataset.changed||el.value===''))el.value=recs(value);if(el&&!el.dataset.bound){el.dataset.bound='1';el.addEventListener('change',()=>el.dataset.changed='1')}}
function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),t=data.tasks.find(x=>x.id===id),oldDone=t&&done(t),newStatus=f.get('status');if(!t){t={id:uid(),projectId:pref.activeId,createdAt:stamp()};data.tasks.push(t)}Object.assign(t,{title:String(f.get('title')).trim(),description:String(f.get('description')),assigneeId:String(f.get('assigneeId')),status:newStatus,due:String(f.get('due'))});if(!oldDone&&done(t))t.completedAt=stamp();if(oldDone&&!done(t))t.completedAt=null;closeModal();saveChange('업무를 저장했어요')}
function setTaskStatus(id,s){let t=data.tasks.find(t=>t.id===id);if(!t)return;let was=done(t);t.status=s;if(!was&&done(t))t.completedAt=stamp();if(was&&!done(t))t.completedAt=null;saveChange('업무 상태를 변경했어요')}
function deleteTask(id){if(!confirm('이 업무를 삭제할까요?'))return;data.tasks=data.tasks.filter(t=>t.id!==id);closeModal();saveChange('업무를 삭제했어요')}
function editMember(id=''){let m=data.members.find(x=>x.id===id)||{name:'',role:''};openModal(`<h2>${id?'직원 정보 수정':'직원 추가'}</h2><form onsubmit="saveMember(event,'${E(id)}')"><label class="fieldlabel">이름 *</label><input class="field" name="name" value="${E(m.name)}" required maxlength="40"><label class="fieldlabel">담당 업무 / 직무</label><input class="field" name="role" value="${E(m.role)}" maxlength="70" placeholder="예: 프론트엔드 개발자"><div class="actions">${id?`<button type="button" class="btn danger" onclick="deleteMember('${E(id)}')">삭제</button>`:''}<button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`)}
function saveMember(e,id){e.preventDefault();let f=new FormData(e.target),m=data.members.find(x=>x.id===id);if(!m){m={id:uid()};data.members.push(m)}m.name=String(f.get('name')).trim();m.role=String(f.get('role')).trim();closeModal();saveChange('직원 정보를 저장했어요')}
function deleteMember(id){if(!confirm('이 직원을 삭제할까요? 기존 담당 업무는 미배정으로 변경됩니다.'))return;data.members=data.members.filter(m=>m.id!==id);data.tasks.forEach(t=>{if(t.assigneeId===id)t.assigneeId=''});closeModal();saveChange('직원을 삭제했어요')}
function editProject(id=''){let p=data.projects.find(p=>p.id===id)||{name:'',description:''};openModal(`<h2>${id?'프로젝트 수정':'새 프로젝트'}</h2><form onsubmit="saveProject(event,'${E(id)}')"><label class="fieldlabel">프로젝트 이름 *</label><input class="field" name="name" value="${E(p.name)}" required maxlength="90"><label class="fieldlabel">프로젝트 설명</label><textarea class="field" name="description" rows="3">${E(p.description||'')}</textarea><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`)}
function saveProject(e,id){e.preventDefault();let f=new FormData(e.target),p=data.projects.find(x=>x.id===id);if(!p){p={id:uid(),createdAt:stamp(),status:'active'};data.projects.push(p)}p.name=String(f.get('name')).trim();p.description=String(f.get('description')).trim();pref.activeId=p.id;closeModal();navigate('home');saveChange('현재 프로젝트를 설정했어요')}
function selectProject(id){pref.activeId=id;saveChange('현재 프로젝트를 변경했어요')}
function finishProject(){let p=project();if(!p)return;if(!confirm(`“${p.name}” 프로젝트를 완료 처리할까요? 기존 기록은 그대로 보관됩니다.`))return;p.status='completed';p.finishedAt=stamp();pref.activeId=data.projects.find(x=>x.id!==p.id&&x.status!=='completed')?.id||'';saveChange('프로젝트를 완료 처리했어요')}
function reports(){return data.managerReports.filter(r=>r.projectId===pref.activeId).sort((a,b)=>b.date.localeCompare(a.date))}
function reportPage(){let p=project();if(!p)return activeCard();let d=today(),r=reports(),todayTs=tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===d),todayCount=todayTs.length;let entries=data.dailyReports.filter(x=>x.projectId===p.id&&((x.date||x.createdAt||'').slice(0,10)===d));return `<div class="hint">회사 업무 종료 기준은 <strong>18:00</strong>으로 설정했어요. 18시 이전에도 초안을 저장할 수 있고, 퇴근 후 직원들의 보고 내용을 확인해 최종 보고서를 작성하면 됩니다.</div><div class="grid metrics"><div class="panel metric"><div class="muted small">오늘 완료 업무</div><strong>${todayCount}</strong></div><div class="panel metric"><div class="muted small">프로젝트 진행률</div><strong>${progress(tasks())}%</strong></div><div class="panel metric"><div class="muted small">직원 일일 보고</div><strong>${entries.length}</strong></div><div class="panel metric"><div class="muted small">기록된 담당자 보고</div><strong>${r.length}</strong></div></div><div class="cols"><div class="panel"><div class="row wrap"><h2 style="font-size:19px;margin:0">담당자 하루 보고서</h2><button class="btn" onclick="editReport()">＋ ${r.some(x=>x.date===d)?'오늘 보고 수정':'오늘 보고 작성'}</button></div><p class="muted small">기존 직원 보고와 업무 완료 기록을 참고해 상사에게 보고할 내용을 작성해요.</p>${r.length?r.map(x=>`<div class="task"><div><strong>${E(x.date)} · ${E(x.title||'일일 업무 결과')}</strong><p class="muted small">${x.submittedAt?'보고 완료':'임시 저장'} · ${E((x.summary||'').slice(0,65))}</p></div><button class="btn alt tiny" onclick="editReport('${E(x.id)}')">열기</button></div>`).join(''):'<div class="empty">아직 작성한 하루 보고서가 없어요.</div>'}</div><div class="panel"><h2 style="font-size:19px;margin:0 0 14px">오늘의 팀원 성과</h2>${peopleSummary(tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===d))}<div class="section"><h2>오늘 완료한 업무</h2></div>${todayTs.length?todayTs.map(t=>`<div class="person"><div class="info"><strong>${E(t.title)}</strong><span class="muted small">${E(name(t.assigneeId))}</span></div></div>`).join(''):'<div class="empty">오늘 완료 시간 기록이 있는 업무가 없어요. 이전 버전의 완료 업무는 날짜를 추정하지 않습니다.</div>'}</div></div>`}
function editReport(id=''){let r=data.managerReports.find(x=>x.id===id)||data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===today())||{date:today(),summary:'',next:'',issues:'',title:'일일 업무 결과'};let ts=tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===r.date);let notes=data.dailyReports.filter(x=>x.projectId===pref.activeId&&(x.date||x.createdAt||'').slice(0,10)===r.date);openModal(`<h2>담당자 하루 업무보고</h2><p class="muted small">완료 기록과 직원 보고를 확인해 작성해 주세요.</p><form onsubmit="saveReport(event,'${E(r.id||'')}')"><label class="fieldlabel">보고 날짜</label><input class="field" type="date" name="date" required value="${E(r.date)}"><label class="fieldlabel">오늘의 성과 · 상사 보고 내용 *</label><textarea class="field" name="summary" required rows="5" placeholder="오늘 진행한 결과와 프로젝트 진척을 정리하세요">${E(r.summary)}</textarea><label class="fieldlabel">내일 할 일</label><textarea class="field" name="next" rows="3">${E(r.next||'')}</textarea><label class="fieldlabel">문제점 및 지원 요청</label><textarea class="field" name="issues" rows="3">${E(r.issues||'')}</textarea><div class="hint" style="margin-top:16px">기록된 오늘 완료 업무: ${ts.length}건 / 기존 일일 보고: ${notes.length}건. 업무 완료 기록이 없는 경우 실제 작업량으로 간주하지 않아요.</div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button type="submit" class="btn alt" onclick="this.form.dataset.submit='draft'">임시 저장</button><button type="submit" class="btn" onclick="this.form.dataset.submit='send'">보고 완료</button></div></form>`)}
function saveReport(e,id){e.preventDefault();let f=new FormData(e.target),date=String(f.get('date')),r=data.managerReports.find(x=>x.id===id)||data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===date);if(!r){r={id:uid(),projectId:pref.activeId,createdAt:stamp()};data.managerReports.push(r)}Object.assign(r,{date,title:'일일 업무 결과',summary:String(f.get('summary')),next:String(f.get('next')),issues:String(f.get('issues')),updatedAt:stamp()});if(e.target.dataset.submit==='send')r.submittedAt=stamp();closeModal();saveChange(r.submittedAt?'하루 보고서를 완료했어요':'보고서를 임시 저장했어요')}
function morePage(){let p=project();return `<div class="section" style="margin-top:0"><h2>프로젝트 운영</h2><button class="btn" onclick="editProject()">＋ 새 프로젝트</button></div><div class="panel"><div class="hint">한 번에 하나의 프로젝트가 중심에 표시됩니다. 다른 프로젝트도 삭제되지 않으며 언제든 다시 선택할 수 있어요.</div>${data.projects.map(x=>`<div class="task"><div><strong>${E(x.name)} ${pref.activeId===x.id?'<span class="badge">진행 중</span>':''}</strong><p class="muted small">${x.status==='completed'?'완료 · 기록 보관':'업무 '+data.tasks.filter(t=>t.projectId===x.id).length+'건 · 완료 '+progress(data.tasks.filter(t=>t.projectId===x.id))+'%'}</p></div><div class="task-controls">${pref.activeId!==x.id?`<button class="btn alt tiny" onclick="selectProject('${E(x.id)}')">진행 선택</button>`:`<button class="btn alt tiny" onclick="editProject('${E(x.id)}')">수정</button>`}</div></div>`).join('')||'<div class="empty">등록된 프로젝트가 없습니다.</div>'}${p?`<button class="btn alt" onclick="finishProject()" style="margin-top:16px;width:100%">현재 프로젝트 완료 처리</button>`:''}</div><div class="section"><h2>데이터 및 환경</h2></div><div class="panel"><div class="row wrap"><div><strong>데이터 백업</strong><div class="muted small">프로젝트·직원·업무·보고서 전체를 JSON으로 저장</div></div><button class="btn alt tiny" onclick="exportData()">백업 다운로드</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>데이터 불러오기</strong><div class="muted small">기존 NEXUS 백업 파일도 사용할 수 있어요.</div></div><button class="btn alt tiny" onclick="document.getElementById('import').click()">JSON 불러오기</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>화면 테마</strong><div class="muted small">라이트 / 다크 모드</div></div><button class="btn alt tiny" onclick="toggleTheme()">테마 변경</button></div></div>`}
function exportData(){persist();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!Array.isArray(d.members)||!Array.isArray(d.tasks))throw Error('올바른 NEXUS 백업이 아닙니다');if(!confirm('현재 데이터가 불러온 데이터로 교체됩니다. 계속할까요?'))return;localStorage.setItem(KEY,JSON.stringify(d));data=d;load();saveChange('백업 데이터를 복원했어요')}catch(err){alert('불러오기 실패: '+err.message)}finally{e.target.value=''}}
function openModal(s){document.getElementById('dialog').innerHTML=s;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
load();render();
</script></body></html>

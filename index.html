:root{--bg:#f5f7fb;--panel:#fff;--ink:#1b2944;--sub:#77829a;--line:#e5eaf2;--primary:#5365e8;--tint:#eff1ff;--ok:#15866b;--warn:#b47720;--shadow:0 12px 34px #1c2f5108}body.dark{--bg:#101726;--panel:#1a2538;--ink:#f1f5ff;--sub:#a2aec5;--line:#334058;--primary:#9aa5ff;--tint:#303654;--ok:#58d0a9;--warn:#e8ba76;--shadow:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{display:flex;min-height:100dvh}.side{width:250px;position:sticky;top:0;height:100dvh;background:var(--panel);border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:28px;flex-shrink:0}.brand{font-size:22px;font-weight:850;letter-spacing:-1.1px;padding:0 14px}.brand i{display:inline-block;width:10px;height:10px;background:var(--primary);border-radius:3px;transform:rotate(18deg);margin-right:10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button,.bottom button{border:0;background:transparent;color:var(--sub);text-align:left;padding:13px 15px;border-radius:13px;font-weight:680}.nav button.active{background:var(--tint);color:var(--primary)}.nav button span{margin-right:12px;font-size:18px}.sidefoot{margin-top:auto;color:var(--sub);font-size:12px;padding:13px}.main{width:min(100%,1400px);min-width:0;margin:auto;padding:28px clamp(18px,3vw,44px) 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:11px;color:var(--sub);font-weight:800}.title{font-size:clamp(25px,3vw,35px);line-height:1.25;font-weight:850;letter-spacing:-1px;margin:9px 0}.muted{color:var(--sub)}.small{font-size:13px}.topright{display:flex;gap:8px;align-items:center}.badge{display:inline-block;color:var(--primary);background:var(--tint);border-radius:100px;padding:5px 11px;font-weight:750;font-size:12px}.btn{background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:12px;padding:11px 15px;font-weight:750;white-space:nowrap}.btn.alt{background:var(--panel);color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;color:var(--primary);border-color:var(--line)}.btn.danger{background:#fff1f1;color:#bc3f52;border-color:#ffd5d9}.btn.tiny{padding:7px 11px;border-radius:9px;font-size:12px}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:var(--shadow);min-width:0}.metric strong{font-size:28px;display:block;margin-top:9px;letter-spacing:-1px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.section{margin:28px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-size:19px;letter-spacing:-.5px;margin:0}.progress{height:11px;border-radius:40px;background:var(--tint);overflow:hidden}.progress>div{background:var(--primary);height:100%;border-radius:40px}.task{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.task:last-child{border:0}.task strong{display:block;font-size:14px}.task p{margin:3px 0 0}.task-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);outline-color:var(--primary);min-width:0}.fieldlabel{display:block;font-size:12px;color:var(--sub);font-weight:800;margin:15px 0 6px}.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.person{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.person:last-child{border:0}.avatar{width:39px;height:39px;background:var(--tint);color:var(--primary);display:grid;place-items:center;border-radius:13px;font-weight:850;flex-shrink:0}.person .info{min-width:0;flex:1}.person .info strong{display:block}.empty{padding:30px 12px;text-align:center;color:var(--sub);background:var(--bg);border-radius:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:10px;color:var(--sub)}.tabs button.active{background:var(--tint);color:var(--primary);border-color:var(--primary)}.tablewrap{overflow-x:auto}.simple-table{border-collapse:collapse;width:100%;font-size:13px}.simple-table th,.simple-table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.simple-table th{color:var(--sub);font-size:12px}.modal{position:fixed;inset:0;background:#06112699;z-index:80;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:var(--panel);border-radius:20px;width:min(100%,540px);max-height:88dvh;overflow:auto;padding:24px;box-shadow:0 20px 70px #0003}.dialog h2{margin:0;font-size:21px}.dialog .actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:22px}.bottom{display:none}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1b2944;color:#fff;border-radius:12px;padding:12px 18px;z-index:100;display:none;max-width:90vw}.toast.show{display:block}.hint{background:var(--tint);border-radius:12px;padding:12px 15px;color:var(--ink);font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.reportbox{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;line-height:1.9}.pill{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--sub)}.dangertext{color:#c34b5e}.scorecard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.scorehead{display:flex;justify-content:space-between;align-items:center;gap:10px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scoregrid label{font-size:12px;color:var(--sub)}.checkline{display:flex;gap:7px;align-items:center;margin:9px 0;font-size:13px}.checkline input{accent-color:var(--primary);width:17px;height:17px}.reporttools{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.reporttools button{white-space:normal}@media(max-width:560px){.scoregrid{grid-template-columns:1fr}}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.side{width:210px}}@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:19px 15px calc(105px + env(safe-area-inset-bottom))}.top{margin-bottom:19px}.topright .badge{display:none}.panel{padding:16px;border-radius:16px}.metrics{gap:10px;margin:18px 0}.metric strong{font-size:24px}.section{margin-top:24px}.bottom{position:fixed;z-index:40;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bottom button{font-size:10px;text-align:center;padding:6px 1px;border-radius:9px;line-height:1.35}.bottom button b{display:block;font-size:20px;font-weight:400}.bottom button.active{color:var(--primary);background:var(--tint)}.task{grid-template-columns:1fr}.two,.split{grid-template-columns:1fr}.dialog{border-radius:22px 22px 0 0;width:100%;max-height:91dvh;padding:22px 18px 30px}.modal{align-items:flex-end;padding:0}.task-controls select{flex:1}.top .btn{padding:9px 11px;font-size:12px}}
.featuregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.featurechoice{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;font-size:13px}.featurechoice input{accent-color:var(--primary);flex-shrink:0}.featurechoice span{flex:1}.featurechoice small{color:var(--sub);white-space:nowrap}@media(max-width:520px){.featuregrid{grid-template-columns:1fr}} .worker-progress{padding:16px 0;border-top:1px solid var(--line)}.worker-progress:first-of-type{border-top:none}.worker-progress .field{margin:0}.worker-progress .progress{height:8px}input[type=number]{font-size:16px}@media(max-width:620px){.worker-progress .row{align-items:center}.worker-progress .btn{white-space:nowrap}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><i></i>NEXUS</div><nav class="nav" id="nav"></nav><div class="sidefoot">담당자 전용 · 내 브라우저에 저장<br>관리자 화면은 하나로 간단하게.</div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="breadcrumb">PROJECT WORKSPACE · LOCAL</div><div id="topTitle" class="title">오늘의 업무</div></div><div class="topright"><span class="badge">담당자 계정</span><button class="btn alt tiny" onclick="toggleTheme()" aria-label="테마 변경">◐</button></div></div><div id="view"></div></main></div><nav class="bottom" id="bottom"></nav><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><input id="import" type="file" accept="application/json,.json" hidden onchange="importData(event)"><script>
'use strict';
const KEY='nexus_workspace_v1', PREF='nexus_simple_prefs';
const tabs=[['home','홈','⌂'],['work','업무','☷'],['report','진행 분석','▤'],['people','직원','♧'],['more','설정','⚙']];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const stamp=()=>new Date().toISOString();const fmt=d=>d||'—';
let data, pref={}, page='home', filter='all';
function starters(){return [{id:uid(),name:'김서연',role:'기획 · PM'},{id:uid(),name:'박지훈',role:'프론트엔드 개발'},{id:uid(),name:'이하린',role:'UI/UX 디자인'},{id:uid(),name:'최도윤',role:'백엔드 개발'}]}
function load(){try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.projects)||!Array.isArray(data.tasks)||!Array.isArray(data.members))data={projects:[],tasks:[],members:starters(),activities:[]};try{pref=JSON.parse(localStorage.getItem(PREF))||{}}catch(e){pref={}}data.projects??=[];data.tasks??=[];data.members??=[];data.dailyReports??=[];data.activities??=[];data.managerReports??=[];if(!data.members.length&&!pref.staffInitialized){data.members=starters();pref.staffInitialized=true}if(!Array.isArray(data.managerReports))data.managerReports=[];if(!pref.activeId||!data.projects.some(x=>x.id===pref.activeId)){pref.activeId=data.projects.find(x=>x.status==='active')?.id||data.projects[0]?.id||''}persist()}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(PREF,JSON.stringify(pref))}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function project(){return data.projects.find(x=>x.id===pref.activeId)}
function tasks(){return data.tasks.filter(t=>t.projectId===pref.activeId)}
function done(t){return t.status==='done'||t.status==='completed'}
function progress(ts){let p=project();if(p&&p.employeeProgress&&Object.keys(p.employeeProgress).length){let ids=[...new Set(ts.map(t=>t.assigneeId).filter(Boolean))];if(!ids.length)return 0;let weighted=ids.reduce((a,id)=>{let count=ts.filter(t=>t.assigneeId===id).length;return a+count*Number(p.employeeProgress[id]??0)},0);return Math.round(weighted/Math.max(1,ts.length))}return ts.length?Math.round(ts.filter(done).length/ts.length*100):0}
const DURATIONS={w1:['1주',7],w2:['2주',14],w3:['3주',21],w4:['4주',28],m1:['1개월',30],m3:['3개월',90],m6:['6개월',180],y1:['1년',365]};
function daysSince(start){if(!start)return 0;let d=new Date(start+'T12:00:00'),now=new Date(today()+'T12:00:00');return Math.max(0,Math.round((now-d)/86400000))}
function plannedProgress(p){return p?Math.min(100,Math.round(daysSince((p.startDate||p.createdAt||today()).slice(0,10))/Math.max(1,DURATIONS[p.duration]?.[1]||30)*100)):0}
function projectProgress(p){if(!p)return 0;let ts=data.tasks.filter(t=>t.projectId===p.id),ids=[...new Set(ts.map(t=>t.assigneeId).filter(Boolean))];if(p.employeeProgress&&Object.keys(p.employeeProgress).length&&ids.length)return Math.round(ids.reduce((v,id)=>v+ts.filter(t=>t.assigneeId===id).length*Number(p.employeeProgress[id]??0),0)/Math.max(1,ts.length));return ts.length?Math.round(ts.filter(done).length/ts.length*100):0}
function saveEmployeeProgress(id){let p=project(),v=document.getElementById('employeePercent_'+id);if(!p||!v)return;let pct=Math.max(0,Math.min(100,Number(v.value)||0)),before=Number(p.employeeProgress?.[id]??0);p.employeeProgress??={};p.employeeProgress[id]=pct;p.progressHistory??=[];p.progressHistory.push({date:today(),at:stamp(),memberId:id,previous:before,percent:pct});saveChange(name(id)+' 진행률을 '+pct+'%로 저장했어요')}
function progressPage(){let p=project();if(!p)return activeCard();let ts=tasks(),pProg=projectProgress(p),plan=plannedProgress(p),hist=p.progressHistory||[],staff=data.members.filter(m=>ts.some(t=>t.assigneeId===m.id)),yesterday=new Date(Date.now()-86400000).toLocaleDateString('sv-SE');let day=hist.filter(h=>h.date===today()),prev=hist.filter(h=>h.date===yesterday);let lastChange=new Map();for(let h of day)lastChange.set(h.memberId,(lastChange.get(h.memberId)||0)+(Number(h.percent)-Number(h.previous)));return `<div class="panel"><div class="eyebrow">진행 상황 · 담당자 직접 입력</div><h2>${E(p.name)}</h2><div class="row wrap"><div><div class="muted small">예상 기간</div><strong>${E(DURATIONS[p.duration]?.[0]||'미설정')}</strong></div><div><div class="muted small">시작일</div><strong>${E((p.startDate||p.createdAt||today()).slice(0,10))}</strong></div><div><div class="muted small">계획 진행률</div><strong>${plan}%</strong></div></div><div class="row" style="margin-top:18px"><strong>실제 입력 진행률</strong><strong>${pProg}%</strong></div><div class="progress"><div style="width:${pProg}%"></div></div><p class="muted small">${pProg>=plan?'계획 대비 '+(pProg-plan)+'%p 앞서거나 동일합니다.':'계획 대비 '+(plan-pProg)+'%p 낮습니다.'} · 업무 수 가중 평균이며 실제 작업 시간이나 성실도를 판정하지 않습니다.</p></div><section class="panel" style="margin-top:16px"><div class="row wrap"><h2 style="margin:0">직원별 진행률 입력</h2><span class="badge">${staff.length}명 배정</span></div><p class="muted small">직원별 %를 담당자가 설정하면 즉시 프로젝트 전체 진행률에 반영됩니다. 오늘 변경량도 기록됩니다.</p>${staff.map(m=>{let assigned=ts.filter(t=>t.assigneeId===m.id),pct=Number(p.employeeProgress?.[m.id]??(assigned.length?Math.round(assigned.filter(done).length/assigned.length*100):0)),delta=lastChange.get(m.id)||0;return `<div class="worker-progress"><div class="row wrap"><div><strong>${E(m.name)}</strong><div class="muted small">${E(m.role||'직원')} · 배정 업무 ${assigned.length}개 · 완료 ${assigned.filter(done).length}개</div></div><span class="badge">오늘 ${delta>0?'+':''}${delta}%p</span></div><div class="row" style="margin-top:12px;gap:10px"><input id="employeePercent_${E(m.id)}" type="number" min="0" max="100" value="${pct}" class="field" style="width:94px" aria-label="${E(m.name)} 진행률"><span>%</span><button class="btn tiny" onclick="saveEmployeeProgress('${E(m.id)}')">진행률 저장</button></div><div class="progress" style="margin-top:10px"><div style="width:${pct}%"></div></div></div>`}).join('')||'<div class="empty">직원에게 업무를 배정하면 여기에서 진행률을 관리할 수 있어요.</div>'}</section><div class="cols" style="margin-top:16px"><section class="panel"><h2>프로젝트 현황</h2><div class="person"><strong>총 업무</strong><span class="badge">${ts.length}건</span></div><div class="person"><strong>완료 업무</strong><span class="badge">${ts.filter(done).length}건</span></div><div class="person"><strong>오늘 진행률 수정</strong><span class="badge">${day.length}회</span></div><div class="person"><strong>어제 진행률 수정</strong><span class="badge">${prev.length}회</span></div></section><section class="panel"><h2>최근 진행 기록</h2>${hist.slice(-15).reverse().map(h=>`<div class="person"><div class="info"><strong>${E(name(h.memberId))}</strong><span class="muted small">${E(h.date)} · ${Number(h.previous)||0}% → ${Number(h.percent)||0}%</span></div></div>`).join('')||'<div class="empty">아직 진행률 변경 기록이 없어요.</div>'}</section></div><p class="hint">진행률과 계획 비교는 담당자가 입력한 추정치입니다. 성실도 평가 대신, 추이 및 배정 업무 수를 참고하세요. 과거 하루 보고서 데이터는 삭제되지 않고 백업에 보존됩니다.</p>`}

function name(id){return data.members.find(m=>m.id===id)?.name||'미배정'}
function pName(id){return data.projects.find(p=>p.id===id)?.name||'프로젝트'}
function status(s){return ({todo:'할 일',progress:'진행 중',review:'검토 대기',done:'완료',completed:'완료'})[s]||s||'할 일'}
function saveChange(msg){persist();render();toast(msg)}
function toggleTheme(){pref.dark=!pref.dark;saveChange('테마를 변경했어요')}
function render(){document.body.classList.toggle('dark',!!pref.dark);document.getElementById('nav').innerHTML=tabs.map(([id,n,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><span>${icon}</span>${n}</button>`).join('');document.getElementById('bottom').innerHTML=tabs.map(([id,n,icon])=>`<button onclick="navigate('${id}')" class="${page===id?'active':''}"><b>${icon}</b>${n}</button>`).join('');document.getElementById('topTitle').textContent=({home:'오늘의 업무',work:'프로젝트 업무',report:'프로젝트 진행 분석',people:'직원 관리',more:'설정 및 프로젝트'})[page];document.getElementById('view').innerHTML=({home:homePage,work:workPage,report:progressPage,people:peoplePage,more:morePage})[page]();}
function activeCard(){let p=project();if(!p)return `<div class="panel"><h2>첫 프로젝트를 만들어보세요</h2><p class="muted">프로젝트 하나를 선택해서 집중적으로 진행합니다. 직원은 준비되어 있고, 업무를 만들 때 자동 배정할 수 있어요.</p><button class="btn" onclick="editProject()">＋ 첫 프로젝트 시작</button></div>`;let t=tasks(),n=progress(t);return `<div class="panel"><div class="row wrap"><div><div class="eyebrow">지금 진행하는 프로젝트</div><h2 style="margin:8px 0;font-size:23px">${E(p.name)}</h2><div class="muted small">${E(p.description||'프로젝트 업무를 관리하세요')}</div></div><button class="btn alt tiny" onclick="navigate('more')">프로젝트 관리</button></div><div class="row" style="margin:22px 0 9px"><strong>전체 진행률</strong><strong>${n}%</strong></div><div class="progress"><div style="width:${n}%"></div></div><div class="muted small" style="margin-top:9px">완료 업무 ${t.filter(done).length}건 / 전체 ${t.length}건 · 직원별 진행률 입력 기준(입력 전 완료 건수 기준)</div></div>`}
function homePage(){let ts=tasks(),d=ts.filter(done).length,rev=ts.filter(t=>t.status==='review').length,over=ts.filter(t=>!done(t)&&t.due&&t.due<today()).length;return `<p class="muted" style="margin:-10px 0 19px">한 번에 하나의 프로젝트에 집중하고, 직원별 진행률을 조정해 프로젝트 전체 상태를 관리하세요.</p>${activeCard()}${project()?`<div class="grid metrics"><div class="panel metric"><div class="muted small">전체 업무</div><strong>${ts.length}</strong></div><div class="panel metric"><div class="muted small">완료</div><strong>${d}</strong></div><div class="panel metric"><div class="muted small">검토 대기</div><strong>${rev}</strong></div><div class="panel metric"><div class="muted small">마감 지연</div><strong>${over}</strong></div></div><div class="cols"><section class="panel"><div class="row wrap"><h2 style="margin:0;font-size:19px">우선 처리할 업무</h2><button class="btn tiny" onclick="editTask()">＋ 업무 추가</button></div>${taskRows(ts.filter(t=>!done(t)).sort((a,b)=>(a.status==='review'?-1:0)-(b.status==='review'?-1:0)).slice(0,6))}<button class="btn alt" style="width:100%;margin-top:14px" onclick="navigate('work')">전체 업무 보기</button></section><section class="panel"><h2 style="margin:0 0 13px;font-size:19px">팀원별 진행 현황</h2>${peopleSummary(ts)}<button class="btn alt" style="width:100%;margin-top:15px" onclick="navigate('report')">직원별 진행률 관리 →</button></section></div>`:''}`}
function taskRows(ts){if(!ts.length)return `<div class="empty">표시할 업무가 없어요.</div>`;return ts.map(t=>`<div class="task"><div><strong>${E(t.title)}</strong><p class="small muted">${E(name(t.assigneeId))} · ${status(t.status)}${t.due?' · 마감 '+E(t.due):''}</p></div><div class="task-controls"><button class="btn alt tiny" onclick="editTask('${E(t.id)}')">수정</button><select class="field" style="width:auto;padding:8px" aria-label="업무 상태" onchange="setTaskStatus('${E(t.id)}',this.value)">${['todo','progress','review','done'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div></div>`).join('')}
function workPage(){let p=project();if(!p)return activeCard();let ts=tasks().filter(t=>filter==='all'||(filter==='done'?done(t):t.status===filter));return `<div class="row wrap" style="margin-bottom:18px"><div class="muted">${E(p.name)} · 업무 등록 및 담당자 배정</div><button class="btn" onclick="editTask()">＋ 업무 만들기</button></div><div class="tabs" style="margin-bottom:16px">${[['all','전체'],['todo','할 일'],['progress','진행 중'],['review','검토 대기'],['done','완료']].map(([k,v])=>`<button class="${filter===k?'active':''}" onclick="filter='${k}';render()">${v}</button>`).join('')}</div><div class="panel">${taskRows(ts)}</div><div class="hint" style="margin-top:15px">직원별 작업 진행률은 ‘진행 분석’에서 직접 입력하세요. 업무 상태는 별도로 관리됩니다.</div>`}
function peopleSummary(ts){let counts=data.members.map(m=>({m,total:ts.filter(t=>t.assigneeId===m.id).length,done:ts.filter(t=>t.assigneeId===m.id&&done(t)).length}));return counts.map(({m,total,done:d})=>`<div class="person"><span class="avatar">${E(m.name?.slice(0,1)||'팀')}</span><div class="info"><strong>${E(m.name)}</strong><span class="muted small">${E(m.role||'팀원')} · 완료 ${d}/${total}</span></div><span class="badge">${total?Math.round(d/total*100):0}%</span></div>`).join('')||'<div class="empty">직원을 등록해 주세요</div>'}
function peoplePage(){return `<div class="row wrap" style="margin-bottom:17px"><p class="muted" style="margin:0">가상 팀원으로 시작하고, 필요할 때 추가·수정·삭제하세요.</p><button class="btn" onclick="editMember()">＋ 직원 추가</button></div><div class="panel">${data.members.map(m=>`<div class="person"><span class="avatar">${E(m.name?.slice(0,1))}</span><div class="info"><strong>${E(m.name)}</strong><span class="muted small">${E(m.role||'팀원')}</span></div><button class="btn alt tiny" onclick="editMember('${E(m.id)}')">관리</button></div>`).join('')||'<div class="empty">등록된 직원이 없습니다.</div>'}</div><div class="hint" style="margin-top:14px">업무를 만들 때 업무 분야에 맞는 직원이 추천돼요. 배정 결과는 직접 변경할 수 있습니다.</div>`}
function recs(title){let z=(title||'').toLowerCase();let keys=[['디자인|ui|ux|화면|시안','디자'],['api|서버|db|데이터|인증|백엔드','백엔드'],['프론트|웹|컴포넌트|퍼블리싱|html|css','프론트'],['기획|요구|정책|일정|분석','기획']];let key=keys.find(([regex])=>new RegExp(regex).test(z))?.[1];if(key){let m=data.members.find(m=>(m.role||'').includes(key));if(m)return m.id}let counts=Object.fromEntries(data.members.map(m=>[m.id,tasks().filter(t=>t.assigneeId===m.id&&!done(t)).length]));return [...data.members].sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0))[0]?.id||''}
function editTask(id=''){let t=data.tasks.find(t=>t.id===id)||{title:'',description:'',assigneeId:'',status:'todo',priority:'medium',due:''};openModal(`<h2>${id?'업무 수정':'새 업무 만들기'}</h2><form onsubmit="saveTask(event,'${E(id)}')"><label class="fieldlabel">업무 이름 *</label><input class="field" id="tasktitle" name="title" maxlength="110" required value="${E(t.title)}" oninput="suggestAssignee(this.value)" placeholder="예: 로그인 API 개발"><label class="fieldlabel">업무 내용</label><textarea class="field" name="description" rows="3">${E(t.description||'')}</textarea><div class="two"><div><label class="fieldlabel">담당 직원</label><select class="field" id="assignee" name="assigneeId"><option value="">미배정</option>${data.members.map(m=>`<option value="${E(m.id)}" ${t.assigneeId===m.id?'selected':''}>${E(m.name)} · ${E(m.role)}</option>`).join('')}</select></div><div><label class="fieldlabel">상태</label><select class="field" name="status">${['todo','progress','review','done'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${status(s)}</option>`).join('')}</select></div></div><label class="fieldlabel">마감일 (선택)</label><input class="field" type="date" name="due" value="${E(t.due||'')}"><div class="actions">${id?`<button type="button" class="btn danger" onclick="deleteTask('${E(id)}')">삭제</button>`:''}<button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`);if(!id)suggestAssignee('')}
function suggestAssignee(value){let el=document.getElementById('assignee');if(el&&(!el.dataset.changed||el.value===''))el.value=recs(value);if(el&&!el.dataset.bound){el.dataset.bound='1';el.addEventListener('change',()=>el.dataset.changed='1')}}
function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),t=data.tasks.find(x=>x.id===id),oldDone=t&&done(t),newStatus=f.get('status');if(!t){t={id:uid(),projectId:pref.activeId,createdAt:stamp()};data.tasks.push(t)}Object.assign(t,{title:String(f.get('title')).trim(),description:String(f.get('description')),assigneeId:String(f.get('assigneeId')),status:newStatus,due:String(f.get('due'))});if(!oldDone&&done(t))t.completedAt=stamp();if(oldDone&&!done(t))t.completedAt=null;closeModal();saveChange('업무를 저장했어요')}
function setTaskStatus(id,s){let t=data.tasks.find(t=>t.id===id);if(!t)return;let was=done(t);t.status=s;if(!was&&done(t))t.completedAt=stamp();if(was&&!done(t))t.completedAt=null;saveChange('업무 상태를 변경했어요')}
function deleteTask(id){if(!confirm('이 업무를 삭제할까요?'))return;data.tasks=data.tasks.filter(t=>t.id!==id);closeModal();saveChange('업무를 삭제했어요')}
function editMember(id=''){let m=data.members.find(x=>x.id===id)||{name:'',role:''};openModal(`<h2>${id?'직원 정보 수정':'직원 추가'}</h2><form onsubmit="saveMember(event,'${E(id)}')"><label class="fieldlabel">이름 *</label><input class="field" name="name" value="${E(m.name)}" required maxlength="40"><label class="fieldlabel">담당 업무 / 직무</label><input class="field" name="role" value="${E(m.role)}" maxlength="70" placeholder="예: 프론트엔드 개발자"><div class="actions">${id?`<button type="button" class="btn danger" onclick="deleteMember('${E(id)}')">삭제</button>`:''}<button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">저장</button></div></form>`)}
function saveMember(e,id){e.preventDefault();let f=new FormData(e.target),m=data.members.find(x=>x.id===id);if(!m){m={id:uid()};data.members.push(m)}m.name=String(f.get('name')).trim();m.role=String(f.get('role')).trim();closeModal();saveChange('직원 정보를 저장했어요')}
function deleteMember(id){if(!confirm('이 직원을 삭제할까요? 기존 담당 업무는 미배정으로 변경됩니다.'))return;data.members=data.members.filter(m=>m.id!==id);data.tasks.forEach(t=>{if(t.assigneeId===id)t.assigneeId=''});closeModal();saveChange('직원을 삭제했어요')}
function projectTemplates(kind){let common=[['요구사항 정리','기획'],['화면 구조와 사용자 흐름 설계','디자인'],['디자인 시안 및 UI 가이드','디자인'],['프론트엔드 주요 화면 구현','프론트'],['서버 API 및 데이터 설계','백엔드'],['프론트엔드·서버 연동','프론트'],['기능 통합 테스트','기획'],['오류 수정 및 최종 검수','백엔드']];if(kind==='mobile')return [['앱 기능 및 화면 정의','기획'],['모바일 UI/UX 시안','디자인'],['앱 주요 화면 구현','프론트'],['서버 데이터/API 구축','백엔드'],['로그인 및 데이터 연동','백엔드'],['기기별 UI 테스트','디자인'],['통합 테스트·버그 수정','프론트'],['배포 준비·최종 검수','기획']];if(kind==='general')return [['목표·범위 확정','기획'],['세부 일정·업무 구조 정의','기획'],['사용자 경험 및 결과물 설계','디자인'],['핵심 작업 1차 구현','프론트'],['데이터·운영 구조 준비','백엔드'],['중간 결과 검토 및 수정','디자인'],['전체 품질 검토','기획'],['최종 결과물 정리','백엔드']];return common}
function pickByRole(role,counts){let all=data.members;if(!all.length)return '';let tests={기획:/기획|pm|관리|분석|qa|테스트/i,디자인:/디자인|ui|ux|시각/i,프론트:/프론트|웹|앱|클라이언트|퍼블리싱/i,백엔드:/백엔드|서버|api|db|데이터/i};let possible=all.filter(m=>tests[role]?.test(m.role||''));if(!possible.length)possible=all;return [...possible].sort((a,b)=>(counts[a.id]||0)-(counts[b.id]||0))[0].id}
const FEATURE_LIBRARY={login:{name:'로그인·회원가입',tasks:[['로그인·가입 화면 및 입력 검증','프론트'],['인증 API·비밀번호 보안·세션 처리','백엔드'],['로그인 시나리오 및 오류 검증','기획']]},board:{name:'게시판·댓글',tasks:[['게시판 목록·작성·상세 화면','프론트'],['게시글·댓글 데이터 API','백엔드'],['게시글 권한·신고·예외 테스트','기획']]},admin:{name:'관리자센터',tasks:[['관리자 화면 구성 및 UX','디자인'],['관리자 대시보드·관리 기능 UI','프론트'],['관리 권한·서버 API','백엔드']]},payment:{name:'결제·주문',tasks:[['결제·주문 사용자 흐름 설계','기획'],['장바구니·결제 UI','프론트'],['서버 주문 검증·결제 연동 구조','백엔드'],['결제 실패·취소·환불 시나리오 테스트','기획']]},search:{name:'검색·필터',tasks:[['검색·필터 인터페이스','디자인'],['검색 결과·필터 화면 구현','프론트'],['검색 API·정렬·페이지네이션','백엔드']]},notification:{name:'알림',tasks:[['알림함 및 알림 상태 UI','프론트'],['알림 데이터·발송 규칙 구현','백엔드'],['알림 동작·중복 수신 테스트','기획']]},profile:{name:'내 정보·프로필',tasks:[['프로필 편집 화면 설계','디자인'],['프로필 화면·유효성 검사','프론트'],['프로필 저장·정보 수정 API','백엔드']]},dashboard:{name:'통계·대시보드',tasks:[['지표·분석 화면 설계','기획'],['통계 카드 및 시각화 화면','프론트'],['집계 API·데이터 정확성 검사','백엔드']]},upload:{name:'파일·이미지 업로드',tasks:[['파일 첨부 및 미리보기 UI','프론트'],['업로드 검증·저장·접근 제어','백엔드'],['파일 제한·오류·삭제 테스트','기획']]},reservation:{name:'예약·일정',tasks:[['예약·캘린더 화면 설계','디자인'],['예약 선택 및 일정 UI','프론트'],['중복 예약 방지·일정 API','백엔드']]}};
function requestedTasks(kind,features){let base=kind==='none'?[]:projectTemplates(kind);for(let id of features){let pack=FEATURE_LIBRARY[id];if(pack)base.push(...pack.tasks.map(t=>[t[0],t[1],id]))}return base}
function seedProjectTasks(id,kind,features=[]){let counts=Object.fromEntries(data.members.map(m=>[m.id,0]));let items=requestedTasks(kind,features);for(let [title,role,feature] of items){let assigneeId=pickByRole(role,counts);if(assigneeId)counts[assigneeId]=(counts[assigneeId]||0)+1;data.tasks.push({id:uid(),projectId:id,title,description:`${feature?'선택 기능: '+FEATURE_LIBRARY[feature].name+' · ':''}자동 생성된 시뮬레이션 업무입니다. 실제 요구사항에 맞게 수정하세요.`,assigneeId,status:'todo',priority:'medium',createdAt:stamp(),due:'',featureId:feature||'',suggestedRole:role})}return items.length}
function featurePicker(selected=[]){return `<div class="featuregrid">${Object.entries(FEATURE_LIBRARY).map(([key,item])=>`<label class="featurechoice"><input type="checkbox" name="feature" value="${key}" ${selected.includes(key)?'checked':''}><span>${E(item.name)}</span><small>${item.tasks.length}개 업무</small></label>`).join('')}</div>`}
function updateFeatureEstimate(){let form=document.getElementById('projectForm');if(!form)return;let features=[...form.querySelectorAll('[name="feature"]:checked')].map(el=>el.value);let n=(form.elements.autoseed?.checked?projectTemplates(form.elements.kind.value).length:0)+features.reduce((a,k)=>a+(FEATURE_LIBRARY[k]?.tasks.length||0),0);let box=document.getElementById('featureEstimate');if(box)box.textContent=`예상 생성 업무 ${n}개 · 등록 직원 ${data.members.length}명에게 역할·현재 배정 수를 고려해 자동 배분`;}
function editProject(id=''){let p=data.projects.find(p=>p.id===id)||{name:'',description:''};openModal(`<h2>${id?'프로젝트 수정':'새 프로젝트 시작'}</h2><p class="muted small">${id?'이름과 설명을 수정할 수 있어요. 기능을 추가하려면 아래의 기능 확장 메뉴를 사용하세요.':'이름·유형과 만들 기능만 선택하세요. 업무는 자동 배정하고 나중에 자유롭게 고칠 수 있어요.'}</p><form id="projectForm" onsubmit="saveProject(event,'${E(id)}')"><label class="fieldlabel">프로젝트 이름 *</label><input class="field" name="name" value="${E(p.name)}" required maxlength="90" placeholder="예: 온라인 쇼핑몰 개발"><label class="fieldlabel">예상 프로젝트 기간</label><select name="duration" class="field">${Object.entries(DURATIONS).map(([key,val])=>`<option value="${key}" ${((p.duration||'m1')===key)?'selected':''}>${val[0]}</option>`).join('')}</select><label class="fieldlabel">프로젝트 시작일</label><input class="field" type="date" name="startDate" value="${E((p.startDate||p.createdAt||today()).slice(0,10))}"><label class="fieldlabel">프로젝트 설명 (선택)</label><textarea class="field" name="description" rows="2" placeholder="목표나 주요 기능을 간단하게 적어주세요">${E(p.description||'')}</textarea>${!id?`<label class="fieldlabel">프로젝트 유형</label><select name="kind" class="field" onchange="updateFeatureEstimate()"><option value="web">웹사이트 / 웹앱 개발</option><option value="mobile">모바일 앱 개발</option><option value="general">일반 개발 프로젝트</option></select><label class="checkline"><input type="checkbox" name="autoseed" checked onchange="updateFeatureEstimate()"> 기본 프로젝트 업무 8개 생성</label><label class="fieldlabel">추가할 기능 선택 (여러 개 가능)</label><div onchange="updateFeatureEstimate()">${featurePicker()}</div><div class="hint" id="featureEstimate">기능별 추가 업무를 계산합니다.</div><div class="hint" style="margin-top:8px">자동 생성은 실제 요구사항 분석이 아닌 <strong>업무 템플릿 시뮬레이션</strong>입니다. 직원을 추가한 뒤에도 새 업무 배정·담당자 변경이 가능합니다.</div>`:''}<div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">${id?'변경 저장':'프로젝트 시작'}</button></div></form>`);updateFeatureEstimate()}
function scheduleProjectTasks(p){let ts=data.tasks.filter(t=>t.projectId===p.id),days=DURATIONS[p.duration]?.[1]||30,start=new Date((p.startDate||today())+'T12:00:00');let per=new Map();ts.forEach(t=>{let a=per.get(t.assigneeId)||[];a.push(t);per.set(t.assigneeId,a)});per.forEach(arr=>arr.forEach((t,i)=>{if(!t.due){let d=new Date(start.getTime()+Math.ceil((i+1)*days/arr.length)*86400000);t.due=d.toLocaleDateString('sv-SE')}}))}
function saveProject(e,id){e.preventDefault();let f=new FormData(e.target),p=data.projects.find(x=>x.id===id),newProject=!p;if(!p){p={id:uid(),createdAt:stamp(),status:'active'};data.projects.push(p)}p.name=String(f.get('name')).trim();p.description=String(f.get('description')).trim();p.duration=String(f.get('duration')||'m1');p.startDate=String(f.get('startDate')||today());pref.activeId=p.id;if(newProject){p.kind=String(f.get('kind')||'web');p.features=f.getAll('feature').map(String);if(f.has('autoseed')||p.features.length){let count=seedProjectTasks(p.id,f.has('autoseed')?p.kind:'none',p.features);scheduleProjectTasks(p);toast(`${count}개 업무를 자동 배정했어요`)}}closeModal();navigate('home');saveChange(newProject?'새 프로젝트를 시작했어요':'프로젝트를 수정했어요')}
function addProjectFeatures(){let p=project();if(!p)return;let selected=new Set((p.features||[]));openModal(`<h2>프로젝트 기능 추가</h2><p class="muted small">이미 선택한 기능은 잠금 표시되고 중복 생성되지 않아요. 새 기능을 선택하면 관련 업무가 현재 직원에게 자동 배정돼요.</p><form onsubmit="saveAddedFeatures(event)"><div onchange="updateAddEstimate()">${Object.entries(FEATURE_LIBRARY).map(([key,item])=>`<label class="featurechoice" style="margin:7px 0"><input type="checkbox" name="feature" value="${key}" ${selected.has(key)?'checked disabled':''}><span>${E(item.name)} ${selected.has(key)?'· 이미 추가됨':''}</span><small>${item.tasks.length}개</small></label>`).join('')}</div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button class="btn">선택 기능 업무 생성</button></div></form>`)}
function saveAddedFeatures(e){e.preventDefault();let p=project();if(!p)return;let f=new FormData(e.target),selected=f.getAll('feature').filter(x=>!(p.features||[]).includes(x));if(!selected.length){toast('새 기능을 선택해 주세요');return}let counts=Object.fromEntries(data.members.map(m=>[m.id,data.tasks.filter(t=>t.projectId===p.id&&t.assigneeId===m.id&&!done(t)).length]));for(let key of selected){for(let [title,role] of FEATURE_LIBRARY[key].tasks){let assigneeId=pickByRole(role,counts);if(assigneeId)counts[assigneeId]=(counts[assigneeId]||0)+1;data.tasks.push({id:uid(),projectId:p.id,title,description:`추가 기능: ${FEATURE_LIBRARY[key].name} · 제안 업무`,assigneeId,status:'todo',priority:'medium',createdAt:stamp(),due:'',featureId:key,suggestedRole:role})}}p.features=[...(p.features||[]),...selected];closeModal();saveChange(`${selected.length}개 기능의 업무가 생성됐어요`)}
function selectProject(id){pref.activeId=id;saveChange('현재 프로젝트를 변경했어요')}
function finishProject(){let p=project();if(!p)return;if(!confirm(`“${p.name}” 프로젝트를 완료 처리할까요? 기존 기록은 그대로 보관됩니다.`))return;p.status='completed';p.finishedAt=stamp();pref.activeId=data.projects.find(x=>x.id!==p.id&&x.status!=='completed')?.id||'';saveChange('프로젝트를 완료 처리했어요')}
function reports(){return data.managerReports.filter(r=>r.projectId===pref.activeId).sort((a,b)=>b.date.localeCompare(a.date))}
function reportPage(){let p=project();if(!p)return activeCard();let d=today(),r=reports(),todayTs=tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===d),todayCount=todayTs.length;let entries=data.dailyReports.filter(x=>x.projectId===p.id&&((x.date||x.createdAt||'').slice(0,10)===d));return `<div class="hint">회사 업무 종료 기준은 <strong>18:00</strong>으로 설정했어요. 18시 이전에도 초안을 저장할 수 있고, 퇴근 후 직원들의 보고 내용을 확인해 최종 보고서를 작성하면 됩니다.</div><div class="grid metrics"><div class="panel metric"><div class="muted small">오늘 완료 업무</div><strong>${todayCount}</strong></div><div class="panel metric"><div class="muted small">프로젝트 진행률</div><strong>${progress(tasks())}%</strong></div><div class="panel metric"><div class="muted small">직원 일일 보고</div><strong>${entries.length}</strong></div><div class="panel metric"><div class="muted small">기록된 담당자 보고</div><strong>${r.length}</strong></div></div><div class="cols"><div class="panel"><div class="row wrap"><h2 style="font-size:19px;margin:0">담당자 하루 보고서</h2><button class="btn" onclick="editReport()">＋ ${r.some(x=>x.date===d)?'오늘 보고 수정':'오늘 보고 작성'}</button></div><p class="muted small">기존 직원 보고와 업무 완료 기록을 참고해 상사에게 보고할 내용을 작성해요.</p>${r.length?r.map(x=>`<div class="task"><div><strong>${E(x.date)} · ${E(x.title||'일일 업무 결과')}</strong><p class="muted small">${x.submittedAt?'보고 완료':'임시 저장'} · ${E((x.summary||'').slice(0,65))}</p></div><button class="btn alt tiny" onclick="editReport('${E(x.id)}')">열기</button></div>`).join(''):'<div class="empty">아직 작성한 하루 보고서가 없어요.</div>'}</div><div class="panel"><h2 style="font-size:19px;margin:0 0 14px">오늘의 팀원 성과</h2>${peopleSummary(tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===d))}<div class="section"><h2>오늘 완료한 업무</h2></div>${todayTs.length?todayTs.map(t=>`<div class="person"><div class="info"><strong>${E(t.title)}</strong><span class="muted small">${E(name(t.assigneeId))}</span></div></div>`).join(''):'<div class="empty">오늘 완료 시간 기록이 있는 업무가 없어요. 이전 버전의 완료 업무는 날짜를 추정하지 않습니다.</div>'}</div></div>`}
function reportDayTasks(date){return tasks().filter(t=>done(t)&&t.completedAt?.slice(0,10)===date)}
function employeeAssessments(date,old){return data.members.map(m=>{let a=(old?.assessments||[]).find(x=>x.memberId===m.id)||{};let todayDone=reportDayTasks(date).filter(t=>t.assigneeId===m.id);return {m,a,todayDone}})}
function editReport(id=''){let r=data.managerReports.find(x=>x.id===id)||data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===today())||{date:today(),summary:'',next:'',issues:'',title:'일일 업무 결과'};openModal(`<h2>하루 보고서 간편 작성</h2><p class="muted small">직원별 상태와 점수, 체크 항목만 선택해도 보고서 초안을 만들어줘요.</p><form id="reportForm" onsubmit="saveReport(event,'${E(r.id||'')}')"><label class="fieldlabel">보고 날짜</label><input class="field" type="date" name="date" required value="${E(r.date)}" onchange="refreshReportAssessments(this.value)"><div id="assessments">${assessmentFields(r.date,r)}</div><div class="reporttools"><button class="btn alt" type="button" onclick="generateReportDraft()">✦ 선택 항목으로 보고서 자동 작성</button><button class="btn alt" type="button" onclick="copyReportText()">보고서 복사</button></div><label class="fieldlabel">자동 생성된 상사 보고서 · 직접 수정 가능 *</label><textarea class="field" name="summary" required rows="10" placeholder="위에서 항목을 선택하고 자동 작성 버튼을 누르세요">${E(r.summary||'')}</textarea><label class="fieldlabel">내일 할 일 (선택)</label><textarea class="field" name="next" rows="2">${E(r.next||'')}</textarea><label class="fieldlabel">문제점 및 지원 요청 (선택)</label><textarea class="field" name="issues" rows="2">${E(r.issues||'')}</textarea><div class="hint" style="margin-top:14px">18시 이후에 최종 제출하는 흐름을 권장해요. 18시 이전에도 보고서를 작성·저장할 수 있어요. 이 기능은 문장 자동 생성이며 실제 AI API를 호출하지 않아요.</div><div class="actions"><button type="button" class="btn alt" onclick="closeModal()">취소</button><button type="submit" class="btn alt" onclick="this.form.dataset.submit='draft'">임시 저장</button><button type="submit" class="btn" onclick="this.form.dataset.submit='send'">보고 완료</button></div></form>`)}
function assessmentFields(date,r){return employeeAssessments(date,r).map(({m,a,todayDone})=>`<div class="scorecard" data-member="${E(m.id)}"><div class="scorehead"><strong>${E(m.name)} <span class="muted small">· ${E(m.role||'직원')}</span></strong><span class="badge">기록상 완료 ${todayDone.length}건</span></div><div class="scoregrid"><div><label class="fieldlabel">오늘 업무 상태</label><select class="field as-state"><option value="normal" ${a.state==='normal'?'selected':''}>정상 진행</option><option value="fast" ${a.state==='fast'?'selected':''}>계획보다 빠름</option><option value="slow" ${a.state==='slow'?'selected':''}>일부 지연</option><option value="blocked" ${a.state==='blocked'?'selected':''}>지원 필요</option><option value="off" ${a.state==='off'?'selected':''}>업무 없음 / 휴무</option></select></div><div><label class="fieldlabel">평가 점수 (선택)</label><select class="field as-score"><option value="" ${a.score===''||a.score==null?'selected':''}>점수 미입력</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${Number(a.score)===n?'selected':''}>${n}점 / 5점</option>`).join('')}</select></div></div><label class="checkline"><input type="checkbox" class="as-plan" ${a.plan?'checked':''}> 오늘 계획 업무를 수행함</label><label class="checkline"><input type="checkbox" class="as-share" ${a.share?'checked':''}> 진행 상황을 보고·공유함</label><label class="checkline"><input type="checkbox" class="as-quality" ${a.quality?'checked':''}> 검토 가능한 결과물이 있음</label><label class="fieldlabel">추가 메모 (선택)</label><input class="field as-memo" maxlength="250" value="${E(a.memo||'')}" placeholder="예: 로그인 화면 완성, 테스트 필요"></div>`).join('')||'<div class="empty">직원을 먼저 추가하세요.</div>'}
function refreshReportAssessments(date){let r=data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===date);document.getElementById('assessments').innerHTML=assessmentFields(date,r);if(r){let f=document.getElementById('reportForm');f.elements.summary.value=r.summary||'';f.elements.next.value=r.next||'';f.elements.issues.value=r.issues||''}}
function collectAssessments(){return [...document.querySelectorAll('#assessments [data-member]')].map(el=>({memberId:el.dataset.member,state:el.querySelector('.as-state').value,score:el.querySelector('.as-score').value,plan:el.querySelector('.as-plan').checked,share:el.querySelector('.as-share').checked,quality:el.querySelector('.as-quality').checked,memo:el.querySelector('.as-memo').value.trim()}))}
function generateReportDraft(){let f=document.getElementById('reportForm'),date=f.elements.date.value,ts=tasks(),completed=reportDayTasks(date),ass=collectAssessments(),labels={normal:'정상 진행',fast:'계획보다 빠르게 진행',slow:'일부 지연',blocked:'추가 지원 필요',off:'업무 없음 또는 휴무'};let lines=[`[${date} 프로젝트 일일 업무보고]`,`프로젝트: ${project()?.name||''}`,`진행 현황: 전체 ${ts.length}건 중 완료 ${ts.filter(done).length}건 (진행률 ${progress(ts)}%)`,`당일 완료 기록: ${completed.length}건`,'','■ 직원별 보고'];for(let a of ass){let m=data.members.find(x=>x.id===a.memberId),dt=completed.filter(t=>t.assigneeId===a.memberId),checks=[a.plan&&'계획 업무 수행',a.share&&'진행 상황 공유',a.quality&&'검토 가능 결과물'].filter(Boolean);lines.push(`- ${m?.name||'직원'} (${m?.role||'담당'}): ${labels[a.state]}${a.score?' / 자체 평가 '+a.score+'점(5점 만점)':''}; 체크 ${checks.length}/3${checks.length?' ['+checks.join(', ')+']':''}; 당일 완료 기록 ${dt.length}건${dt.length?' ('+dt.map(t=>t.title).join(', ')+')':''}${a.memo?' / 메모: '+a.memo:''}`)}lines.push('','■ 종합 의견',`총 ${ass.length}명의 입력 내용을 기준으로 정리했습니다. 체크 항목과 평점은 담당자 입력 값이며, 실제 작업 기록과는 구분됩니다.`);f.elements.summary.value=lines.join('\n');toast('보고서 초안을 작성했어요. 확인 후 저장하세요.')}
async function copyReportText(){let f=document.getElementById('reportForm');try{await navigator.clipboard.writeText([f.elements.summary.value,f.elements.next.value&&'내일 계획: '+f.elements.next.value,f.elements.issues.value&&'지원 요청: '+f.elements.issues.value].filter(Boolean).join('\n\n'));toast('보고서 내용을 복사했어요')}catch(e){f.elements.summary.focus();f.elements.summary.select();toast('복사가 제한되어 텍스트를 선택했어요')}}
function saveReport(e,id){e.preventDefault();let f=new FormData(e.target),date=String(f.get('date')),r=data.managerReports.find(x=>x.id===id&&x.projectId===pref.activeId)||data.managerReports.find(x=>x.projectId===pref.activeId&&x.date===date);if(!r){r={id:uid(),projectId:pref.activeId,createdAt:stamp()};data.managerReports.push(r)}Object.assign(r,{date,title:'일일 업무 결과',summary:String(f.get('summary')),next:String(f.get('next')),issues:String(f.get('issues')),assessments:collectAssessments(),updatedAt:stamp()});if(e.target.dataset.submit==='send')r.submittedAt=stamp();else r.submittedAt=null;closeModal();saveChange(r.submittedAt?'하루 보고서를 완료했어요':'보고서를 임시 저장했어요')}
function morePage(){let p=project();return `<div class="section" style="margin-top:0"><h2>프로젝트 운영</h2><button class="btn" onclick="editProject()">＋ 새 프로젝트</button></div><div class="panel"><div class="hint">한 번에 하나의 프로젝트가 중심에 표시됩니다. 다른 프로젝트도 삭제되지 않으며 언제든 다시 선택할 수 있어요.</div>${data.projects.map(x=>`<div class="task"><div><strong>${E(x.name)} ${pref.activeId===x.id?'<span class="badge">진행 중</span>':''}</strong><p class="muted small">${x.status==='completed'?'완료 · 기록 보관':'업무 '+data.tasks.filter(t=>t.projectId===x.id).length+'건 · 완료 '+progress(data.tasks.filter(t=>t.projectId===x.id))+'%'}</p></div><div class="task-controls">${pref.activeId!==x.id?`<button class="btn alt tiny" onclick="selectProject('${E(x.id)}')">진행 선택</button>`:`<button class="btn alt tiny" onclick="editProject('${E(x.id)}')">수정</button>`}</div></div>`).join('')||'<div class="empty">등록된 프로젝트가 없습니다.</div>'}${p?`<button class="btn" onclick="addProjectFeatures()" style="margin-top:16px;width:100%">＋ 현재 프로젝트에 기능 추가 · 업무 자동 생성</button><button class="btn alt" onclick="finishProject()" style="margin-top:16px;width:100%">현재 프로젝트 완료 처리</button>`:''}</div><div class="section"><h2>데이터 및 환경</h2></div><div class="panel"><div class="row wrap"><div><strong>데이터 백업</strong><div class="muted small">프로젝트·직원·업무·보고서 전체를 JSON으로 저장</div></div><button class="btn alt tiny" onclick="exportData()">백업 다운로드</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>데이터 불러오기</strong><div class="muted small">기존 NEXUS 백업 파일도 사용할 수 있어요.</div></div><button class="btn alt tiny" onclick="document.getElementById('import').click()">JSON 불러오기</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="row wrap"><div><strong>화면 테마</strong><div class="muted small">라이트 / 다크 모드</div></div><button class="btn alt tiny" onclick="toggleTheme()">테마 변경</button></div></div>`}
function exportData(){persist();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||!Array.isArray(d.members)||!Array.isArray(d.tasks))throw Error('올바른 NEXUS 백업이 아닙니다');if(!confirm('현재 데이터가 불러온 데이터로 교체됩니다. 계속할까요?'))return;localStorage.setItem(KEY,JSON.stringify(d));data=d;load();saveChange('백업 데이터를 복원했어요')}catch(err){alert('불러오기 실패: '+err.message)}finally{e.target.value=''}}
function openModal(s){document.getElementById('dialog').innerHTML=s;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
load();render();
</script></body></html>
